           c.verified_at,c.served_at,c.service_kind,vdVenueName||'',c._error||'',c._notice||'',locale].join('|');
  if(sig===recordSig)return;
  recordSig=sig;
  var h=recordHeadHtml(c,'title.second_check_done',true,'');
  h+=railHtml(c);
  h+=referenceHtml(c);
  h+=actionTailHtml(c,{a:'serve',label:tt('hold.serve'),cls:'act',aria:tt('hold.serve')},true);
  lc.innerHTML=h;
}

// Served success. Records only what happened: the Kitchen step was recorded on this display.
// It claims nothing about the guest, the plate, or safety, and nothing about who pressed it.
function renderServedDone(c,lc){
  var id=c.id;
  var sig=['served',id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c._assetLabel,
           c.served_at,c.service_kind,vdVenueName||'',(vdIdentity&&vdIdentity.display_name)||'',locale].join('|');
  if(sig===recordSig)return;
  recordSig=sig;
  var h=recordHeadHtml(c,'title.served_done',true,'');
  h+=railHtml(c);
  h+='<div class="vfy-act"><div class="vfy-do">'+th('do.complete')+'</div>'+provHtml()
    +'<button type="button" class="vfy-back vfy-back--only" onclick="closeRecord()">'+th('nav.back')+'</button></div>';
  lc.innerHTML=h;
}

// ── ANAPHYLAXIS LOCKOUT QUEUE (refactor decision 2) ─────────────────────────────────────
// The lockout is one screen, so it shows ONE declaration — lockoutId — and every other pending
// anaphylaxis lockout waits in lockoutQueue in arrival order. A second arrival never overwrites
// the first: showLockout() used to render straight into the single slot, so two declarations
// in one moment left the first one's lockout replaced and never acknowledged on this screen.
// Each is acknowledged individually; one hold never stands in for several cases.
//
// Eligibility is read from the record, never remembered: un-acknowledged (DATABASE-confirmed
// kitchen_ack_at — never _ackPending), anaphylaxis, still open, not superseded. A queued entry
// that stops being eligible (acknowledged on another display, served, superseded, pruned) is
// skipped when its turn comes.
var lockoutId=null;
// Which stage (and error key) the lockout is showing, so a language change redraws it in place.
var lockoutStage=null,lockoutErr=null;
var lockoutQueue=[];
// _fromCache: a card restored from this tablet's cache and not yet confirmed by any database
// read. It is drawn on the board (offline redraw) but raises NO lockout and NO alarm: the cache is
// not evidence of current state, and a record acknowledged elsewhere since must not come back as a
// lockout here. The first board read (or realtime row) that carries the record clears the flag,
// and only then is escalation decided — from database truth.
function lockoutEligible(c){return !!c&&!c._fromCache&&isAnaph(c.severity)&&isOpenWork(c)&&!c.kitchen_ack_at&&!isSupersededRow(c)}

// ── QUEUE POLICY — the ONLY place lockout ordering is decided ─────────────────────────────
// Product Owner decision (W2-K1, Oct 9 2026): an UN-ACKNOWLEDGED anaphylaxis lockout takes priority
// over a lockout that is at a ROUTINE step (Prep, or any stage after acknowledgement).
//   · Un-acknowledged records wait in lockoutQueue and are shown oldest first (created_at).
//   · A record displaced while at a routine step waits in lockoutRoutine — the ROUTINE queue — and
//     joins the BACK of it — first displaced, first back (FIFO; integrator decision). It is shown again, at the stage its own record says it is at, once no
//     un-acknowledged record is waiting. Nothing is dropped, rewritten or acknowledged by this:
//     preemption changes only what is on screen.
//   · A lockout at its ACK step is never preempted — not by a routine record, and not by another
//     un-acknowledged one (switching between two owed acknowledgements gains nothing and pulls the
//     record out from under the cook's eyes). Sole exception: within the very task that put it up,
//     before anything is painted, so a same-moment burst still opens on its oldest record.
//   · An in-flight write for the on-screen record is never interrupted: while it is outstanding
//     (_writing) or its outcome is being settled by a board read (_settling), the arrival waits. It
//     takes the screen once the write has settled — success, refusal or timeout.
//   · A HOLD running on a routine step when it is preempted is cancelled: it has written nothing and
//     writes nothing (renderLockout cancels the displaced record's hold).
//   · The on-screen record acknowledged by ANOTHER display while a routine record waits: it has lost
//     the priority it was shown for, so the waiting routine record returns (see syncLockouts).
var lockoutRoutine=[];
function lockoutRoutineEligible(c){return !!c&&!c._fromCache&&isAnaph(c.severity)&&isOpenWork(c)&&!!c.kitchen_ack_at&&!isSupersededRow(c)}
function lockoutRoutineWaiting(){
  lockoutRoutine=lockoutRoutine.filter(function(q){return q!==lockoutId&&lockoutQueue.indexOf(q)<0&&lockoutRoutineEligible(cards[q])});
  return lockoutRoutine.length;
}
// The on-screen record is at a routine step: database-confirmed acknowledged AND drawn past the
// ack step (a record acknowledged elsewhere is still at 'ack' until syncLockouts redraws it).
function lockoutAtRoutine(){var c=lockoutId&&cards[lockoutId];return !!(c&&c.kitchen_ack_at&&lockoutStage&&lockoutStage!=='ack')}
function lockoutBusy(){var c=lockoutId&&cards[lockoutId];return !!(c&&(c._writing||c._settling||(c._dwellUntil&&Date.now()<c._dwellUntil)))}
// OUTCOME DWELL. When a write for the record ON the lockout settles — success, refusal, timeout, or
// the end of a settling board read — its outcome is drawn in place ("Prep Area Cleared", "NOT
// recorded", "No response"). A waiting owed record must not replace it in the same task, before it
// is ever painted (§11: the cook who held must see what happened). So the record keeps the screen for
// LOCKOUT_DWELL_MS; the waiting record is still alarming and counted in "1 of N" meanwhile, and takes
// the screen when the dwell ends. _dwellUntil is UI-ephemeral (never cached).
var LOCKOUT_DWELL_MS=1500;
function lockoutDwell(id){var c=cards[id];if(!c||lockoutId!==id)return;
  c._dwellUntil=Date.now()+LOCKOUT_DWELL_MS;
  setTimeout(function(){if(cards[id]===c&&c._dwellUntil&&Date.now()>=c._dwellUntil){delete c._dwellUntil;syncLockouts()}},LOCKOUT_DWELL_MS+20)}
// A burst of owed arrivals in ONE task (several realtime events, one board read) is decided as a
// whole: while the record on screen was put there in this same task — nothing has been painted, so
// no cook has seen it — an OLDER owed arrival takes its place. After that task, an owed record on
// screen at its ack step keeps the screen.
var lockoutFreshId=null;
function lockoutMarkFresh(){lockoutFreshId=lockoutId;setTimeout(function(){lockoutFreshId=null},0)}
function lockoutPreempts(newId){
  if(!lockoutId||!lockoutEligible(cards[newId])||lockoutBusy())return false;
  if(lockoutAtRoutine())return true;
  return lockoutFreshId===lockoutId&&!holdTimers[lockoutId]&&lockoutEligible(cards[lockoutId])&&lockoutOldest(newId,lockoutId)<0;
}
function lockoutOldest(a,b){var ta=new Date(cards[a].created_at).getTime(),tb=new Date(cards[b].created_at).getTime();
  return ta!==tb?ta-tb:(a<b?-1:a>b?1:0)}
function lockoutNextId(){
  if(lockoutWaiting())return lockoutQueue.slice().sort(lockoutOldest)[0];
  lockoutRoutineWaiting();return lockoutRoutine[0]||null;
}
// Applied after every board change (syncLockouts): a routine lockout that is free to yield yields to
// the oldest waiting un-acknowledged record.
function lockoutApplyPriority(){
  if(!lockoutId||!lockoutAtRoutine()||lockoutBusy())return;
  if(lockoutWaiting())renderLockout(lockoutNextId(),'ack');
}
// What a record returning from the routine queue shows besides its stage: only a still-current
// failure of ITS lockout step, never an unrelated row message.
// A refusal shown on the lockout when the record was displaced is KEPT with the record
// (_lockoutErr — the row message expires after 8 s), so it returns still saying the step was NOT
// recorded — but only while the record is still at that step.
function lockoutReturnErr(c){if(!c)return null;
  if(c._lockoutErr&&c._lockoutErr.stage===lockoutStageFor(c))return c._lockoutErr.err;
  var e=c._error;return e==='err.prep'||e==='err.timeout'||e==='err.unconfirmed'?e:null}

// Idempotent. Returns true only for a declaration this screen was not already holding.
function enqueueLockout(id){
  if(!lockoutEligible(cards[id]))return false;
  if(lockoutId===id||lockoutQueue.indexOf(id)>=0)return false;
  lockoutQueue.push(id);
  // Not preempting: it waits. Preempting (or nothing on screen): the OLDEST waiting
  // un-acknowledged record takes the screen — which is this one unless an older one waits.
  if(!lockoutId||lockoutPreempts(id)){renderLockout(lockoutNextId(),'ack');lockoutMarkFresh()}
  updateLockoutQueue();
  return true;
}
// What the cook acts on: allergens, severity, cross-contact. Deliberately NOT the milestones —
// a record becoming acknowledged is progress, not new content, and must never alarm.
function lockoutContentSig(c){
  return c?[(c.allergens||[]).map(function(a){return String(a).trim().toLowerCase()}).sort().join(','),
            (c.severity||'').toLowerCase(),!!c.cross_contact].join('|'):'';
}
// A held record's content changed (a database row says so — records are immutable in normal
// operation, so this is rare and always significant). For EVERY severity: a hold that started on
// the old content is cancelled, and the generation moves on so a write already in flight against
// the old content cannot chime, advance or claim completion (see writeIsStale). Wherever the
// record is shown it is redrawn; it alarms only if it is an un-acknowledged anaphylaxis record.
function recordContentChanged(id){
  var c=cards[id];if(!c)return;
  invalidateRecord(id);
  // No longer anaphylaxis: its lockout closes (the next waiting one opens). Never leave a
  // lockout's ANAPHYLAXIS chip on a record that is not anaphylaxis.
  if(lockoutId===id&&!isAnaph(c.severity)){closeLockout();return}
  if(lockoutId===id)renderLockout(id,lockoutStage,lockoutErr);
  if(lockoutEligible(c))soundAlarm();
}
// Cancels any hold on the record and moves its generation on, so nothing in progress against
// the record as it was (a hold, or a write already in flight — see writeIsStale) can complete
// against it. Used when its content changes, when it becomes superseded (by either signal), and
// when its lockout closes.
function invalidateRecord(id){
  var c=cards[id];if(c)c._gen=(c._gen||0)+1;
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  if(recordOpenId===id)recordHolding=false;
}
function showLockout(id){if(enqueueLockout(id))soundAlarm()}
function lockoutWaiting(){
  lockoutQueue=lockoutQueue.filter(function(q){return q!==lockoutId&&lockoutEligible(cards[q])});
  return lockoutQueue.length;
}
// "1 of N", in place — a text update never rebuilds the hold button under a finger.
function updateLockoutQueue(){
  var el=document.getElementById('lkQueue');if(!el)return;
  var n=lockoutId?1+lockoutWaiting()+lockoutRoutineWaiting():0;
  el.hidden=n<2;el.textContent=n<2?'':tt('lock.queue',{n:n});
  var al=document.getElementById('lkAlso'),m=lockoutId?sameVisitOthers(cards[lockoutId]):0;
  if(al){al.hidden=!m;al.textContent=m?tt('card.also_here',{n:m}):''}
}
function advanceLockout(){
  var next=lockoutNextId();
  // renderLockout takes it out of its queue. A record returning from the routine queue comes back
  // at the stage its record is at now.
  if(next)renderLockout(next,lockoutStageFor(cards[next]),cards[next].kitchen_ack_at?lockoutReturnErr(cards[next]):null);
}
// Run after every board change (end of renderCards). Keeps the screen consistent with the
// records: a lockout whose record left the board closes and the next takes its place; any
// eligible record not yet held is enqueued (a safety net — ingest already enqueues); a label
// that arrived after the lockout went up is drawn — but never while a hold is running.
function syncLockouts(){
  if(lockoutId&&(!cards[lockoutId]||isSupersededRow(cards[lockoutId])||cards[lockoutId].closed_at||cards[lockoutId].served_at)){closeLockout();}
  Object.keys(cards).sort(function(a,b){return new Date(cards[a].created_at)-new Date(cards[b].created_at)})
    .forEach(function(id){if(enqueueLockout(id))soundAlarm()});
  if(lockoutId&&!holdInProgress()){
    var c=cards[lockoutId];
    // Acknowledged on another display: the screen must not keep asking for a step that is done.
    // If a routine record is waiting (it was displaced for this one) and no un-acknowledged record
    // is, the waiting one returns; this record joins the back of the routine queue at its Prep.
    if(lockoutStage==='ack'&&c.kitchen_ack_at&&!lockoutWriting()){
      if(!lockoutWaiting()&&lockoutRoutineWaiting()){var back=lockoutRoutine[0];renderLockout(back,lockoutStageFor(cards[back]),lockoutReturnErr(cards[back]))}
      else renderLockout(lockoutId,'prep');
    }
    else if(c._assetLabel!==lockoutLabel&&!lockoutWriting())renderLockout(lockoutId,lockoutStage,lockoutErr);
  }
  lockoutApplyPriority();
  updateLockoutQueue();
}
function lockoutWriting(){return !!(lockoutId&&cards[lockoutId]&&cards[lockoutId]._writing)}
var lockoutLabel=null;

// ── REPEATING ALARM ──────────────────────────────────────────────────────────────────────
// Sounds when a lockout arrives and then every ALARM_REPEAT_MS for as long as ANY anaphylaxis
// declaration on this board is un-acknowledged in the database. Not "until dismissed": nothing
// short of a confirmed acknowledgement stops it, and a failed or timed-out acknowledgement does
// not. Ignores mute (chimeAnaphylaxis forces full volume), as before.
// lastAlarmAt only advances when a sound actually played, so a board whose audio is still locked
// sounds on the first tick after the tap rather than waiting out a cycle it was silent through.
// Cache-restored cards are not eligible (see lockoutEligible), so they never sound.
var ALARM_REPEAT_MS=10000,lastAlarmAt=0;
function alarmPending(){return Object.keys(cards).some(function(id){return lockoutEligible(cards[id])})}
// SINGLE-FLIGHT PER TICK. Any number of requests in one task (a board read enqueuing N
// lockouts at boot, an ingest plus its sync) produce ONE alarm, played at the end of the task.
// chimeAnaphylaxis() itself stops a still-sounding alarm before starting, so alarms never stack.
var alarmRequested=false;
function soundAlarm(){
  if(!audioReady||!ctx||ctx.state!=='running')return false;
  lastAlarmAt=Date.now();
  if(alarmRequested)return true;
  alarmRequested=true;
  setTimeout(function(){alarmRequested=false;if(audioReady)chimeAnaphylaxis()},0);
  return true;
}
function alarmTick(){
  if(ctx&&audioReady&&ctx.state!=='running')audioStateCheck();
  if(alarmPending()&&Date.now()-lastAlarmAt>=ALARM_REPEAT_MS)soundAlarm();
}

function renderLockout(id,stage,err){
  // What the displaced record (if any) was showing, and its hold button — read BEFORE the content
  // below is replaced.
  var prevStage=lockoutStage,prevErr=lockoutErr,prevBtn=document.querySelector('#lockoutContent .hold-btn');
  var c=cards[id],lk=document.getElementById('lockout'),lc=document.getElementById('lockoutContent');
  if(!c)return;
  var allergens=(c.allergens||[]).join(', '),gn=guestLabel(c);
  var avoidHtml='';
  // Same hit/miss branch and labelling as buildCard. Severity prominence does not
  // apply here — the lockout only fires on anaphylaxis, so every block is full weight.
  (c.allergens||[]).forEach(function(a){
    var d=getAllergenDef(a);
    if(d)avoidHtml+='<div style="border-left:3px solid var(--danger);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--danger);text-transform:uppercase;margin-bottom:4px">'+th('ref.avoid_all',{allergen:a})+'</div><div style="font-size:18px;font-weight:500;color:var(--t1);line-height:1.5">'+d.map(esc).join(' · ')+'</div></div>';
    else avoidHtml+='<div style="border-left:3px solid var(--t2);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--t2);text-transform:uppercase;margin-bottom:4px">'+th('ref.check_ingredients',{allergen:a})+'</div><div style="font-size:18px;font-weight:500;color:var(--t2);line-height:1.5">'+th('ref.no_list')+'</div></div>';
  });
  // The blocking modal is the single most urgent thing this board ever shows. If it is a
  // rehearsal, that has to be the first line read — above the table, above the allergens.
  // Completed milestones sit directly under the rehearsal marker, above the record they
  // belong to, so confirmation never costs the cook the table, guest or allergens.
  lockoutStage=stage;lockoutErr=err||null;
  if((c.allergens||[]).length&&locale!==DATA_LOCALE)avoidHtml+='<div class="ref-untr" style="max-width:500px;width:100%">'+th('ref.untranslated')+'</div>';
  var done=stage==='ack'?'':'<div class="lk-ok" role="status">'+CK_DONE+th('ok.ack')+'</div>'
    +(stage==='done'?'<div class="lk-ok" role="status">'+CK_DONE+th('ok.prep')+'</div>':'');
  var tail=stage==='ack'
    ?'<div class="lockout-sub">'+stepDo('ack')+'</div><button type="button" class="hold-btn red" style="max-width:500px;width:100%;min-height:60px" aria-label="'+th('hold.ack')+'" '+HOLD_ATTRS(id)+'><div class="hold-fill"></div><span class="hold-lbl">'+th('hold.ack')+'</span></button>'
    :stage==='prep'
    // Was a plain <div onclick>: ONE TAP wrote protocol_confirmed_at. Now the same hold as
    // every other safety milestone — same HOLD_MS, fill, cancel-on-release/leave/blur, keys.
    ?'<div class="lockout-sub">'+stepDo('prep')+'</div><button type="button" class="hold-btn red" style="max-width:500px;width:100%;min-height:60px" aria-label="'+th('hold.prep')+'" '+HOLD_ATTRS(id,'prep')+'><div class="hold-fill"></div><span class="hold-lbl">'+th('hold.prep')+'</span></button>'
    :'<div class="lockout-sub">'+th('lock.next')+'</div><button type="button" class="lockout-back" onclick="closeLockout()">'+th('nav.back')+'</button>';
  // Order: REHEARSAL first (locked), then where it came from, then how many are waiting.
  lc.innerHTML=(isRehearsal(c)?'<div class="lockout-reh">'+th('reh.full')+'</div>':'')
    // A record a closed service left open. Stated, so a cook does not read it as a new arrival.
    +(c.carried_over?'<div class="lk-carried">'+th('board.carried')+'</div>':'')
    +'<div class="lk-queue" id="lkQueue" role="status" hidden></div>'
    +'<div class="lk-also" id="lkAlso" hidden></div>'+done+(err?'<div class="lk-err" role="alert">'+th(err)+'</div>':c._notice?'<div class="lk-note" role="status">'+th(c._notice)+'</div>':'')+'<div class="lockout-title">'+esc(c._assetLabel||tt('misc.table'))+'</div><div style="font-size:24px;font-weight:700;color:var(--t1);margin-bottom:8px">'+esc(gn)+'</div><div style="font-size:32px;font-weight:800;color:var(--danger);margin-bottom:16px">'+esc(allergens)+'</div><div class="lk-chips" style="display:flex;gap:8px;margin-bottom:12px"><div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">'+th('sev.anaphylaxis')+'</div>'+(c.cross_contact?'<div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">'+th('chip.cross_contact')+'</div>':'')+'</div>'+avoidHtml
    // Guest notes were missing from the lockout entirely. Verbatim, esc()'d, labelled — the
    // same rule as the record sheet.
    +(c.notes?'<div class="lk-notes"><div class="al-notes-h">'+th('notes.heading')+'</div><div class="al-notes">'+esc(c.notes)+'</div></div>':'')
    +'<div class="lk-act">'+tail+provHtml()+'</div>'
    +'<div class="lk-lang">'+langSwitchHtml()+'</div>';
  // Drawing a different record over one still owed puts the displaced one back at the FRONT of
  // the queue — never drops it.
  // A record displaced at a routine step joins the BACK of the routine queue (first displaced, first
  // back). Either way a hold
  // still running on the displaced record is cancelled — its button is gone, and it must not
  // complete (and write) against a record no longer on screen.
  if(lockoutId&&lockoutId!==id){
    // Only the LOCKOUT button's hold: holdTimers is keyed by record, and a hold elsewhere (a board
    // row) is not this screen's to cancel. endHold also resets the button and its fill.
    if(holdTimers[lockoutId]&&prevBtn&&prevBtn.classList.contains('holding'))endHold(lockoutId,prevBtn);
    if(lockoutEligible(cards[lockoutId])){if(lockoutQueue.indexOf(lockoutId)<0)lockoutQueue.unshift(lockoutId)}
    else if(lockoutRoutineEligible(cards[lockoutId])){
      var dc=cards[lockoutId],de=prevErr||lockoutReturnErr(dc);
      if(de)dc._lockoutErr={err:de,stage:prevStage};else delete dc._lockoutErr;
      lockoutRoutine=lockoutRoutine.filter(function(q){return q!==lockoutId});lockoutRoutine.push(lockoutId)}
  }
  lockoutId=id;lockoutLabel=c._assetLabel;
  lockoutQueue=lockoutQueue.filter(function(q){return q!==id});
  lockoutRoutine=lockoutRoutine.filter(function(q){return q!==id});
  delete c._lockoutErr;
  lk.classList.add('on');
  updateLockoutQueue();
}

// After Confirm Received: the SAME lockout card, now stating Allergy Received and offering the
// existing next requirement. It used to replace the whole card with a different screen.
function showLockoutProtocol(id){renderLockout(id,'prep')}

// Leaving one lockout opens the next waiting one, if any.
function closeLockout(){if(lockoutId)invalidateRecord(lockoutId);lockoutId=null;lockoutStage=null;lockoutErr=null;lockoutLabel=null;document.getElementById('lockout').classList.remove('on');advanceLockout()}

// Minimize is a local UI preference (ghosting the card into the side rail).
// The minimized_at write is bookkeeping for admin reporting. If the write
// fails the ghost state stays — operator chose to hide it — but we surface
// the error so the divergence isn't silent.
async function minimizeCard(id){
  if(!cards[id]||!cards[id].kitchen_ack_at)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(cards[id]._writing)return;
  cards[id]._writing=true;
  ghosted[id]=true;renderCards();
  var r=await writeDeclaration(id,{minimized_at:new Date().toISOString()});
  if(!cards[id])return;
  delete cards[id]._writing;
  // Intent is preserved on failure or timeout (§12.5): the operator chose to hide it.
  if(r.error){console.error('[kitchen] minimize bookkeeping failed:',r.error);showRowError(id,'err.minimize');return}
  delete cards[id]._error;
  cacheCards();
}
function restoreGhost(id){delete ghosted[id];renderCards();cacheCards()}

// (Removed: two document-level touch listeners that recorded a start X and a card, computed a
// horizontal delta on touchend and discarded it. A swipe gesture that was never finished, and
// dead weight on every touch on the board.)

function checkEscalations(){
  // Reads kitchen_ack_at DIRECTLY and must continue to. That field is database-confirmed
  // acknowledgement only (see the contract above), so an in-flight or failed attempt does
  // not appear here and cannot suppress a required escalation. Do NOT substitute isAcked()
  // — that predicate includes _ackPending and would restore the false-safety defect.
  Object.keys(cards).forEach(function(id){var c=cards[id];if(c.kitchen_ack_at||c.closed_at||c.served_at||c._fromCache)return;
    var elapsed=Date.now()-new Date(c.created_at).getTime();var timeout=isAnaph(c.severity)?ACK_TIMEOUT_ANAPH:ACK_TIMEOUT;
    if(elapsed>timeout&&!c._escalated){c._escalated=true;if(isAnaph(c.severity)){if(Date.now()-lastAlarmAt>=1500)soundAlarm()}else chimeStandard()}   // anaphylaxis through the single-flight alarm; an alarm that has just sounded (an arrival in the same moment, e.g. a reconnect read) is not doubled
  });
}

setInterval(function(){
  Object.keys(cards).forEach(function(id){if(cards[id].closed_at||cards[id].served_at)return;
    var el=document.getElementById('timer-'+id),ow=el&&owedStep(cards[id]);if(ow)el.textContent=fmtTimer(ow.since)});
  checkEscalations();
  alarmTick();
  // Covers the reconcile that neither succeeds nor fails because its request hangs: no
  // callback runs, so nothing else would ever mark the board degraded.
  if(online&&lastReconcileOk&&Date.now()-lastReconcileOk>STALE_AFTER_MS)setOnline(false);
  var hc=document.getElementById('headerClock');if(hc){var now=new Date();hc.textContent=now.toLocaleDateString(LOCALE_TAG[locale],{weekday:'short',month:'short',day:'numeric',year:'numeric'})+' · '+now.toLocaleTimeString(LOCALE_TAG[locale],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
},1000);

function resetDim(){document.body.classList.remove('dimmed');clearTimeout(dimTimer);var n=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at}).length;if(!n)dimTimer=setTimeout(function(){document.body.classList.add('dimmed')},180000)}
document.addEventListener('touchstart',resetDim);document.addEventListener('mousedown',resetDim);

// v2 — 2026-08-12, bumped when HTML escaping shipped. A payload stored in a pre-fix
// cache re-renders at startup, and deleting the row from the database CANNOT reach it.
// Changing the key is the only eviction path that exists. The removeItem calls clear
// the old keys so a stale payload does not sit in storage indefinitely.
var CACHE_K='hc_k_cards_v2',GHOST_K='hc_k_ghosts_v2';
// Refactor decision 5: EVERY underscore field is stripped on the way out. They are this page's
// UI state (_writing, _ackPending, _escalated, _error, _notice, _gen, _assetLabel…), and a
// reload must start from records, not from latches an earlier page life left set — an
// _escalated restored from cache used to suppress the escalation a reloaded board owed.
// The supersession registry travels with the cache, trimmed to what the cached cards need: the
// cards' own metadata, every successor that names one of them, and those successors' metadata. So a
// record hidden because something replaced it is still hidden when it is restored after a reload,
// before any board read.
var SUPER_K='hc_k_supersession_v1';
function cacheCards(){try{localStorage.setItem(CACHE_K,JSON.stringify(cards,function(k,v){return (typeof k==='string'&&k.charAt(0)==='_')?undefined:v}));localStorage.setItem(GHOST_K,JSON.stringify(ghosted));
  var meta={},succ={};Object.keys(cards).forEach(function(id){if(rowMeta[id])meta[id]=rowMeta[id];
    if(successorsOf[id]){succ[id]=successorsOf[id];Object.keys(successorsOf[id]).forEach(function(s2){if(rowMeta[s2])meta[s2]=rowMeta[s2]})}});
  localStorage.setItem(SUPER_K,JSON.stringify({m:meta,s:succ}))}catch(e){}}
// Restored through the same ingest as every other source, so an un-acknowledged anaphylaxis
// record in the cache is a lockout from first paint. Underscore fields an older build cached
// are dropped on the way in.
function loadCache(){try{
  localStorage.removeItem('hc_k_cards');localStorage.removeItem('hc_k_ghosts');
  var c=localStorage.getItem(CACHE_K);var g=localStorage.getItem(GHOST_K);if(g)ghosted=JSON.parse(g);
  try{var sr=JSON.parse(localStorage.getItem(SUPER_K)||'null');if(sr&&sr.m&&sr.s){
    Object.keys(sr.m).forEach(function(id){rowMeta[id]=Object.assign(rowMeta[id]||{},sr.m[id])});
    Object.keys(sr.s).forEach(function(id){successorsOf[id]=Object.assign(successorsOf[id]||{},sr.s[id])})}}catch(e){}
  if(c){var o=JSON.parse(c);Object.keys(o).forEach(function(id){noteRow(o[id])});Object.keys(o).forEach(function(id){ingestDeclaration(o[id],'cache')})}}catch(e){}}
function setOnline(v){online=v;var hb=document.getElementById('heartbeat');var bn=document.getElementById('offlineBanner');if(v){hb.className='hb ok';bn.classList.remove('on')}else{hb.className='hb off';bn.classList.add('on')}}

// Bounds a READ at READ_TIMEOUT_MS. `fetch` has no default timeout and supabase-js sets
// none, so without this a half-open connection stalls the request forever — the await
// never returns, no error is raised, and nothing on screen changes. That is strictly
// worse than an error, because every error path in this file is already handled.
//
// An abort RESOLVES as {data:null,error:{name:'AbortError',…}} rather than rejecting, so
// a timeout arrives at each call site in the shape its existing error handling already
// expects. That is what makes this a bounded change instead of a restructure.
//
// AbortController + setTimeout, NOT AbortSignal.timeout() — the latter needs Safari/iOS
// 16+ and the tablet's version is unverified. AbortController is universal.
//
// .retry(false) is FEATURE-DETECTED, not called blind. The client is loaded from
// jsdelivr at a floating `@supabase/supabase-js@2`, so the bundle on the tablet is
// whatever that resolved to; `.retry()` is recent and calling it unconditionally on an
// older v2 would throw TypeError and take the whole board down. Not load-bearing either
// way — the signal is passed to both the fetch and the retry backoff sleep, so the
// abort already bounds the whole operation including any retries. Disabling them only
// avoids spending the budget on attempts we would not wait for.
//
// ⚠ WRITES ARE NOT ROUTED THROUGH THIS — they use boundWrite(). A write that times out may still
// have COMMITTED server-side (the abort cancels this client's wait, not the server's
// transaction); boundWrite's callers handle that by reverting, saying "Not saved", and letting the
// next board read restore any milestone that did land (set-once-forward fold).
function boundRead(q){
  var ac=new AbortController();
  var timer=setTimeout(function(){ac.abort()},READ_TIMEOUT_MS);
  if(typeof q.retry==='function')q=q.retry(false);
  function done(res){clearTimeout(timer);return res}
  return q.abortSignal(ac.signal).then(done,function(e){clearTimeout(timer);throw e});
}

// loadExisting() lived here: a second ingest path with its own query, its own date window
// and no supersede handling, left unreferenced when reconcile() became the single read.
// Deleted rather than left dormant — an orphan ingest path is how a future edit quietly
// reintroduces a divergent board.

// The single reconciliation read. Also the initial load — one code path, so a declaration
// discovered at startup, on reconnect, on tab wake, or by the poll is folded identically.
//
// HEALTH IS SET HERE AND ONLY HERE. A socket event may DEGRADE the board but can never
// promote it: a re-SUBSCRIBED channel proves a socket reconnected, not that this board
// holds current data. Only a completed read proves that.
// opts.again — the caller (a realtime INSERT) needs a read that STARTS after it; if one is
// already in flight, one more runs as soon as it finishes.
async function reconcile(opts){
  if(!venueId)return false;
  if(reconcileInFlight){if(opts&&opts.again)reconcileAgain=true;return false}
  reconcileInFlight=true;
  var seq0=ingestSeq;
  try{
    // THE AUTHENTICATED BOARD READ. kitchen_board() takes NO ARGUMENTS: the venue comes from
    // the credential, and inclusion is "current service work", not an age window. The 36-hour
    // cliff is gone — not widened to another number. An unresolved record stays on the board
    // while its service is open, for as long as that takes.
    if(!paired()){setOnline(false);return false}
    var res=await boundRead(sbv.rpc('kitchen_board'));
    if(res.error||!res.data){console.error('[kitchen] reconcile failed:',res.error);setOnline(false);return false}
    // Rehearsal identity and current-work classification both arrive inside the board read
    // now — service_kind per row, and membership already applied by the server.
    // Oldest-first so any escalation surfaces the longest-waiting case first.
    // Every reference first, from every row (superseded ones included), so no row is escalated
    // before the read has said whether something replaced it.
    res.data.forEach(noteRow);
    res.data.slice().reverse().forEach(function(d){ingestDeclaration(d,'reconcile')});
    // THE SERVER RESULT IS THE BOARD. Reconcile used to be additive only — it folded and
    // created, and removed a card solely when the row came back superseded. Anything ever
    // cached on this tablet therefore stayed on screen for ever, which is how a board ends up
    // showing records weeks old, and an escaping test that no longer exists in any venue.
    //
    // Now a completed read prunes to itself. One exception: a card with a write outstanding
    // (_writing) is never dropped mid-flight. A pruned card's ghost state goes with it — a
    // minimised marker for a card that is no longer on the board means nothing.
    // The cache is what it should have been all along: an offline redraw buffer. It is
    // authoritative only while no successful read has happened.
    var seen={};res.data.forEach(function(d){seen[d.id]=1});
    Object.keys(cards).forEach(function(id){
      if(seen[id]||cards[id]._writing||(cards[id]._seq||0)>seq0)return;
      dropCard(id);
    });

    lastReconcileOk=Date.now();
    setOnline(true);
    renderCards();cacheCards();resetDim();
    return true;
  }finally{reconcileInFlight=false;
    if(reconcileAgain){reconcileAgain=false;setTimeout(function(){reconcile()},0)}}
}

function startReconcileLoop(){
  if(reconcileTimer)return;
  reconcileTimer=setInterval(function(){reconcile()},RECONCILE_MS);
}

function subscribe(){
  if(!paired())return;
  sbv.channel('kitchen-'+venueId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      // Ingest FIRST, synchronously — lockout, alarm and delivery never wait on a lookup. The
      // board read is asked for at once to supply the service-point label (and rehearsal
      // identity) from the same authenticated source as every other row.
      ingestDeclaration(payload.new,'insert');
      renderCards();cacheCards();resetDim();
      reconcile({again:true});
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      var d=payload.new;if(!cards[d.id])return;
      ingestDeclaration(d,'update');
      if(d.closed_at)delete ghosted[d.id];
      renderCards();cacheCards();
    })
    // TIMED_OUT was previously unhandled, so setOnline was never called for it and the
    // heartbeat kept whatever state it already had. realtime-js emits it on its own 10s
    // DEFAULT_TIMEOUT. Combined with the markup below that meant a board whose
    // subscription timed out showed a GREEN heartbeat and no offline banner, having
    // never received a single realtime message — positive confirmation of a liveness
    // that was never established.
    //
    // ❓ OPEN QUESTION, NOT DECIDED HERE: the heartbeat's initial markup is
    // `class="hb ok"` (:136) — green from page load, before any subscription is proven.
    // Arguably it should start unknown/offline and only go green on the first
    // SUBSCRIBED, since green-before-proven is the same class of unearned claim this
    // line fixes. Deliberately NOT changed in this pass; recorded so it is decided
    // rather than inherited.
    .subscribe(function(status){
      // A re-SUBSCRIBED channel does NOT make the board healthy. postgres_changes does not
      // replay, so anything inserted during the gap was never delivered here; the socket
      // being back proves the socket is back and nothing about the data. reconcile() is
      // what promotes, once a read actually completes.
      if(status==='SUBSCRIBED')reconcile();
      else if(status==='CLOSED'||status==='CHANNEL_ERROR'||status==='TIMED_OUT')setOnline(false);
    });
}

async function loadVenue(){
  if(!venueId)return;
  var {data}=await boundRead((sbv||sb).from('venues').select('name').eq('id',venueId).single());
  if(data&&sbv){vdVenueName=data.name;if(recordOpenId)renderRecord()}   // only when read under the device credential
  if(data){hdrVenue=data.name;document.getElementById('venueName').textContent=tt('hdr.kitchen',{venue:data.name});document.getElementById('venueLogo').textContent=data.name.charAt(0)}
  // The venue's own mark, from the same authoritative venues.logo_url that Admin renders —
  // no second branding configuration. Presentation only: venue_branding_logo returns the logo
  // and nothing else, anon's column grant on `venues` is untouched at (id, name), and this
  // widens allergy-data access by exactly nothing. Silent on failure; the initial stands.
  try{
    var b=await boundRead((sbv||sb).rpc('venue_branding_logo',{p_venue_id:venueId}));
    var row=b&&!b.error&&Array.isArray(b.data)?b.data[0]:null;
    var url=row&&row.logo_url;
    if(url&&typeof url==='string'&&url.trim()){
      var el=document.getElementById('venueLogo');
      var im=new Image();
      im.onload=function(){el.textContent='';el.appendChild(im);el.classList.add('has-logo')};
      im.alt='';im.className='hdr-logo-img';im.src=url.trim();
    }
  }catch(e){console.error('[kitchen] branding lookup failed:',e)}
}

// The credential comes first: every read and write below is authorised by it, so starting
// them before the exchange completes would just produce a run of refusals. An unpaired board
// shows the pairing sheet and loads nothing — it has no authority to load anything with, and
// there is no anonymous fallback to quietly use instead.
;(async function boot(){
  vdLoad();
  var lc0=localeCacheGet();if(lc0)locale=lc0.l;
  var i18nBad=i18nParity();
  if(i18nBad.length){console.error('[kitchen] string catalog incomplete:',i18nBad);
    if(I18N_DEV){var ib=document.createElement('div');ib.id='i18nFail';ib.className='i18n-fail';
      ib.textContent='Kitchen string catalog incomplete — '+i18nBad.join('; ');document.body.prepend(ib)}}
  applyStatic();
  loadCache();if(Object.keys(cards).length>0)renderCards();
  if(vdToken)await vdExchange();
  if(!paired()){
    vdRenderStatus();
    // Nothing on the board is trustworthy without a credential, so do not leave stale cached
    // cards implying live work.
    cards={};lockoutQueue=[];if(lockoutId)closeLockout();renderCards();
    openPair();
    return;
  }
  loadDeviceLocale();
  loadVenue();reconcile();subscribe();startReconcileLoop();
})();
// Tablet wake / tab restore. A socket can die without emitting CLOSED, so resubscribe
// alone is not sufficient coverage.
document.addEventListener('visibilitychange',function(){if(!document.hidden)reconcile()});
</script>
</body>
