        // claiming a different person performed it. Kitchen identity comes from a ?device=
        // string on an anon page and is not proven, so any wording implying an independent
        // verifier would be a claim the data cannot support.
        // NAVIGATION ONLY — this writes nothing. It used to call verifyDish() straight from
        // the row, so a single tap recorded a verification milestone with no review and no
        // deliberate gesture. Opening the check must never be the check.
        act='<button type="button" class="r-act r-act--nav" aria-label="'+th('row.second_check_aria')+'" onclick="event.stopPropagation();openRecord(\''+esc(id)+'\')"><span class="hold-lbl">'+th('row.second_check')+'</span></button>';
      } else {
        act='<button type="button" class="r-act hold-btn r-act--srv" aria-label="'+th('hold.serve')+'" onclick="event.stopPropagation()" '
          +HOLD_ATTRS(id,'serve')+' onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"'
          +'><div class="hold-fill"></div><span class="hold-lbl">'+th('row.mark_served')+'</span></button>';
      }
    }

    // ONE WAY IN. The row used to toggle an inline panel that carried a second copy of every
    // control; it now opens the record sheet, which is the only detail surface there is.
    h+='<div class="'+rowCls+'" role="button" tabindex="0" aria-label="'+th('row.open')+'"'
      +' onclick="openRecord(\''+esc(id)+'\')"'
      +' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecord(\''+esc(id)+'\')}">';
    h+='<div class="ac" style="background:'+accCol+'"></div>';
    if(isRehearsal(c))h+='<div class="r-reh">'+th('row.rehearsal')+'</div>';
    h+='<div class="r-tbl"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc((c._assetLabel||tt('misc.table')).split(' ')[0])+'</div>';
    h+='<div class="r-guest"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc(guestLabel(c))+'</div>';
    h+='<div class="r-al" style="color:'+(isSrv?'var(--t3)':sevCol)+'">'+esc(allergens)+'</div>';
    h+='<div class="r-sev '+(an?'r':'a')+'"'+(isSrv?' style="background:rgba(148,163,184,.06);color:var(--t3)"':'')+'>'+sevLabel(c.severity)+'</div>';
    // "XC" was internal shorthand on a surface read under time pressure by people who never saw
    // the schema. The stored boolean and its meaning are unchanged — only the word is.
    if(c.cross_contact&&!isSrv)h+='<div class="r-xc '+(an?'r':'a')+'">'+th('chip.cross_contact')+'</div>';
    // Derived from supersedes_id, not from the ephemeral _updated flag: a corrected
    // declaration must still read as a correction after a reload or a reconciliation read.
    if(c.supersedes_id&&!isSrv)h+='<div class="r-upd">'+th('row.updated')+'</div>';
    h+=act;
    h+='</div>';

    // NO EXPANDED PANEL. Everything that lived here — guest, cross-contact sentence, elapsed
    // time, the four-stage rail, the Avoid all blocks, guest notes — is in the record sheet,
    // which is reached by tapping the row. It had to go rather than be tidied: buildCard
    // emitted the panel with a hardcoded style="display:none" while toggleCard flipped that
    // style directly, and cardSig read the open state back out of the live DOM. So expanding a
    // card changed its signature without changing its markup, the next 5-second poll rebuilt
    // the wrapper from markup that says display:none, and the card silently collapsed itself.
    // Measured: expand, wait one poll, collapsed — which is exactly "it opens and then
    // retracts". The panel was also a second copy of every control, including a second Second
    // Check, and two hold buttons for one declaration share one holdTimers[id] slot.
    return h;
  }

  // ── ASSEMBLE A KEYED SEQUENCE, THEN RECONCILE ─────────────────────────────────────────
  // The board used to be rebuilt with one area.innerHTML on every poll, which destroyed and
  // recreated EVERY card node five seconds apart — measured: the Second Check button was
  // replaced on 4 of 4 polls with identical data. That is what makes a control stutter under
  // the pointer, and it churns interactive DOM underneath an operator for no reason.
  //
  // Now each card carries a signature of everything its markup depends on. Unchanged cards
  // keep their exact nodes; only what actually changed is rebuilt.
  var seq=[];
  function sec(key,label,cls,n,extra){
    label=th(label);
    seq.push({k:'sec:'+key,sig:label+'|'+n+'|'+(extra||''),cls:'sec-l'+(key==='earlier'?' earlier-l':''),
      html:label+' <span class="sec-ct '+cls+'">'+n+'</span><div class="sec-ln"></div>'+(extra||'')});
  }
  // Derived from the RECORD ONLY. It used to include the group size and the panel's open state
  // read back from the live DOM — a signature that could change without the record changing,
  // which made a card rebuild itself for a reason the data knew nothing about.
  function cardSig(id){
    var c=cards[id];
    return [c.severity,(c.allergens||[]).join(','),c.guest_name,c.cross_contact,c.supersedes_id,
            c.service_kind,c._assetLabel,c.kitchen_ack_at,c.protocol_confirmed_at,c.verified_at,
            c.served_at,c._error||'',c._ackPending?1:0,locale].join('|');
  }
  function pushCards(list){list.forEach(function(id){
    seq.push({k:'card:'+id,sig:cardSig(id),cls:'card-wrap',build:id})})}

  if(needs.length){ sec('needs','board.needs','red',needs.length); pushCards(needs) }
  if(working.length){ sec('working','board.working','amber',working.length); pushCards(working) }
  if(served.length){ sec('served','board.done','gray',served.length); pushCards(served) }
  // EARLIER — preserved, never deleted, and deliberately quiet. Collapsed to a count so a
  // prior service cannot compete with the one running now.
  if(earlier.length){
    sec('earlier','board.earlier','gray',earlier.length,
        '<button class="earlier-tg" onclick="toggleEarlier()">'+th(earlierOpen?'board.hide':'board.show')+'</button>');
    seq.push({k:'earlier-note',sig:locale,cls:'earlier-note',
      html:th('board.earlier_note')});
    if(earlierOpen)pushCards(earlier);
  }

  var have={};
  Array.prototype.slice.call(area.children).forEach(function(n){
    if(n.dataset&&n.dataset.k)have[n.dataset.k]=n; else n.remove();
  });
  var want=[];
  seq.forEach(function(e){
    var n=have[e.k];
    if(n){
      // REUSED UNTOUCHED when nothing it renders has changed. This is the whole fix.
      if(n.dataset.sig!==e.sig){
        n.innerHTML=e.build?buildCard(e.build):e.html;
        n.dataset.sig=e.sig;
      }
      delete have[e.k];
    }else{
      n=document.createElement('div');
      n.className=e.cls||''; n.dataset.k=e.k; n.dataset.sig=e.sig;
      n.innerHTML=e.build?buildCard(e.build):e.html;
    }
    want.push(n);
  });
  Object.keys(have).forEach(function(k){have[k].remove()});
  want.forEach(function(n,i){ if(area.children[i]!==n)area.insertBefore(n,area.children[i]||null) });

  renderRecord();
  renderGhosts(ghostIds);
  updateSummary();
  resetDim();
}

function renderGhosts(gIds){
  var gt=document.getElementById('ghostTabs');if(!gIds.length){gt.innerHTML='';return}
  var h='';gIds.forEach(function(id){var c=cards[id];h+='<div class="ghost-tab '+(isAnaph(c.severity)?'red':'amber')+'" onclick="restoreGhost(\''+esc(id)+'\')"><div>'+esc((c._assetLabel||'T?').split(' ')[0])+'</div></div>'});
  gt.innerHTML=h;
}

function updateSummary(){
  var ids=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at});
  var tables=new Set(),alCount=0,anCount=0,unack=0;
  ids.forEach(function(id){var c=cards[id];tables.add(c.asset_id);alCount+=(c.allergens||[]).length;if(isAnaph(c.severity))anCount++;if(!isAcked(c))unack++});
  var p=[];
  p.push('<span class="w">'+th('summary.tables',{n:tables.size})+'</span>');
  p.push('<span class="w">'+th('summary.allergies',{n:alCount})+'</span>');
  if(anCount)p.push('<span class="rd">'+th('summary.anaphylaxis',{n:anCount})+'</span>');
  if(unack)p.push('<span class="rd">'+th('summary.need_action',{n:unack})+'</span>');
  else if(ids.length)p.push('<span style="color:var(--ok)">'+th('summary.all_confirmed')+'</span>');
  document.getElementById('summaryBar').innerHTML=p.join(' · ');
}

var holdTimers={};
// Hold duration. Was 1500ms, which read as unresponsive on the floor. 1100ms still cannot be
// produced by a stray tap or a sleeve brush, so the gesture stays deliberate — this shortens
// a hold, it does not turn a safety action into an ordinary tap.
var HOLD_MS=1100;

// One place that wires a hold gesture, so the three hold buttons cannot drift apart in which
// events they listen for. touchcancel/mouseleave/blur all end the hold: a gesture that leaves
// the button must not keep counting toward a safety acknowledgement.
function HOLD_ATTRS(id,action){
  var q=esc(id), a=esc(action||'ack');
  return 'ontouchstart="startHold(\''+q+'\',this,\''+a+'\')" ontouchend="endHold(\''+q+'\',this)" '
       + 'ontouchcancel="endHold(\''+q+'\',this)" onmousedown="startHold(\''+q+'\',this,\''+a+'\')" '
       + 'onmouseup="endHold(\''+q+'\',this)" onmouseleave="endHold(\''+q+'\',this)" '
       + 'onblur="endHold(\''+q+'\',this)" onkeydown="holdKeyDown(event,\''+q+'\',this,\''+a+'\')" '
       + 'onkeyup="holdKeyUp(event,\''+q+'\',this)"';
}

// Every milestone that writes a safety field completes through the SAME gesture. Previously
// only the acknowledgement was a hold while Confirm Prep Area, Second Check and Mark Served
// were ordinary clicks — all four wearing the .hold-btn style, so three controls that fired
// on a single tap looked exactly like the one that did not. A safety write must not be
// reachable by the same gesture as scrolling past it.
var HOLD_ACTIONS={ack:doAck, prep:confirmProtocol, verify:verifyDish, serve:markServed};

// The button is passed in rather than looked up by id. Two buttons now exist for the same
// declaration at once — the collapsed row and the expanded panel — so getElementById('fill-'+id)
// matched whichever came first in the document and could animate the wrong one, or nothing.
function holdParts(el){
  if(!el)return {};
  var btn=el.closest?el.closest('.hold-btn'):el;
  return {btn:btn, fill:btn?btn.querySelector('.hold-fill'):null};
}
function startHold(id,el,action){
  var pr=holdParts(el);
  // Tell the review not to rebuild while this gesture runs: a rebuild would replace the very
  // button being held and silently cancel a deliberate safety action mid-press.
  if(pr.btn&&pr.btn.classList.contains('vfy-go'))recordHolding=true;
  if(pr.btn)pr.btn.classList.add('holding');           // instant, before the first frame
  if(pr.fill){pr.fill.style.transition='none';pr.fill.style.width='4%'}
  var start=Date.now();
  function tick(){
    var p=Math.min((Date.now()-start)/HOLD_MS,1);
    if(pr.fill)pr.fill.style.width=(4+p*96)+'%';
    if(p>=1){if(pr.btn)pr.btn.classList.remove('holding');recordHolding=false;
      // Where the hold happened decides where success is confirmed: the lockout and the
      // record sheet each confirm IN PLACE; a board row keeps its existing behaviour.
      var origin=!pr.btn||!pr.btn.closest?'row':pr.btn.closest('#lockout')?'lockout':pr.btn.closest('#verify')?'sheet':'row';
      var fn=HOLD_ACTIONS[action||'ack']||doAck;fn(id,origin);return}
    holdTimers[id]=requestAnimationFrame(tick);
  }
  holdTimers[id]=requestAnimationFrame(tick);
}
function endHold(id,el){
  recordHolding=false;
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  var pr=holdParts(el);
  if(pr.btn)pr.btn.classList.remove('holding');
  // Released early: back to nothing. A partly-filled bar left on screen would suggest the
  // acknowledgement is partly done, and it is not — it either happened or it did not.
  if(pr.fill){pr.fill.style.transition='width .12s ease-out';pr.fill.style.width='0'}
}
// Space/Enter hold the same way a finger does, so the gesture is reachable from a keyboard
// instead of being mouse/touch-only. Repeat keydown events are ignored so the hold measures
// real elapsed time rather than restarting on every auto-repeat.
function holdKeyDown(e,id,el,action){
  if(e.key!==' '&&e.key!=='Enter')return;
  e.preventDefault();
  if(e.repeat)return;
  startHold(id,el,action);
}
function holdKeyUp(e,id,el){
  if(e.key!==' '&&e.key!=='Enter')return;
  e.preventDefault();endHold(id,el);
}

// Optimistic-with-revert pattern: local state updates immediately so the UI
// responds to the 1.5s hold completing, then the DB write follows. On failure
// the local state is reverted to the prior valid state so the operator never
// sees an indeterminate mixed state. Chime + cache fire ONLY after the DB
// confirms — the chime now means "the database accepted the transition."
// IN-FLIGHT GUARD (_writing) — on all five write paths below.
// Without it a stalled write plus a repeating operator accumulates hung requests without
// bound: the hold gesture stays reachable (or the modal button does), each repeat fires
// another optimistic mutation and another request that never returns.
// Contract: UI-ephemeral. Never written to the database. Never cached — see cacheCards().
// It is cleared immediately after the await, BEFORE the error branch, so a failure cannot
// leave a card permanently locked.
// ⚠ On a HANG the await never returns, so the flag is never cleared and that card stays
// blocked until a page reload. That is the intended trade — a locked card beats unbounded
// hung requests — but it is a real consequence and nothing on screen announces it.
// Surfacing it belongs to the write-path session along with indeterminate state.
async function doAck(id,origin){
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  var c=cards[id];if(!c)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  // Optimistic UI only. kitchen_ack_at is NOT written here — a PATCH that hangs would
  // otherwise suppress escalation indefinitely on a card the database still shows
  // unacknowledged, and nothing would ever correct it.
  var ackAt=new Date().toISOString(),ackBy=deviceName;
  c._ackPending=ackAt;
  if(origin==='sheet'&&recordOpenId===id)recordFlow={id:id,a:'ack',phase:'saving'};
  renderCards();
  var {error}=await sbv.from('allergen_declarations').update({kitchen_ack_at:ackAt,kitchen_ack_by:ackBy,status:'acknowledged'}).eq('id',id);
  delete c._writing;
  // Rejection clears the attempt and nothing needs reverting — no safety field was ever
  // mutated. Escalation resumes on the next 1s tick with no manual intervention.
  if(error){console.error('[kitchen] acknowledge failed:',error);if(recordFlow&&recordFlow.id===id)recordFlow=null;delete c._ackPending;renderCards();showRowError(id,'err.ack');
    if(origin==='lockout'&&lockoutId===id)renderLockout(id,'ack','err.ack');return}
  // Accepted. Only now is this confirmed truth.
  c.kitchen_ack_at=ackAt;c.kitchen_ack_by=ackBy;c.status='acknowledged';
  delete c._ackPending;
  delete c._error;
  // Re-acknowledgement satisfied; the database row now carries the fresh timestamp, so the
  // fold must stop re-nulling it.
  delete c._reackRequired;
  chimeAck();
  // Confirm where the operator is. The sheet confirms in place and exposes the next step; the
  // lockout keeps the SAME card (table, guest, allergens, Avoid all) and replaces only its
  // action with the next requirement, instead of swapping to a different screen.
  if(origin==='sheet'){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else if(isAnaph(c.severity)){showLockoutProtocol(id)}
  else if(lockoutId===id){closeLockout()}
  renderCards();cacheCards();
}

async function confirmProtocol(id,origin){
  var c=cards[id];if(!c)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var prev={protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by};
  if(origin==='sheet'&&recordOpenId===id)recordFlow={id:id,a:'prep',phase:'saving'};
  c.protocol_confirmed_at=new Date().toISOString();c.protocol_confirmed_by=deviceName;
  renderCards();
  var {error}=await sbv.from('allergen_declarations').update({protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by}).eq('id',id);
  delete c._writing;
  if(error){console.error('[kitchen] protocol confirm failed:',error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();showRowError(id,'err.prep');
    if(origin==='lockout'&&lockoutId===id)renderLockout(id,'prep','err.prep');return}
  delete c._error;
  chimeAck();
  // Confirmed in place; the operator leaves when they choose. It used to closeLockout() here —
  // unconditionally, so it could also dismiss a DIFFERENT record's unacknowledged lockout.
  if(origin==='sheet'){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else if(lockoutId===id){renderLockout(id,'done')}
  renderCards();cacheCards();
}

async function verifyDish(id,origin){
  var c=cards[id];if(!c)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var prev={verified_at:c.verified_at,verified_by:c.verified_by};
  if(recordOpenId===id)recordFlow={id:id,a:'verify',phase:'saving'};
  c.verified_at=new Date().toISOString();c.verified_by=deviceName;
  renderCards();
  var {error}=await sbv.from('allergen_declarations').update({verified_at:c.verified_at,verified_by:c.verified_by}).eq('id',id);
  delete c._writing;
  if(error){console.error('[kitchen] verify failed:',error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();showRowError(id,'err.verify');return}
  delete c._error;
  chimeAck();
  // Confirm IN PLACE. The sheet used to close here, so a deliberate safety hold ended with
  // the screen vanishing — indistinguishable from a crash. It stays open on a success state
  // until the operator chooses Mark Served or Back. Nothing further is advanced for them.
  if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done';
  renderCards();cacheCards();
}

async function markServed(id,origin){
  var c=cards[id];if(!c)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var prev={served_at:c.served_at,status:c.status};
  var inSheet=origin==='sheet'&&recordOpenId===id;
  if(inSheet)recordFlow={id:id,a:'serve',phase:'saving'};
  c.served_at=new Date().toISOString();c.status='resolved';
  renderCards();
  var {error}=await sbv.from('allergen_declarations').update({served_at:c.served_at,status:'resolved'}).eq('id',id);
  delete c._writing;
  if(error){console.error('[kitchen] mark served failed:',error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();showRowError(id,'err.serve');return}
  delete c._error;
  chimeAck();
  // From the sheet: confirm in place (Served Recorded) instead of vanishing. From a board row
  // there is no sheet to keep, so the row's existing behaviour stands.
  if(inSheet){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else closeRecord();
  renderCards();cacheCards();
}

/**
 * The second check, as a review screen. Opening it writes NOTHING.
 *
 * It exists because the collapsed row used to call verifyDish() directly: one tap recorded a
 * verification milestone with no review of what was being verified and no deliberate gesture.
 * Now the tap opens this, and the only way to record anything is the press-and-hold at the
 * bottom — the same gesture, duration and cancel behaviour as the acknowledgement.
 *
 * WHAT THIS SCREEN MAY AND MAY NOT SAY. Kitchen is anonymous and unpaired: `verified_by`
 * comes from a ?device= query string, and on every row in the database it equals
 * `protocol_confirmed_by`. So this screen asks a person to do something — "another team
 * member should check" — and never reports that Happy Chair established one did. The
 * substrate agrees: allergyshield_shift_record returns kitchen_identity_verified = false
 * unconditionally, and the rehearsal step is named "Kitchen verification step recorded
 * (identity unverified)".
 */
/* ── VENUE-DEVICE IDENTITY (Block 1) ──────────────────────────────────────────
 *
 * The board is pairing to this venue as authenticated VENUE-OWNED HARDWARE. The credential
 * proves WHICH DISPLAY is acting; it never proves which person did. There is no staff member
 * anywhere in this flow, and the token carries none.
 *
 * ADDITIVE ON PURPOSE. Declarations are still read exactly as before, over the anon key,
 * because venue_device has not yet been granted access to them — that is the next block.
 * Wiring the reads to this credential now would authenticate the board and then leave it
 * unable to see anything. So this establishes and proves the identity; it changes no data path.
 */
var VD_K='hc_k_venue_device';
var vdToken=null, vdJwt=null, vdJwtExp=0, vdIdentity=null, vdTimer=null;
// Venue name as read through the DEVICE credential (loadVenue, venueId from the exchange).
var vdVenueName=null;

function vdLoad(){try{var r=JSON.parse(localStorage.getItem(VD_K)||'null');
  if(r&&r.device_token&&r.device_id)vdToken=r;}catch(e){}}
function vdSave(r){vdToken=r;try{localStorage.setItem(VD_K,JSON.stringify(r))}catch(e){}}
function vdForget(){vdToken=null;vdJwt=null;vdIdentity=null;vdVenueName=null;try{localStorage.removeItem(VD_K)}catch(e){}}

// device token -> short-lived venue JWT. Re-run before expiry; a failure is surfaced, never
// silently retried into a loop.
async function vdExchange(){
  if(!vdToken)return null;
  try{
    var res=await fetch(SUPABASE_URL+'/functions/v1/venue-device-token',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+vdToken.device_token,'Content-Type':'application/json'},
      body:JSON.stringify({action:'exchange',device_id:vdToken.device_id})});
    var j=await res.json();
    if(!res.ok){
      // A revoked or rotated display must not keep presenting a dead credential.
      if(res.status===401)vdForget();
      console.error('[kitchen] venue token exchange failed:',j&&j.error);return null;
    }
    vdJwt=j.access_token;vdJwtExp=new Date(j.expires_at).getTime();
    vdIdentity={venue_id:j.venue_id,display_name:j.display_name,device_role:j.device_role};
    venueId=j.venue_id;            // from the CREDENTIAL, never from the query string
    vdClient();
    vdRenderStatus();
    // Refresh at 80% of the window so a slow network still lands before expiry.
    if(vdTimer)clearTimeout(vdTimer);
    vdTimer=setTimeout(vdExchange, Math.max(60000,(vdJwtExp-Date.now())*0.8));
    return vdJwt;
  }catch(e){console.error('[kitchen] venue token exchange error:',e);return null}
}

// Proof the credential resolves, asked of the server with NO arguments — there is no
// parameter here for a caller to nominate a venue with.
async function vdWhoAmI(){
  if(!vdJwt)return null;
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/rpc/venue_device_context',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+vdJwt,'Content-Type':'application/json'},
      body:'{}'});
    var rows=await res.json();
    return (Array.isArray(rows)&&rows[0])||null;
  }catch(e){return null}
}

// The authenticated client. Every board read and every AllergyShield write goes through
// THIS, not the anon client — venue scope comes from the credential, and the server decides
// what the credential may see. Rebuilt on each refresh so the header always carries a live JWT.
var sbv=null;
function vdClient(){
  if(!vdJwt)return null;
  sbv=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    global:{headers:{Authorization:'Bearer '+vdJwt}},
    auth:{persistSession:false,autoRefreshToken:false}});
  try{sbv.realtime.setAuth(vdJwt)}catch(e){}
  return sbv;
}
function paired(){return !!(vdToken&&vdJwt&&sbv)}

function vdRenderStatus(){
  var el=document.getElementById('vdStatus');if(!el)return;
  if(vdIdentity){el.textContent=tt('status.paired',{display:vdIdentity.display_name});el.className='vd-st ok'}
  else{el.textContent=tt('status.not_paired');el.className='vd-st'}
}

function openPair(){
  var lk=document.getElementById('pair'),lc=document.getElementById('pairContent');
  // A language change re-runs this; keep whatever has been typed.
  var prev=document.getElementById('pairCode'),typed=prev?prev.value:'';
  // The two bold names are Admin's own (English) labels, so they stay as data.
  lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('pair.title')+'</div>'
    +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closePair()">&times;</button></div>'
    +'<div class="vfy-body">'+th('pair.body',{path:{html:'<b>Set Up &rarr; Kitchen Displays</b>'},action:{html:'<b>Add Kitchen Display</b>'}})+'</div>'
    +'<input id="pairCode" class="pair-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="'+esc(typed)+'">'
    +'<div id="pairErr" class="vfy-honest"></div>'
    +'<button type="button" class="hold-btn green vfy-go" onclick="submitPair()"><span class="hold-lbl">'+th('pair.button')+'</span></button>';
  lk.classList.add('on');
  setTimeout(function(){var i=document.getElementById('pairCode');if(i)i.focus()},50);
}
function closePair(){document.getElementById('pair').classList.remove('on')}

async function submitPair(){
  var input=document.getElementById('pairCode'),err=document.getElementById('pairErr');
  var code=(input.value||'').trim();
  if(!/^[0-9]{6}$/.test(code)){err.textContent=tt('pair.need_code');return}
  err.textContent=tt('pair.pairing');
  try{
    var res=await fetch(SUPABASE_URL+'/functions/v1/venue-device-token',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({action:'claim',code:code})});
    var j=await res.json();
    if(!res.ok){console.error('[kitchen] pairing refused:',j&&j.error);err.textContent=tt('pair.failed');return}
    vdSave({device_token:j.device_token,device_id:j.device_id});
    await vdExchange();
    var who=await vdWhoAmI();
    err.textContent='';
    closePair();
    // States what was established, and is careful about what was not: this identifies the
    // DISPLAY, not whoever is standing at it.
    vdRenderStatus();
    // Newly paired: the board has authority now, so start it.
    loadDeviceLocale();
    loadVenue();reconcile();subscribe();startReconcileLoop();
    // Shown on the PAIRING overlay, which this flow owns. It used to be written into the
    // record sheet's own surface and that sheet's 'on' class set by hand, so a pairing
    // confirmation and an open record fought over one container with no state saying which
    // was up.
    var lc=document.getElementById('pairContent');
    if(lc){lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('pair.done_title')+'</div>'
      +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closePair()">&times;</button></div>'
      +'<div class="vfy-tbl">'+esc((who&&who.venue_name)||tt('pair.this_venue'))+'</div>'
      +'<div class="vfy-guest">'+esc((who&&who.display_name)||'Kitchen Display')+'</div>'
      +'<div class="vfy-honest">'+th('pair.done_body')+'</div>';
      document.getElementById('pair').classList.add('on')}
  }catch(e){err.textContent=tt('pair.unreachable')}
}

// ── THE RECORD SHEET ─────────────────────────────────────────────────────────────────────
// ONE detail surface for a declaration, and the only one. There used to be two: an inline
// panel that expanded under the row, and this overlay. Both carried a Second Check control,
// both carried the guest and the cross-contact request, and they disagreed about whether the
// elapsed time and the stage rail belonged to either of them. A kitchen does not need a
// collapsed card, an expanded card AND a review; it needs the board and one record.
//
// WHICH record is open is application state, not a DOM fact. The sheet used to exist only as
// innerHTML on a detached overlay, so anything that re-entered the board could leave it
// inconsistent with nothing able to put it back. It is re-asserted from this id after every
// render instead.
var recordOpenId=null;
// Signature of what was last drawn, so a 5-second poll does not rebuild an unchanged sheet
// underneath the operator.
var recordSig=null;
// True while a hold is running on the sheet's button. A rebuild mid-hold would destroy the
// gesture and the progress fill, so the sheet is never rebuilt while one is in progress.
var recordHolding=false;
// Second Check ONLY: {id, phase:'saving'|'done'}. 'saving' freezes the review while the write
// is in flight, so the sheet never shows the next action before the database accepts this
// one. 'done' is the success state — application state, so a poll or token refresh
// re-asserts it rather than erasing it. Cleared only by the operator (close / open another).
var recordFlow=null;

// Navigation only. Opening a record can never be the same act as recording something about
// it: the row's Second Check used to call verifyDish() directly, so one tap wrote a safety
// milestone with no review and no deliberate gesture.
function openRecord(id){
  if(!cards[id])return;
  recordOpenId=id;recordFlow=null;
  recordSig=null;
  renderRecord();
}

function closeRecord(){
  recordOpenId=null;recordSig=null;recordHolding=false;recordFlow=null;
  var lk=document.getElementById('verify');if(lk)lk.classList.remove('on');
}

// The single next required action for this record, as one press-and-hold. Same four functions
// in the same order as the row's control — one workflow, two places it can be reached from,
// and only ever one of them on screen because the sheet is a full-screen overlay.
function recordAction(c){
  var an=isAnaph(c.severity),acked=isAcked(c),proto=!!c.protocol_confirmed_at;
  if(c.served_at)return null;
  // Labels come from the catalog at render time; the step itself (a) is the state machine and
  // is identical in every language.
  if(!acked)return {a:'ack',  label:tt('hold.ack'), cls:an?'red':'amber', aria:tt('hold.ack')};
  if(!proto&&an)return {a:'prep', label:tt('hold.prep'), cls:'red', aria:tt('hold.prep')};
  if(!c.verified_at)return {a:'verify', label:tt('hold.verify'), cls:'act', aria:tt('hold.verify'), check:true};
  return {a:'serve', label:tt('hold.serve'), cls:'', aria:tt('hold.serve')};
}

// The four-stage rail with recorded times. Shared by the review and the Second Check success
// state so the two can never disagree about which stages are complete.
function railHtml(c){
  var acked=isAcked(c),verified=!!c.verified_at,isSrv=!!c.served_at,h='';
  // A completed milestone reads as completed — the existing success class (dv / v) — whatever
  // stage the record has reached. It used to be amber while in progress and grey once served,
  // so the moment every step was done the rail looked disabled.
  function st(done,label,ts){return '<div class="ps"><div class="pd'+(done?' dv':'')+'">'+(done?CK:'')
    +'</div><div class="plbl'+(done?' v':'')+'">'+label+'</div>'+(done?'<div class="ptm">'+fmtTime(ts)+'</div>':'')+'</div>'}
  function ln(done){return '<div class="pln'+(done?' v':'')+'"></div>'}
  h+='<div class="prog">'+st(true,th('rail.received'),c.created_at)+ln(acked)+st(acked,th('rail.confirmed'),c.kitchen_ack_at)
    +ln(verified)+st(verified,th('rail.second_check'),c.verified_at)+ln(isSrv)+st(isSrv,th('rail.served'),c.served_at)+'</div>';
  return h;
}

// The top of the record sheet, shared by the ordinary record, Second Check Recorded and Served
// Recorded so the three are visibly one component advancing — same blocks, same order, same
// spacing — rather than three screens that happen to look alike.
function recordHeadHtml(c,title,done,okA){
  var id=c.id,an=isAnaph(c.severity),isSrv=!!c.served_at,h='';
  h+='<div class="vfy-hd"><div class="vfy-hl">'
    +(isRehearsal(c)?'<div class="vfy-reh">'+th('reh.full')+'</div>':'')
    +'<div class="vfy-t'+(done?' vfy-t--done':'')+'">'+(done?CK_DONE:'')+th(title)+'</div></div>'
    +'<button type="button" class="vfy-x" aria-label="'+th(done?'nav.back':'nav.close')+'" onclick="closeRecord()">&times;</button></div>';
  if(okA)h+='<div class="vfy-ok" role="status">'+CK_DONE+'<span>'+th(okA==='ack'?'ok.ack':'ok.prep')
    +'</span><span class="vfy-ok-t">'+th('ok.recorded',{time:fmtTime(okA==='ack'?c.kitchen_ack_at:c.protocol_confirmed_at)})+'</span></div>';
  // _error holds a catalog KEY, so the message follows a language change.
  if(c._error)h+='<div class="row-err">'+th(c._error)+'</div>';
  // The row abbreviates and may truncate; the record never does.
  h+='<div class="vfy-tbl">'+esc(c._assetLabel||tt('misc.table'))+'</div>';
  if(c.guest_name&&String(c.guest_name).trim())
    h+='<div class="vfy-guest">'+esc(String(c.guest_name).trim())+'</div>';
  h+='<div class="vfy-al'+(an?' an':'')+'">'+esc((c.allergens||[]).join(', '))+'</div>';
  h+='<div class="vfy-marks"><span class="vfy-sev'+(an?' an':'')+'">'+sevLabel(c.severity)+'</span>'
    +(c.cross_contact?'<span class="vfy-xc">'+th('chip.cross_contact')+'</span>':'')+'</div>';
  // Cross-contact is stated ONCE, as the chip. The sentence repeating it is gone.
  var owed=owedStep(c);
  if(owed&&!isSrv)h+='<div class="vfy-el">'+th('step.waiting',{step:owed.label,
    time:{html:'<span id="timer-'+esc(id)+'">'+fmtTimer(owed.since)+'</span>'}})+'</div>';
  return h;
}

// What the operator must do at each step — one sentence, imperative, no rationale.
function stepDo(a){return th('do.'+a)}

// Provenance, stated once and small: the display records, never a person. Same line on every
// state and on the lockout.
function provHtml(){
  return '<div class="vfy-prov">'+th('prov.line',{display:(vdIdentity&&vdIdentity.display_name)||tt('prov.this_display'),
    venue:vdVenueName||tt('prov.this_venue')})+'</div>';
}

// The safety reference a cook prepares from: Avoid all / Check ingredients, then guest notes.
// Shown at every stage until the record is served.
function referenceHtml(c){
  var an=isAnaph(c.severity),sv=(c.severity||'').toLowerCase(),isSrv=!!c.served_at,h='';
  var sevCol=an?'var(--danger)':sv==='severe'?'var(--warn)':sv==='discomfort'?'var(--cyan)':'var(--t2)';
  // Avoid all — one block per declared allergen, hit or miss. Severity gates prominence
  // (.low), never existence: an allergen with no derivative list is the one most likely to be
  // mishandled, so it must never be the one we omit. This is the information a cook prepares
  // from, which is why the sheet has to be reachable from any stage of the record and not only
  // at the second check.
  if(!isSrv){
    var lowW=(an||sv==='severe')?'':' low';
    (c.allergens||[]).forEach(function(a){
      var defs=getAllergenDef(a);
      // defs.map(esc) not esc(defs.join(…)) — the ' · ' separator is ours and must stay
      // literal. Same reasoning for the ' — ' in the heading.
      if(defs)h+='<div class="avoid'+lowW+'" style="border-color:'+sevCol+'"><div class="avoid-t" style="color:'+sevCol+'">'+th('ref.avoid_all',{allergen:a})+'</div><div class="avoid-l">'+defs.map(esc).join(' · ')+'</div></div>';
      else h+='<div class="avoid avoid-miss'+lowW+'"><div class="avoid-t">'+th('ref.check_ingredients',{allergen:a})+'</div><div class="avoid-l">'+th('ref.no_list')+'</div></div>';
    });
    // Say so when the reference data is not in the display's language, rather than let an
    // English list sit under a translated heading as though it had been translated.
    if((c.allergens||[]).length&&tRaw('ref.untranslated'))h+='<div class="ref-untr">'+th('ref.untranslated')+'</div>';
  }

  // ⚠ MUST STAY WRAPPED IN esc(). `notes` is guest-authored free text arriving through an
  // UNAUTHENTICATED insert — anyone holding the publishable key can write it, for any venue.
  //
  // Rendered VERBATIM, attributed, and BELOW the Avoid all blocks: the derivative lists are
  // the curated instruction and lead, guest notes are context for them. Promoting guest free
  // text above curated safety data would rank the less-verified source higher. Unlabelled it
  // sat in operator-instruction position and the guest's words read as the system's own.
  if(c.notes&&!isSrv)h+='<div class="al-notes-h">'+th('notes.heading')+'</div><div class="al-notes">'+esc(c.notes)+'</div>';

  return h;
}

// The bottom of every actionable state: one instruction, the hold, the provenance line.
function actionTailHtml(c,act){
  if(!act)return provHtml();
  return '<div class="vfy-do">'+stepDo(act.a)+'</div>'
    +'<button type="button" class="hold-btn '+act.cls+' vfy-go" aria-label="'+esc(act.aria)+'" '
    +(act.cls?'':'style="background:var(--s2);border:1px solid var(--b2);color:var(--t1)" ')
    +HOLD_ATTRS(c.id,act.a)
    +'><div class="hold-fill"></div><span class="hold-lbl">'+esc(act.label)+'</span></button>'
    +provHtml();
}

// Draws (or re-asserts) the sheet from state. Called by openRecord AND at the end of every
// renderCards(), so a board refresh can never leave the operator somewhere they did not ask
// to be.
function renderRecord(){
  if(!recordOpenId)return;
  var lk=document.getElementById('verify'),lc=document.getElementById('verifyContent');
  if(!lk||!lc)return;
  lk.classList.add('on');            // always re-assert: cheap and idempotent
  if(recordHolding)return;           // never rebuild under a running gesture

  var c=cards[recordOpenId];
  if(!c){
    // The declaration left the board while the sheet was open — served elsewhere, closed, or
    // the service ended. Say so explicitly instead of silently dropping the operator back to
    // the board with no idea why.
    if(recordSig==='gone|'+locale)return;
    recordSig='gone|'+locale;
    lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('title.gone')+'</div>'
      +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closeRecord()">&times;</button></div>'
      +'<div class="vfy-do">'+th('do.gone')+'</div>'
      +'<button type="button" class="vfy-back vfy-back--only" onclick="closeRecord()">'+th('nav.back')+'</button>';
    return;
  }

  if(recordFlow&&recordFlow.id!==recordOpenId)recordFlow=null;
  if(recordFlow&&recordFlow.phase==='saving')return;   // never show the next step before the write lands
  if(recordFlow&&recordFlow.phase==='done'&&recordFlow.a==='verify'&&c.verified_at&&!c.served_at){renderSecondCheckDone(c,lc);return}
  // A served record — just served here, or reopened later — is the completed state. It used to
  // fall through to "Served at … Nothing further to record.", which repeated the rail.
  if(c.served_at){renderServedDone(c,lc);return}
  // Received / Prep confirmed from the sheet: the ordinary record, now showing the NEXT
  // requirement, with the completed milestone stated at the top. No extra click.
  var okA=(recordFlow&&recordFlow.phase==='done'&&(recordFlow.a==='ack'&&c.kitchen_ack_at||recordFlow.a==='prep'&&c.protocol_confirmed_at))?recordFlow.a:'';
  var id=c.id,an=isAnaph(c.severity),sv=(c.severity||'').toLowerCase();
  var acked=isAcked(c),proto=!!c.protocol_confirmed_at,verified=!!c.verified_at,isSrv=!!c.served_at;
  var act=recordAction(c);
  // Everything the sheet renders, and nothing it does not. The elapsed time is deliberately
  // absent: it is updated in place by the one-second tick, so putting created_at here would
  // be harmless but putting the formatted value here would rebuild the sheet every second.
  var sig=[id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c.notes,
           c._assetLabel,c.kitchen_ack_at,c.protocol_confirmed_at,c.verified_at,c.served_at,
           c._error||'',c._ackPending?1:0,vdVenueName||'',c.service_kind,okA,locale].join('|');
  if(sig===recordSig)return;         // unchanged — leave the sheet exactly as it is
  recordSig=sig;

  var sevCol=an?'var(--danger)':sv==='severe'?'var(--warn)':sv==='discomfort'?'var(--cyan)':'var(--t2)';
  var owedNow=owedStep(c);
  var h=recordHeadHtml(c,owedNow?owedNow.key:'title.record',false,okA);

  // The four stages with their recorded times. This replaces a separate "Already recorded"
  // pair that listed two of the same timestamps in a second format — the rail says when the
  // kitchen received it and when the prep area was confirmed, labelled, in one place.
  h+=railHtml(c);

  h+=referenceHtml(c);
  // ONE instruction for the step, the hold, and one short provenance line. The heading, the
  // explanatory paragraph and the two-sentence disclosure were operational reading.
  h+=actionTailHtml(c,act);
  lc.innerHTML=h;
}


// Second Check success. Same header, identity lines and rail as the review, so it is
// unmistakably the SAME record; the rail now shows Second Check complete. Mark Served is
// offered as a hold (same gesture as every safety write) and is never performed for the
// operator. Back writes nothing.
var CK_DONE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
function renderSecondCheckDone(c,lc){
  var id=c.id;
  var sig=['done',id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c.notes,c._assetLabel,
           c.verified_at,c.served_at,c.service_kind,vdVenueName||'',c._error||'',locale].join('|');
  if(sig===recordSig)return;
  recordSig=sig;
  var h=recordHeadHtml(c,'title.second_check_done',true,'');
  h+=railHtml(c);
  h+=referenceHtml(c);
  h+=actionTailHtml(c,{a:'serve',label:tt('hold.serve'),cls:'act',aria:tt('hold.serve')});
  h+='<button type="button" class="vfy-back" onclick="closeRecord()">'+th('nav.back')+'</button>';
  lc.innerHTML=h;
}

// Served success. Records only what happened: the Kitchen step was recorded on this display.
// It claims nothing about the guest, the plate, or safety, and nothing about who pressed it.
function renderServedDone(c,lc){
  var id=c.id;
  var sig=['served',id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c._assetLabel,
           c.served_at,c.service_kind,vdVenueName||'',(vdIdentity&&vdIdentity.display_name)||'',locale].join('|');
  if(sig===recordSig)return;
  recordSig=sig;
  var h=recordHeadHtml(c,'title.served_done',true,'');
  h+=railHtml(c);
  h+='<div class="vfy-do">'+th('do.complete')+'</div>';
  h+=provHtml();
  h+='<button type="button" class="vfy-back vfy-back--only" onclick="closeRecord()">'+th('nav.back')+'</button>';
  lc.innerHTML=h;
}

// Which declaration the single-slot lockout is showing, so a milestone only ever changes the
// lockout that belongs to it.
var lockoutId=null;
// Which stage (and error key) the lockout is showing, so a language change redraws it in place.
var lockoutStage=null,lockoutErr=null;
function showLockout(id){renderLockout(id,'ack')}

function renderLockout(id,stage,err){
  var c=cards[id],lk=document.getElementById('lockout'),lc=document.getElementById('lockoutContent');
  var allergens=(c.allergens||[]).join(', '),gn=guestLabel(c);
  var avoidHtml='';
  // Same hit/miss branch and labelling as buildCard. Severity prominence does not
  // apply here — the lockout only fires on anaphylaxis, so every block is full weight.
  (c.allergens||[]).forEach(function(a){
    var d=getAllergenDef(a);
    if(d)avoidHtml+='<div style="border-left:3px solid var(--danger);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--danger);text-transform:uppercase;margin-bottom:4px">'+th('ref.avoid_all',{allergen:a})+'</div><div style="font-size:18px;font-weight:500;color:var(--t1);line-height:1.5">'+d.map(esc).join(' · ')+'</div></div>';
    else avoidHtml+='<div style="border-left:3px solid var(--t2);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--t2);text-transform:uppercase;margin-bottom:4px">'+th('ref.check_ingredients',{allergen:a})+'</div><div style="font-size:18px;font-weight:500;color:var(--t2);line-height:1.5">'+th('ref.no_list')+'</div></div>';
  });
  // The blocking modal is the single most urgent thing this board ever shows. If it is a
  // rehearsal, that has to be the first line read — above the table, above the allergens.
  if(!c)return;
  // Completed milestones sit directly under the rehearsal marker, above the record they
  // belong to, so confirmation never costs the cook the table, guest or allergens.
  lockoutStage=stage;lockoutErr=err||null;
  if((c.allergens||[]).length&&tRaw('ref.untranslated'))avoidHtml+='<div class="ref-untr" style="max-width:500px;width:100%">'+th('ref.untranslated')+'</div>';
  var done=stage==='ack'?'':'<div class="lk-ok" role="status">'+CK_DONE+th('ok.ack')+'</div>'
    +(stage==='done'?'<div class="lk-ok" role="status">'+CK_DONE+th('ok.prep')+'</div>':'');
  var tail=stage==='ack'
    ?'<div class="lockout-sub">'+stepDo('ack')+'</div><button type="button" class="hold-btn red" style="max-width:500px;width:100%;height:60px" aria-label="'+th('hold.ack')+'" '+HOLD_ATTRS(id)+'><div class="hold-fill"></div><span class="hold-lbl">'+th('hold.ack')+'</span></button>'
    :stage==='prep'
    // Was a plain <div onclick>: ONE TAP wrote protocol_confirmed_at. Now the same hold as
    // every other safety milestone — same HOLD_MS, fill, cancel-on-release/leave/blur, keys.
    ?'<div class="lockout-sub">'+stepDo('prep')+'</div><button type="button" class="hold-btn red" style="max-width:500px;width:100%;height:60px" aria-label="'+th('hold.prep')+'" '+HOLD_ATTRS(id,'prep')+'><div class="hold-fill"></div><span class="hold-lbl">'+th('hold.prep')+'</span></button>'
    :'<div class="lockout-sub">'+th('lock.next')+'</div><button type="button" class="lockout-back" onclick="closeLockout()">'+th('nav.back')+'</button>';
  lc.innerHTML=(isRehearsal(c)?'<div class="lockout-reh">'+th('reh.full')+'</div>':'')+done+(err?'<div class="lk-err" role="alert">'+th(err)+'</div>':'')+'<div class="lockout-title">'+esc(c._assetLabel||tt('misc.table'))+'</div><div style="font-size:24px;font-weight:700;color:var(--t1);margin-bottom:8px">'+esc(gn)+'</div><div style="font-size:32px;font-weight:800;color:var(--danger);margin-bottom:16px">'+esc(allergens)+'</div><div style="display:flex;gap:8px;margin-bottom:12px"><div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">'+th('sev.anaphylaxis')+'</div>'+(c.cross_contact?'<div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">'+th('chip.cross_contact')+'</div>':'')+'</div>'+avoidHtml
    // Guest notes were missing from the lockout entirely. Verbatim, esc()'d, labelled — the
    // same rule as the record sheet.
    +(c.notes?'<div class="lk-notes"><div class="al-notes-h">'+th('notes.heading')+'</div><div class="al-notes">'+esc(c.notes)+'</div></div>':'')
    +tail+provHtml();
  lockoutId=id;
  lk.classList.add('on');
}

// After Confirm Received: the SAME lockout card, now stating Allergy Received and offering the
// existing next requirement. It used to replace the whole card with a different screen.
function showLockoutProtocol(id){renderLockout(id,'prep')}

function closeLockout(){lockoutId=null;lockoutStage=null;lockoutErr=null;document.getElementById('lockout').classList.remove('on')}

// Minimize is a local UI preference (ghosting the card into the side rail).
// The minimized_at write is bookkeeping for admin reporting. If the write
// fails the ghost state stays — operator chose to hide it — but we surface
// the error so the divergence isn't silent.
async function minimizeCard(id){
  if(!cards[id]||!cards[id].kitchen_ack_at)return;
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(cards[id]._writing)return;
  cards[id]._writing=true;
  ghosted[id]=true;renderCards();
  var {error}=await sbv.from('allergen_declarations').update({minimized_at:new Date().toISOString()}).eq('id',id);
  delete cards[id]._writing;
  if(error){console.error('[kitchen] minimize bookkeeping failed:',error);showRowError(id,'err.minimize');return}
  delete cards[id]._error;
  cacheCards();
}
function restoreGhost(id){delete ghosted[id];renderCards();cacheCards()}

// (Removed: two document-level touch listeners that recorded a start X and a card, computed a
// horizontal delta on touchend and discarded it. A swipe gesture that was never finished, and
// dead weight on every touch on the board.)

function checkEscalations(){
  // Reads kitchen_ack_at DIRECTLY and must continue to. That field is database-confirmed
  // acknowledgement only (see the contract above), so an in-flight or failed attempt does
  // not appear here and cannot suppress a required escalation. Do NOT substitute isAcked()
  // — that predicate includes _ackPending and would restore the false-safety defect.
  Object.keys(cards).forEach(function(id){var c=cards[id];if(c.kitchen_ack_at||c.closed_at||c.served_at)return;
    var elapsed=Date.now()-new Date(c.created_at).getTime();var timeout=isAnaph(c.severity)?ACK_TIMEOUT_ANAPH:ACK_TIMEOUT;
    if(elapsed>timeout&&!c._escalated){c._escalated=true;if(isAnaph(c.severity))chimeAnaphylaxis();else chimeStandard()}
  });
}

setInterval(function(){
  Object.keys(cards).forEach(function(id){if(cards[id].closed_at||cards[id].served_at)return;
    var el=document.getElementById('timer-'+id),ow=el&&owedStep(cards[id]);if(ow)el.textContent=fmtTimer(ow.since)});
  checkEscalations();
  // Covers the reconcile that neither succeeds nor fails because its request hangs: no
  // callback runs, so nothing else would ever mark the board degraded.
  if(online&&lastReconcileOk&&Date.now()-lastReconcileOk>STALE_AFTER_MS)setOnline(false);
  var hc=document.getElementById('headerClock');if(hc){var now=new Date();hc.textContent=now.toLocaleDateString(LOCALE_TAG[locale],{weekday:'short',month:'short',day:'numeric',year:'numeric'})+' · '+now.toLocaleTimeString(LOCALE_TAG[locale],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
},1000);

function resetDim(){document.body.classList.remove('dimmed');clearTimeout(dimTimer);var n=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at}).length;if(!n)dimTimer=setTimeout(function(){document.body.classList.add('dimmed')},180000)}
document.addEventListener('touchstart',resetDim);document.addEventListener('mousedown',resetDim);

// v2 — 2026-08-12, bumped when HTML escaping shipped. A payload stored in a pre-fix
// cache re-renders at startup, and deleting the row from the database CANNOT reach it.
// Changing the key is the only eviction path that exists. The removeItem calls clear
// the old keys so a stale payload does not sit in storage indefinitely.
var CACHE_K='hc_k_cards_v2',GHOST_K='hc_k_ghosts_v2';
// _writing is stripped on the way out. It is an in-flight guard, not state, and it is
// cleared by the function that set it — but a write that HANGS never reaches its clear,
// so the flag can still be set when some OTHER card's write succeeds and calls this.
// Persisting it there would restore a permanently locked card on the next load, which is
// precisely the failure the guard's clear-before-error-branch exists to avoid.
// Stripped by name rather than by a general underscore strip: that broader change is
// refactor decision 5 on kitchen-shared-ingest and is deliberately not taken here.
function cacheCards(){try{localStorage.setItem(CACHE_K,JSON.stringify(cards,function(k,v){return (k==='_writing'||k==='_ackPending')?undefined:v}));localStorage.setItem(GHOST_K,JSON.stringify(ghosted))}catch(e){}}
function loadCache(){try{
  localStorage.removeItem('hc_k_cards');localStorage.removeItem('hc_k_ghosts');
  var c=localStorage.getItem(CACHE_K);var g=localStorage.getItem(GHOST_K);if(c)cards=JSON.parse(c);if(g)ghosted=JSON.parse(g)}catch(e){}}
function setOnline(v){online=v;var hb=document.getElementById('heartbeat');var bn=document.getElementById('offlineBanner');if(v){hb.className='hb ok';bn.classList.remove('on')}else{hb.className='hb off';bn.classList.add('on')}}

// Bounds a READ at READ_TIMEOUT_MS. `fetch` has no default timeout and supabase-js sets
// none, so without this a half-open connection stalls the request forever — the await
// never returns, no error is raised, and nothing on screen changes. That is strictly
// worse than an error, because every error path in this file is already handled.
//
// An abort RESOLVES as {data:null,error:{name:'AbortError',…}} rather than rejecting, so
// a timeout arrives at each call site in the shape its existing error handling already
// expects. That is what makes this a bounded change instead of a restructure.
//
// AbortController + setTimeout, NOT AbortSignal.timeout() — the latter needs Safari/iOS
// 16+ and the tablet's version is unverified. AbortController is universal.
//
// .retry(false) is FEATURE-DETECTED, not called blind. The client is loaded from
// jsdelivr at a floating `@supabase/supabase-js@2`, so the bundle on the tablet is
// whatever that resolved to; `.retry()` is recent and calling it unconditionally on an
// older v2 would throw TypeError and take the whole board down. Not load-bearing either
// way — the signal is passed to both the fetch and the retry backoff sleep, so the
// abort already bounds the whole operation including any retries. Disabling them only
// avoids spending the budget on attempts we would not wait for.
//
// ⚠ WRITES ARE NOT ROUTED THROUGH THIS. A write that times out may still have COMMITTED
// server-side — the abort cancels this client's wait, not the server's transaction — so
// the existing revert-on-error would assert "not acknowledged" about a row the database
// may show as acknowledged. That needs indeterminate-state handling, not a timeout.
function boundRead(q){
  var ac=new AbortController();
  var timer=setTimeout(function(){ac.abort()},READ_TIMEOUT_MS);
  if(typeof q.retry==='function')q=q.retry(false);
  function done(res){clearTimeout(timer);return res}
  return q.abortSignal(ac.signal).then(done,function(e){clearTimeout(timer);throw e});
}

// loadExisting() lived here: a second ingest path with its own query, its own date window
// and no supersede handling, left unreferenced when reconcile() became the single read.
// Deleted rather than left dormant — an orphan ingest path is how a future edit quietly
// reintroduces a divergent board.

// The single reconciliation read. Also the initial load — one code path, so a declaration
// discovered at startup, on reconnect, on tab wake, or by the poll is folded identically.
//
// HEALTH IS SET HERE AND ONLY HERE. A socket event may DEGRADE the board but can never
// promote it: a re-SUBSCRIBED channel proves a socket reconnected, not that this board
// holds current data. Only a completed read proves that.
async function reconcile(){
  if(!venueId)return false;
  if(reconcileInFlight)return false;
  reconcileInFlight=true;
  try{
    // THE AUTHENTICATED BOARD READ. kitchen_board() takes NO ARGUMENTS: the venue comes from
    // the credential, and inclusion is "current service work", not an age window. The 36-hour
    // cliff is gone — not widened to another number. An unresolved record stays on the board
    // while its service is open, for as long as that takes.
    if(!paired()){setOnline(false);return false}
    var res=await boundRead(sbv.rpc('kitchen_board'));
    if(res.error||!res.data){console.error('[kitchen] reconcile failed:',res.error);setOnline(false);return false}
    // Rehearsal identity and current-work classification both arrive inside the board read
    // now — service_kind per row, and membership already applied by the server.
    // Oldest-first so any escalation surfaces the longest-waiting case first.
    res.data.slice().reverse().forEach(function(d){
      var label=(d.table_label||'T?')+(d.zone_name?' · '+d.zone_name:'');
      var host=mergedInto[d.id];
      if(host&&cards[host]){foldMergedContent(cards[host],d);return}   // never a second card
      // A superseded declaration is history, not an active card. Dropped rather than
      // rendered so a corrected-away allergen or a lowered severity cannot sit on the board
      // next to the current declaration.
      if(d.superseded_at){ if(cards[d.id])delete cards[d.id]; return }
      var cur=cards[d.id];
      if(cur){
        // A card with a write outstanding is left entirely alone. Folding mid-write would
        // race the optimistic value against a database row that does not have it yet.
        if(cur._writing)return;
        foldDeclaration(cur,d);
        cur._assetLabel=label;
      }else{
        var seed={};Object.keys(d).forEach(function(k){if(k.charAt(0)!=='_')seed[k]=d[k]});
        seed._assetLabel=label;cards[d.id]=seed;
      }
    });
    // THE SERVER RESULT IS THE BOARD. Reconcile used to be additive only — it folded and
    // created, and removed a card solely when the row came back superseded. Anything ever
    // cached on this tablet therefore stayed on screen for ever, which is how a board ends up
    // showing records weeks old, and an escaping test that no longer exists in any venue.
    //
    // Now a completed read prunes to itself. One exception: a card with a write outstanding
    // (_writing) is never dropped mid-flight. A pruned card's ghost state goes with it — a
    // minimised marker for a card that is no longer on the board means nothing.
    // The cache is what it should have been all along: an offline redraw buffer. It is
    // authoritative only while no successful read has happened.
    var seen={};res.data.forEach(function(d){seen[d.id]=1});
    Object.keys(cards).forEach(function(id){
      if(seen[id]||cards[id]._writing)return;
      delete cards[id];delete ghosted[id];delete mergedInto[id];
    });

    lastReconcileOk=Date.now();
    setOnline(true);
    renderCards();cacheCards();resetDim();
    return true;
  }finally{reconcileInFlight=false}
}

function startReconcileLoop(){
  if(reconcileTimer)return;
  reconcileTimer=setInterval(function(){reconcile()},RECONCILE_MS);
}

function subscribe(){
  if(!paired())return;
  sbv.channel('kitchen-'+venueId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      var d=payload.new;
      // Bounded because a hang here blocks ingest ENTIRELY — every ingest step
      // (the cards write, the severity branch, chimeAnaphylaxis, showLockout, the
      // delivery handshake) sits inside this callback. A timeout converts that into
      // the already-correct failure case: res.data is null, the label falls back to
      // 'T?', and ingest proceeds.
      boundRead(sb.from('assets').select('label,zone').eq('id',d.asset_id).single()).then(function(res){
        d._assetLabel=(res.data?res.data.label:'T?')+(res.data&&res.data.zone?' · '+res.data.zone:'');
        // Merge only a genuine continuation: same guest session AND same table.
        // Both guards are load-bearing.
        //  - Truthy check: guest_session_id is nullable and 6 of 9 live rows are
        //    NULL, and `null === null` is true — without this, any NULL-session row
        //    merged into the first open NULL-session card.
        //  - asset_id check: a shared session id alone never proved same-table, so
        //    two guests sharing one would concatenate across tables. A cook would
        //    read allergens nobody at that table declared, and the guest who did
        //    declare them would have no card at all.
        // A correction never merges into its predecessor: it REPLACES it. The monotonic
        // merge below (union allergens, MAX severity) is correct for a guest adding a
        // second declaration, and exactly wrong for a correction, which may legitimately
        // remove an allergen or lower a severity.
        if(d.supersedes_id){
          var prior=cards[d.supersedes_id];
          if(prior){ prior.superseded_at=prior.superseded_at||new Date().toISOString(); delete cards[d.supersedes_id]; }
          cards[d.id]=d; d._updated=true;
          if(isAnaph(d.severity)){chimeAnaphylaxis();showLockout(d.id)}else{chimeStandard()}
          renderCards();cacheCards();resetDim();
          return;
        }
        var existing=d.guest_session_id&&Object.keys(cards).find(function(id){
          return cards[id].guest_session_id===d.guest_session_id&&cards[id].asset_id===d.asset_id&&!cards[id].closed_at
        });
        if(existing){
          var cur=cards[existing];
          // Severity is reconciled, not silently kept. Previously the merge left the
          // existing value in place, so a guest adding an anaphylaxis allergen to a
          // discomfort session stayed 'discomfort' — the same severity flattening
          // fixed on the writer side in tableside a720b36, reappearing on the reader.
          var merged=maxSeverity(cur.severity,d.severity);
          var upgraded=merged!==cur.severity;
          cur._updated=true;
          cur.allergens=(cur.allergens||[]).concat(d.allergens||[]);
          cur.severity=merged;
          // Cross-contact merges with the same never-downgrade shape as severity.
          // Discarding d.cross_contact flattened it exactly as severity was flattened:
          // the lockout's XC badge reads this field, and tableside computes it with
          // some() across the declared allergens, so a merge that drops it loses a
          // flag the guest did set.
          cur.cross_contact=cur.cross_contact||d.cross_contact;
          cur.kitchen_ack_at=null;
          // Everything downstream of severity is re-derived, not just stored. Row
          // colour (buildCard sevCol/rowCls) and the escalation timeout
          // (checkEscalations isAnaph) read c.severity and pick it up on the render
          // below. The _escalated latch does NOT — and this next line is the whole
          // reason the timeout change takes effect. checkEscalations fires at most
          // once per card (`!c._escalated`), so an upgraded card that already
          // escalated as 'discomfort' would keep the 90s timeout it fired against and
          // never get the 30s anaphylaxis one. That defect would have survived the
          // severity fix and been invisible: severity correct on the card, escalation
          // still slow. Not redundant — do not remove.
          if(upgraded)delete cur._escalated;
          // This row has no card of its own — it lives inside `existing`. Recorded so a
          // reconciliation read folds it into the host instead of rendering it again.
          mergedInto[d.id]=existing;
          // The merge nulls kitchen_ack_at locally to force re-acknowledgement, but the
          // database row still holds the old ack. Without this flag the next reconcile
          // would restore it and silently drop the re-ack requirement.
          cur._reackRequired=true;
          if(isAnaph(merged)){chimeAnaphylaxis();showLockout(existing)}else{chimeStandard()}
        }
        else{cards[d.id]=d;sbv.from('allergen_declarations').update({delivered_to_kitchen_at:new Date().toISOString(),device_id:deviceName}).eq('id',d.id).then(function(res){if(res.error)console.error('[kitchen] delivery handshake failed:',res.error)});if(isAnaph(d.severity)){chimeAnaphylaxis();showLockout(d.id)}else{chimeStandard()}}
        renderCards();cacheCards();resetDim();
      });
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      // _writing / _ackPending / _reackRequired / _error are carried across. Dropping
      // _writing here would defeat the reconciliation in-flight guard, and dropping
      // _ackPending would silently discard an attempt still outstanding.
      var d=payload.new;if(cards[d.id]){var p=cards[d.id];var ui={_assetLabel:p._assetLabel,
        // service_kind is computed by kitchen_board(), not a column, so a raw UPDATE row never
        // carries it. Replacing the card wholesale erased rehearsal identity on every write —
        // the REHEARSAL badge vanished at Mark Served. Carried only while the row is still
        // stamped to the same instance; a restamp waits for the next board read.
        service_kind:(d.service_instance_id===p.service_instance_id?p.service_kind:undefined),
        _updated:p._updated,_escalated:p._escalated,_writing:p._writing,_ackPending:p._ackPending,_reackRequired:p._reackRequired,_error:p._error};cards[d.id]=Object.assign(d,ui);
      // Database provenance settles a pending attempt.
      if(cards[d.id].kitchen_ack_at)delete cards[d.id]._ackPending;
      Object.keys(cards[d.id]).forEach(function(k){if(cards[d.id][k]===undefined)delete cards[d.id][k]});
      if(d.closed_at)delete ghosted[d.id];renderCards();cacheCards()}
    })
    // TIMED_OUT was previously unhandled, so setOnline was never called for it and the
    // heartbeat kept whatever state it already had. realtime-js emits it on its own 10s
    // DEFAULT_TIMEOUT. Combined with the markup below that meant a board whose
    // subscription timed out showed a GREEN heartbeat and no offline banner, having
    // never received a single realtime message — positive confirmation of a liveness
    // that was never established.
    //
    // ❓ OPEN QUESTION, NOT DECIDED HERE: the heartbeat's initial markup is
    // `class="hb ok"` (:136) — green from page load, before any subscription is proven.
    // Arguably it should start unknown/offline and only go green on the first
    // SUBSCRIBED, since green-before-proven is the same class of unearned claim this
    // line fixes. Deliberately NOT changed in this pass; recorded so it is decided
    // rather than inherited.
    .subscribe(function(status){
      // A re-SUBSCRIBED channel does NOT make the board healthy. postgres_changes does not
      // replay, so anything inserted during the gap was never delivered here; the socket
      // being back proves the socket is back and nothing about the data. reconcile() is
      // what promotes, once a read actually completes.
      if(status==='SUBSCRIBED')reconcile();
      else if(status==='CLOSED'||status==='CHANNEL_ERROR'||status==='TIMED_OUT')setOnline(false);
    });
}

async function loadVenue(){
  if(!venueId)return;
  var {data}=await boundRead((sbv||sb).from('venues').select('name').eq('id',venueId).single());
  if(data&&sbv){vdVenueName=data.name;if(recordOpenId)renderRecord()}   // only when read under the device credential
  if(data){hdrVenue=data.name;document.getElementById('venueName').textContent=tt('hdr.kitchen',{venue:data.name});document.getElementById('venueLogo').textContent=data.name.charAt(0)}
  // The venue's own mark, from the same authoritative venues.logo_url that Admin renders —
  // no second branding configuration. Presentation only: venue_branding_logo returns the logo
  // and nothing else, anon's column grant on `venues` is untouched at (id, name), and this
  // widens allergy-data access by exactly nothing. Silent on failure; the initial stands.
  try{
    var b=await boundRead((sbv||sb).rpc('venue_branding_logo',{p_venue_id:venueId}));
    var row=b&&!b.error&&Array.isArray(b.data)?b.data[0]:null;
    var url=row&&row.logo_url;
    if(url&&typeof url==='string'&&url.trim()){
      var el=document.getElementById('venueLogo');
      var im=new Image();
      im.onload=function(){el.textContent='';el.appendChild(im);el.classList.add('has-logo')};
      im.alt='';im.className='hdr-logo-img';im.src=url.trim();
    }
  }catch(e){console.error('[kitchen] branding lookup failed:',e)}
}

// The credential comes first: every read and write below is authorised by it, so starting
// them before the exchange completes would just produce a run of refusals. An unpaired board
// shows the pairing sheet and loads nothing — it has no authority to load anything with, and
// there is no anonymous fallback to quietly use instead.
;(async function boot(){
  vdLoad();
  var lc0=localeCacheGet();if(lc0)locale=lc0.l;
  var i18nBad=i18nParity();
  if(i18nBad.length){console.error('[kitchen] string catalog incomplete:',i18nBad);
    if(I18N_DEV){var ib=document.createElement('div');ib.id='i18nFail';ib.className='i18n-fail';
      ib.textContent='Kitchen string catalog incomplete — '+i18nBad.join('; ');document.body.prepend(ib)}}
  applyStatic();
  loadCache();if(Object.keys(cards).length>0)renderCards();
  if(vdToken)await vdExchange();
  if(!paired()){
    vdRenderStatus();
    // Nothing on the board is trustworthy without a credential, so do not leave stale cached
    // cards implying live work.
    cards={};renderCards();
    openPair();
    return;
  }
  loadDeviceLocale();
  loadVenue();reconcile();subscribe();startReconcileLoop();
})();
// Tablet wake / tab restore. A socket can die without emitting CLOSED, so resubscribe
// alone is not sufficient coverage.
document.addEventListener('visibilitychange',function(){if(!document.hidden)reconcile()});
</script>
