<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HC Kitchen · AllergyShield™</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
:root{--bg:#0d1117;--s1:#141d2b;--s2:#1a2535;--b:#1e2d3d;--b2:#2d3f54;--b-soft:rgba(30,45,61,.3);--cyan:#22d3ee;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981;--t1:#e2e8f0;--t2:#94a3b8;--t3:#636e7b;--t4:#4a5568}
body.hc-mode{--bg:#000;--s1:#0a0a0a;--s2:#111;--b:#333;--b2:#555;--b-soft:rgba(51,51,51,.3);--danger:#f33;--warn:#fc0;--ok:#0f0;--cyan:#0ff;--t1:#fff;--t2:#ccc;--t3:#999;--t4:#777}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hdr{height:52px;background:var(--s1);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 20px;flex-shrink:0;z-index:100}
.hdr-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#0891b2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--bg);margin-right:10px;flex-shrink:0}
.hdr-venue{font-size:16px;font-weight:700;color:var(--t1);flex:1}
.hdr-clock{font-size:13px;color:var(--t2);font-weight:500;margin-right:14px}
.hdr-right{display:flex;align-items:center;gap:12px}
.hb{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hb.ok{background:var(--ok);animation:hbP 2s ease infinite}
.hb.off{background:var(--danger);animation:hbP .5s ease infinite}
@keyframes hbP{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.vol-ctrl{display:flex;align-items:center;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:4px 10px 4px 6px}
.vol-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cyan);flex-shrink:0}
.vol-icon .vw1,.vol-icon .vw2,.vol-icon .vw3{transition:opacity .15s}
.vol-off .vw1,.vol-off .vw2,.vol-off .vw3{opacity:0}
.vol-low .vw2,.vol-low .vw3{opacity:0}
.vol-med .vw3{opacity:0}
.vol-muted .vol-icon{color:var(--t2)}
.vol-range{width:70px;height:4px;-webkit-appearance:none;appearance:none;background:var(--b);border-radius:2px;outline:none;cursor:pointer;margin:0}
.vol-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:none}
.hdr-btn{width:40px;height:40px;border-radius:8px;background:var(--s2);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:.15s}
.hdr-btn:hover{background:var(--s2);border-color:var(--b2)}
.hdr-btn.on{border-color:var(--cyan);color:var(--cyan)}
.offline-banner{display:none;position:fixed;top:52px;left:0;right:0;background:rgba(239,68,68,.15);border-bottom:2px solid var(--danger);padding:14px 20px;z-index:90;text-align:center;color:var(--danger);font-size:20px;font-weight:700}
.offline-banner.on{display:block}
.main{flex:1;overflow-y:auto;padding:12px 16px;position:relative}
.sec-l{font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 6px 4px;display:flex;align-items:center;gap:8px}
.sec-ct{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:700}
.sec-ct.red{background:rgba(239,68,68,.15);color:var(--danger)}
.sec-ct.amber{background:rgba(245,158,11,.12);color:var(--warn)}
.sec-ct.gray{background:rgba(148,163,184,.08);color:var(--t2)}
.sec-ln{flex:1;height:1px;background:var(--b)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--s1);border-radius:10px 10px 0 0;cursor:pointer;position:relative;overflow:hidden;border:1px solid transparent;border-bottom:none}
.row.closed{border-radius:10px;border-bottom:1px solid transparent;margin-bottom:6px}
.row.pulse-r{animation:rp 1.2s ease infinite}
.row.pulse-a{animation:ap 2s ease infinite}
.row.working{border-color:rgba(245,158,11,.2)}
.row.safe{border-color:rgba(16,185,129,.2)}
.row.served{opacity:.35;border-color:transparent}
@keyframes rp{0%,100%{border-color:rgba(239,68,68,.8)}50%{border-color:rgba(239,68,68,.2)}}
@keyframes ap{0%,100%{border-color:rgba(245,158,11,.5)}50%{border-color:rgba(245,158,11,.1)}}
.row .ac{position:absolute;left:0;top:0;bottom:0;width:4px}
.r-tbl{font-size:22px;font-weight:700;color:#fff;min-width:40px}
.r-guest{font-size:17px;font-weight:600;color:var(--t1);min-width:80px}
.r-al{font-size:22px;font-weight:700;flex:1}
.r-sev{padding:4px 10px;border-radius:6px;font-size:14px;font-weight:700;text-transform:uppercase}
.r-sev.r{background:rgba(239,68,68,.2);color:var(--danger)}
.r-sev.a{background:rgba(245,158,11,.15);color:var(--warn)}
.r-xc{padding:3px 8px;border-radius:6px;font-size:13px;font-weight:700}
.r-xc.r{background:rgba(239,68,68,.15);color:var(--danger)}
.r-xc.a{background:rgba(245,158,11,.08);color:var(--warn)}
.r-tm{font-size:18px;font-weight:600;color:#fff;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.stages{display:flex;align-items:center;gap:0;min-width:100px}
.stg{width:16px;height:16px;border-radius:50%;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stg.da{border-color:var(--warn);background:var(--warn)}
.stg.dv{border-color:var(--ok);background:var(--ok)}
.stg.dg{border-color:var(--t3);background:var(--t3)}
.stg svg{width:9px;height:9px}
.sln{width:12px;height:2px;background:var(--b);flex-shrink:0}
.sln.da{background:var(--warn)}
.sln.dv{background:var(--ok)}
.sln.dg{background:var(--t3)}
.exp{background:var(--s1);border:1px solid var(--b);border-top:none;border-radius:0 0 10px 10px;padding:4px 18px 16px;margin-bottom:6px}
.row-err{padding:10px 14px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:8px;color:var(--danger);font-size:14px;font-weight:600;margin:8px 0;text-align:center}
.prog{display:flex;align-items:center;padding:10px 0}
.ps{display:flex;flex-direction:column;align-items:center;flex:1}
.pd{width:18px;height:18px;border-radius:50%;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;z-index:2}
.pd.da{border-color:var(--warn);background:var(--warn)}
.pd.dv{border-color:var(--ok);background:var(--ok)}
.pd.dg{border-color:var(--t3);background:var(--t3)}
.pd svg{width:10px;height:10px}
.plbl{font-size:12px;font-weight:600;margin-top:3px;color:var(--t4)}
.plbl.a{color:var(--warn)}.plbl.v{color:var(--ok)}.plbl.g{color:var(--t3)}
.ptm{font-size:11px;color:var(--t2);margin-top:1px}
.pln{flex:1;height:2px;background:var(--b);margin:0 -2px;z-index:1}
.pln.a{background:var(--warn)}.pln.v{background:var(--ok)}.pln.g{background:var(--t3)}
.avoid{border-left:3px solid;padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.avoid-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.avoid-l{font-size:16px;font-weight:500;color:var(--t1);line-height:1.5}
.avoid-miss{border-color:var(--t2)}
.avoid-miss .avoid-t{color:var(--t2)}
.avoid-miss .avoid-l{color:var(--t2)}
.avoid.low{padding:6px 10px;margin:6px 0}
.avoid.low .avoid-t{font-size:11px}
.avoid.low .avoid-l{font-size:14px}
.al-notes{font-size:16px;color:var(--t2);font-weight:500;margin:6px 0}
.hold-btn{position:relative;overflow:hidden;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;border:none;width:100%;user-select:none;-webkit-user-select:none;touch-action:none;margin-top:10px}
.hold-btn.red{background:var(--danger);color:#fff}
.hold-btn.amber{background:var(--warn);color:var(--bg)}
.hold-btn.green{background:var(--ok);color:#fff}
.hold-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.25);border-radius:10px}
.hold-lbl{position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.pos-d{margin-top:10px;padding-top:10px;border-top:1px solid var(--b-soft);display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t4);font-weight:600}
.pos-tag{padding:2px 8px;border-radius:4px;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.12);font-size:11px;color:var(--t3);font-weight:600;margin-left:4px}
.ghost-tabs{position:fixed;right:0;top:52px;bottom:40px;width:36px;display:flex;flex-direction:column;gap:4px;padding:8px 0;z-index:50}
.ghost-tab{width:36px;min-height:80px;border-radius:8px 0 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;cursor:pointer;font-size:13px;font-weight:700;color:#fff;writing-mode:vertical-lr;text-orientation:mixed}
.ghost-tab.amber{background:rgba(245,158,11,.6)}
.ghost-tab.red{background:rgba(239,68,68,.7)}
.summary{height:40px;background:var(--s1);border-top:1px solid var(--b);display:flex;align-items:center;justify-content:center;gap:14px;font-size:14px;font-weight:600;color:var(--t2);flex-shrink:0}
.summary .w{color:#fff}.summary .rd{color:var(--danger);font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;opacity:.5}
.empty svg{margin-bottom:20px}
.empty-text{font-size:24px;font-weight:600;color:var(--t2)}
.audio-prompt{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
.audio-prompt-btn{padding:24px 48px;background:var(--s1);border:2px solid var(--warn);border-radius:16px;font-size:22px;font-weight:700;color:var(--warn);cursor:pointer;font-family:inherit}
.lockout{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);padding:40px;overflow-y:auto}
.lockout.on{display:flex;flex-direction:column}
.lockout .lockout-card{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.lockout-title{font-size:32px;font-weight:800;color:var(--danger);margin-bottom:12px;text-align:center}
.lockout-sub{font-size:20px;color:var(--t2);margin-bottom:32px;text-align:center}
body.dimmed .main{opacity:.3;transition:opacity 1s}
body.dimmed .summary{opacity:.3}
</style>
</head>

function maxSeverity(cur,inc){
  var ri=SEV_RANK[(inc||'').toLowerCase()];
  if(ri===undefined)return cur;
  var rc=SEV_RANK[(cur||'').toLowerCase()];
  if(rc===undefined)return inc;
  return ri>rc?inc:cur;
}
// NOT SANITISATION. Strips three English phrases and trims, so the note reads as a
// fragment on the card. It does NOT escape HTML — every caller must wrap the result in
// esc(). It has already been mistaken for a sanitiser once.
function stripNotes(n){if(!n)return'';return n.replace(/carries /gi,'').replace(/severe reaction to /gi,'').replace(/if exposed to /gi,'').trim()}

// Escape EVERY value interpolated into innerHTML. This file builds every surface by
// string concatenation, and `allergens` / `notes` are guest-controlled free text that
// arrives through an UNAUTHENTICATED insert — anyone holding the publishable key can
// write them, for any venue. Escape values that look operator-controlled too: the only
// thing making `assets.label` safe is an RLS policy, and a policy is a thing someone
// can change. A larger diff is the cheaper problem.
//
// The ' escape is needed for ATTRIBUTE contexts (id="…", class="…").
//
// ⚠ It does NOT make the inline-handler path safe, and must not be recorded as if it
// does. Ids are interpolated into JS string literals inside onclick="fn('X')". The HTML
// parser decodes the attribute value BEFORE the JS is evaluated, so a quote escaped to
// &#39; comes back as ' and produces fn(''') — a SYNTAX ERROR, not a safe string.
// Escaping there converts an injection into a broken handler; it does not neutralise it.
//
// That path is safe today only because every id is a server-generated UUID and cannot
// contain a quote. esc() on those ids is inert defence-in-depth. If a NON-UUID value
// ever reaches a handler it needs JS-string escaping or a delegated listener bound in
// JS — not esc().
function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;')   // MUST be first — otherwise the entities below double-encode
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

var CK='<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';

function guestLabel(c){
  var gn='Guest';
  if(c.guest_name){var p=c.guest_name.split(' ');gn=p[0].toUpperCase();if(p.length>1&&p[1])gn+=' '+p[1].charAt(0).toUpperCase()+'.';}
  return gn;
}

// =====================================================================
// INGEST CONTRACT
// =====================================================================
// ingestDeclaration() is the ONLY way a declaration may enter `cards`. Four paths
// reach it - cache restore, initial/resync load, realtime INSERT, realtime UPDATE -
// and previously only the realtime INSERT branch carried the escalation contract.
// A board that reconnected mid-service therefore ingested anaphylaxis rows SILENTLY:
// no lockout, no alarm, and no delivered_to_kitchen_at write, so the gap was
// invisible on both ends. Every branch now goes through here.
//
// UNDERSCORE-FIELD CONTRACT (one rule, every path):
//   Underscore-prefixed fields are EPHEMERAL, IN-MEMORY, SESSION-SCOPED UI state.
//   They are never persisted to the cache and never arrive from the database.
//   foldRow() copies non-underscore keys only, which enforces the second half.
//
//   _assetLabel      derived table label; re-derived from assetLabels on every ingest
//   _escalated       checkEscalations chime latch; cleared on a severity upgrade
//   _updated         set when a continuation merged into this card. WRITE-ONLY since
//                    the v2 rewrite (475ec9c) dropped the "UPDATED" badge that read
//                    it. Kept because removing it is a UI decision, not an ingest one.
//   _reackRequired   a merge forced re-acknowledgement. Load-bearing: the merge nulls
//                    kitchen_ack_at LOCALLY while the row in the database still holds
//                    the old ack, so any later fold of that row would silently restore
//                    it and drop the re-ack requirement. foldRow re-applies the null.
//   _error           transient row-level write error; self-clears after 8s
//
// Before this change `loadExisting()` did a wholesale `cards[d.id]=d`, dropping
// _updated and _escalated, while the realtime UPDATE handler deliberately preserved
// them - so the same card ended in different UI state depending on how it arrived.
// One contract now covers both.
function isUiField(k){return k.charAt(0)==='_'}
function labelFrom(a){return (a&&a.label?a.label:'T?')+(a&&a.zone?' · '+a.zone:'')}
function labelFor(assetId){return assetLabels[assetId]||'T?'}
function rememberLabel(assetId,label){if(assetId&&label)assetLabels[assetId]=label}

// Union, order-preserving, case-insensitive. Dedupe is REQUIRED, not cosmetic: the
// fold below is monotonic, so without it every reconnect resync would concatenate the
// row's own allergens onto themselves and the list would grow without bound.
function unionAllergens(a,b){
  var out=[],seen={};
  (a||[]).concat(b||[]).forEach(function(x){
    var k=String(x==null?'':x).trim().toLowerCase();
    if(!k||seen[k])return;seen[k]=true;out.push(x);
  });
  return out;
}
// notes / guest_name merge rule - DETERMINISTIC, AUTHORITATIVE-WINS, NEVER CONCATENATE.
// The incoming database value wins when it is non-empty; otherwise the value already
// on the card is kept. Two reasons it is not concatenation: there is no correct way to
// combine two guests' free text, and `notes` is guest-authored text rendered unlabelled
// next to the derivative lists a cook acts on - gluing two of them together makes an
// already-open placement problem worse. The non-empty guard keeps the merge additive in
// intent: a follow-up row carrying no note must not erase a note the guest did write.
function firstNonEmpty(a,b){
  if(a!=null&&String(a).trim()!=='')return a;
  return (b!=null&&String(b).trim()!=='')?b:(a==null?b:a);
}

// Fold an AUTHORITATIVE database row over the card already held.
// Lifecycle columns (ack/verify/serve/close/delivery timestamps) are taken wholesale -
// the database owns operational truth. The three safety-bearing fields fold
// MONOTONICALLY (union / never-downgrade), which is what makes a re-fold safe: a
// resync, a replayed UPDATE, or a reconnect can never quietly drop an allergen or
// lower a severity that a merge had already raised. The trade is that a genuine
// downgrade in the database is not reflected on the board until reload; on an allergy
// surface that failure direction is the correct one.
function foldRow(cur,d){
  var allergens=unionAllergens(cur.allergens,d.allergens);
  var severity=maxSeverity(cur.severity,d.severity);
  var xc=!!(cur.cross_contact||d.cross_contact);
  var notes=firstNonEmpty(d.notes,cur.notes);
  var gname=firstNonEmpty(d.guest_name,cur.guest_name);
  Object.keys(d).forEach(function(k){if(!isUiField(k))cur[k]=d[k]});
  cur.allergens=allergens;cur.severity=severity;cur.cross_contact=xc;
  cur.notes=notes;cur.guest_name=gname;
  if(cur._reackRequired)cur.kitchen_ack_at=null;
  return cur;
}

// Merge only a genuine continuation: same guest session AND same table.
// Both guards are load-bearing.
//  - Truthy check: guest_session_id is nullable and most live rows are NULL, and
//    `null === null` is true - without this, any NULL-session row merged into the
//    first open NULL-session card.
//  - asset_id check: a shared session id alone never proved same-table, so two guests
//    sharing one would concatenate across tables. A cook would read allergens nobody
//    at that table declared, and the guest who did declare them would have no card.
function findContinuation(d){
  if(!d.guest_session_id)return null;
  return Object.keys(cards).find(function(id){
    return cards[id].guest_session_id===d.guest_session_id&&cards[id].asset_id===d.asset_id&&!cards[id].closed_at
  })||null;
}

// Content-only combine for a continuation. The host card keeps its own id and its own
// lifecycle timestamps; only the safety content merges.
function mergeContent(cur,d){
  var before=cur.severity;
  cur.allergens=unionAllergens(cur.allergens,d.allergens);
  // Severity is reconciled, not silently kept (517eabf). Previously the merge left the
  // existing value in place, so a guest adding an anaphylaxis allergen to a discomfort
  // session stayed 'discomfort' - severity flattening on the reader side.
  cur.severity=maxSeverity(cur.severity,d.severity);
  // Cross-contact merges with the same never-downgrade shape. The lockout's XC badge
  // reads this field and tableside computes it with some() across declared allergens,
  // so a merge that drops it loses a flag the guest did set.
  cur.cross_contact=!!(cur.cross_contact||d.cross_contact);
  cur.notes=firstNonEmpty(d.notes,cur.notes);
  cur.guest_name=firstNonEmpty(d.guest_name,cur.guest_name);
  cur._updated=true;
  cur._reackRequired=true;
  cur.kitchen_ack_at=null;
  // Everything downstream of severity is re-derived, not just stored. Row colour and
  // the escalation timeout read c.severity and pick it up on the next render. The
  // _escalated latch does NOT - and this line is the whole reason the timeout change
  // takes effect. checkEscalations fires at most once per card (`!c._escalated`), so
  // an upgraded card that already escalated as 'discomfort' would keep the 90s timeout
  // it fired against and never get the 30s anaphylaxis one. Not redundant.
  if(cur.severity!==before)delete cur._escalated;
  return cur.severity!==before;
}

// The condition the lockout modal exists for: an un-acknowledged, still-open
// anaphylaxis declaration. Deliberately independent of how the row arrived.
function lockoutEligible(c){
  return !!c&&isAnaph(c.severity)&&!c.kitchen_ack_at&&!c.closed_at&&!c.served_at;
}

// Alarm throttle. A load path can enqueue several cases in one tick; three overlapping
// bursts of chimeAnaphylaxis() read as noise, not as three escalations. One burst per
// 3s window, so a case arriving later still gets its own alarm.
function anaphAlarm(){
  var t=Date.now();if(t-lastAnaphAlarm<3000)return;lastAnaphAlarm=t;chimeAnaphylaxis();
}

function enqueueLockout(id){
  if(lockoutActive===id)return;
  if(lockoutQueue.indexOf(id)!==-1)return;
  lockoutQueue.push(id);
  anaphAlarm();
  if(!lockoutActive)advanceLockout();
}

// Advances by EXACTLY ONE eligible case. Cases that were acknowledged, closed or
// served while they waited are skipped here rather than pruned on write - the queue
// holds ids, and eligibility is re-read from the card at the moment it would be shown.
function advanceLockout(){
  while(lockoutQueue.length){
    var id=lockoutQueue.shift();
    if(!lockoutEligible(cards[id]))continue;
    lockoutActive=id;lockoutStage='receive';showLockout(id);return;
  }
  lockoutActive=null;lockoutStage=null;closeLockout();
}

function dismissLockout(id){
  if(lockoutActive!==id)return;
  lockoutActive=null;lockoutStage=null;
  advanceLockout();
}

// delivered_to_kitchen_at handshake. ATOMIC, not a client-side check: the .is() filter
// becomes `WHERE id = ? AND delivered_to_kitchen_at IS NULL`, and Postgres re-evaluates
// that predicate after taking the row lock, so a replay, a reconnect resync, or a
// second board cannot overwrite a true first-delivery timestamp with a later false one.
// Reading the column client-side first and branching on it would leave exactly that
// race open. ALLERGYSHIELD_EVENT_SCHEMA_V1 refuses to synthesize delivered_to_kitchen;
// backfilling from a later ingest is the same error in a different direction.
// Zero rows returned is the SUCCESS case for a row already delivered - not an error.
function recordDelivery(id,existingTs){
  if(!id||existingTs||deliveryPending[id])return;
  deliveryPending[id]=true;
  sb.from('allergen_declarations')
    .update({delivered_to_kitchen_at:new Date().toISOString(),device_id:deviceName})
    .eq('id',id)
    .is('delivered_to_kitchen_at',null)
    .select('id,delivered_to_kitchen_at,device_id')
    .then(function(res){
      delete deliveryPending[id];
      if(res.error){console.error('[kitchen] delivery handshake failed:',res.error);return}
      if(res.data&&res.data.length&&cards[id]){
        cards[id].delivered_to_kitchen_at=res.data[0].delivered_to_kitchen_at;
        cards[id].device_id=res.data[0].device_id;
        cacheCards();
      }
    },function(e){delete deliveryPending[id];console.error('[kitchen] delivery handshake threw:',e)});
}

// source: 'cache' | 'load' | 'realtime-insert' | 'realtime-update'
// Returns the id of the card the row landed on (a continuation returns its host).
// Does NOT render - callers render once, so a load of N rows is one render.
function ingestDeclaration(d,source){
  if(!d||!d.id)return null;
  // `assets` is a query artifact of the embed, not a column. Harvest the label into
  // the session map and drop it so cards hold database columns only.
  if(d.assets){rememberLabel(d.asset_id,labelFrom(d.assets));delete d.assets}

  var id=d.id,fresh=!cards[id],merged=false;

  // Continuation merge stays realtime-INSERT-only. Applying it on the load path would
  // change which rows are one card on every refresh; that is a card-identity decision,
  // not an ingest one, and is recorded as an open item rather than taken here.
  if(source==='realtime-insert'&&fresh){
    var host=findContinuation(d);
    if(host){
      mergeContent(cards[host],d);
      id=host;merged=true;
      // The merged-in row physically reached this board even though it renders inside
      // another card. Stamp its own delivery so the audit trail is not a lie by omission.
      recordDelivery(d.id,d.delivered_to_kitchen_at);
    }
  }

  if(!merged){
    if(fresh){
      var seed={};Object.keys(d).forEach(function(k){if(!isUiField(k))seed[k]=d[k]});
      cards[id]=seed;
    }else{
      foldRow(cards[id],d);
    }
    // 'cache' is a pre-network restore of local state, not evidence of delivery.
    if(source!=='cache')recordDelivery(id,cards[id].delivered_to_kitchen_at);
  }

  var c=cards[id];
  c._assetLabel=labelFor(c.asset_id);

  // ---- escalation contract ----
  // Skipped for 'cache': the restore runs before any network call, so it cannot know
  // whether the row was acknowledged elsewhere since, and alarming on stale local
  // state is its own trust violation. loadExisting() runs immediately after and arms
  // escalation from authoritative data. On a board with no network at all the 1s
  // checkEscalations latch still chimes for an un-acked anaphylaxis past 30s.
  if(source!=='cache'){
    if(lockoutEligible(c))enqueueLockout(id);
    else if(merged)chimeStandard();
    else if(fresh&&source==='realtime-insert')chimeStandard();
    // No standard chime on 'load': a refresh is not a new arrival. The anaphylaxis
    // lockout is asymmetric to that on purpose - it is an escalation, not a notice.
  }

  // The visible case was acknowledged/closed/served somewhere else (another board, or
  // this board's own realtime echo). Advance rather than sit on a resolved lockout.
  if(lockoutActive===id&&lockoutStage==='receive'&&!lockoutEligible(c))dismissLockout(id);

  return id;
}

function renderCards(){
  var area=document.getElementById('cardArea');
  var ids=Object.keys(cards);
  var visible=ids.filter(function(id){return !ghosted[id]&&!cards[id].closed_at});
  var ghostIds=ids.filter(function(id){return ghosted[id]&&!cards[id].closed_at});

  var needs=visible.filter(function(id){return !cards[id].kitchen_ack_at});
  var working=visible.filter(function(id){return cards[id].kitchen_ack_at&&!cards[id].served_at});
  var served=visible.filter(function(id){return !!cards[id].served_at});

  function sSort(a,b){var ca=cards[a],cb=cards[b];if(isAnaph(ca.severity)&&!isAnaph(cb.severity))return -1;if(!isAnaph(ca.severity)&&isAnaph(cb.severity))return 1;return new Date(ca.created_at)-new Date(cb.created_at)}
  needs.sort(sSort);working.sort(sSort);served.sort(sSort);

  if(!needs.length&&!working.length&&!served.length&&!ghostIds.length){
    area.innerHTML='<div class="empty"><svg width="64" height="80" viewBox="0 0 72.71 90.04" opacity=".3"><path style="fill:var(--cyan)" d="M36.36,0C16.28,0,.6,16.3.01,36.36c-.64,21.77,29.31,48.22,35.31,53.29.61.52,1.48.52,2.08,0,5.96-4.98,35.31-30.65,35.31-53.31C72.71,16.27,56.43,0,36.36,0z"/><path fill="#fff" d="M25.11,17.28c0-1.61,1.3-2.91,2.91-2.91s2.91,1.3,2.91,2.91v12.86h13.77c1.61,0,2.91,1.3,2.91,2.91v14.3c0,1.6-1.3,2.91-2.91,2.91s-2.91-1.31-2.91-2.91v-11.4h-10.86v11.98c0,1.6-1.31,2.91-2.91,2.91s-2.91-1.31-2.91-2.91v-30.65z"/><path fill="#fff" d="M56.41,54.42c-3.84,7.64-11.53,12.39-20.07,12.39s-16.31-4.87-20.07-12.4c-.71-1.44-.12-3.18,1.31-3.9,1.44-.71,3.18-.12,3.9,1.31,2.77,5.57,8.61,9.18,14.86,9.18s12.02-3.52,14.87-9.19c.73-1.43,2.47-2.01,3.9-1.28,1.44.71,2.02,2.47,1.3,3.9z"/></svg><div class="empty-text">No Active Allergies</div></div>';
    updateSummary();resetDim();return;
  }

  var h='';
  function buildCard(id){
    var c=cards[id],an=isAnaph(c.severity),sv=(c.severity||'').toLowerCase();
    var acked=!!c.kitchen_ack_at,proto=!!c.protocol_confirmed_at,verified=!!c.verified_at,isSrv=!!c.served_at;
    var sevCol=an?'var(--danger)':sv==='severe'?'var(--warn)':sv==='discomfort'?'var(--cyan)':'var(--t2)';
    var accCol=isSrv?'var(--t3)':verified?'var(--ok)':sevCol;
    var rowCls=isSrv?'row closed served':(!acked?(an?'row pulse-r':'row pulse-a'):(verified?'row closed safe':'row working'));
    var allergens=(c.allergens||[]).join(', ');
    var exId='ex-'+id;
    var isOpen=document.getElementById(exId)&&document.getElementById(exId).style.display!=='none';

    // Stage dots for compact row
    var d1='<div class="stg '+(isSrv?'dg':'da')+'">'+CK+'</div>';
    var d2=acked?'<div class="stg '+(isSrv?'dg':'da')+'">'+CK+'</div>':'<div class="stg"></div>';
    var d3=verified?'<div class="stg '+(isSrv?'dg':'dv')+'">'+CK+'</div>':'<div class="stg"></div>';
    var d4=isSrv?'<div class="stg dg">'+CK+'</div>':'<div class="stg"></div>';
    var l1='<div class="sln'+(acked?(isSrv?' dg':' da'):'')+'"></div>';
    var l2='<div class="sln'+(verified?(isSrv?' dg':' dv'):'')+'"></div>';
    var l3='<div class="sln'+(isSrv?' dg':'')+'"></div>';

    if(!isSrv&&!isOpen)rowCls=rowCls.replace('row ','row closed ');

    h+='<div class="'+rowCls+'" onclick="toggleCard(\''+esc(id)+'\')">';
    h+='<div class="ac" style="background:'+accCol+'"></div>';
    h+='<div class="r-tbl"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc((c._assetLabel||'Table').split(' ')[0])+'</div>';
    h+='<div class="r-guest"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc(guestLabel(c))+'</div>';
    h+='<div class="r-al" style="color:'+(isSrv?'var(--t3)':sevCol)+'">'+esc(allergens)+'</div>';
    h+='<div class="r-sev '+(an?'r':'a')+'"'+(isSrv?' style="background:rgba(148,163,184,.06);color:var(--t3)"':'')+'>'+esc((c.severity||'unknown').toUpperCase())+'</div>';
    if(c.cross_contact&&!isSrv)h+='<div class="r-xc '+(an?'r':'a')+'">XC</div>';
    h+='<div class="r-tm"'+(isSrv?' style="color:var(--t3)"':'')+' id="timer-'+esc(id)+'">'+(isSrv?fmtTime(c.served_at):fmtTimer(c.created_at))+'</div>';
    h+='<div class="stages">'+d1+l1+d2+l2+d3+l3+d4+'</div>';
    h+='</div>';

    // Expanded details
    h+='<div class="exp" id="'+esc(exId)+'" style="display:none">';

    // Row-level error (surfaced when a write fails — reverted local state +
    // visible message so the operator knows the action didn't take effect).
    if(c._error)h+='<div class="row-err">'+esc(c._error)+'</div>';

    // Horizontal progress rail
    h+='<div class="prog">';
    h+='<div class="ps"><div class="pd '+(isSrv?'dg':'da')+'">'+CK+'</div><div class="plbl '+(isSrv?'g':'a')+'">Received</div><div class="ptm">'+fmtTime(c.created_at)+'</div></div>';
    h+='<div class="pln '+(acked?(isSrv?'g':'a'):'')+'"></div>';
    h+='<div class="ps"><div class="pd '+(acked?(isSrv?'dg':'da'):'')+'">'+(!acked?'':CK)+'</div><div class="plbl '+(acked?(isSrv?'g':'a'):'')+'">Confirmed</div>'+(acked?'<div class="ptm">'+fmtTime(c.kitchen_ack_at)+'</div>':'')+'</div>';
    h+='<div class="pln '+(verified?(isSrv?'g':'v'):'')+'"></div>';
    h+='<div class="ps"><div class="pd '+(verified?(isSrv?'dg':'dv'):'')+'">'+(!verified?'':CK)+'</div><div class="plbl '+(verified?(isSrv?'g':'v'):'')+'">Safe</div>'+(verified?'<div class="ptm">'+fmtTime(c.verified_at)+'</div>':'')+'</div>';
    h+='<div class="pln '+(isSrv?'g':'')+'"></div>';
    h+='<div class="ps"><div class="pd '+(isSrv?'dg':'')+'">'+(!isSrv?'':CK)+'</div><div class="plbl '+(isSrv?'g':'')+'">Served</div>'+(isSrv?'<div class="ptm">'+fmtTime(c.served_at)+'</div>':'')+'</div>';
    h+='</div>';

    // Avoid all — one block per declared allergen, hit or miss. Severity gates
    // prominence (.low), never existence: an allergen with no derivative list is
    // the one most likely to be mishandled, so it must never be the one we omit.
    if(!isSrv){
      var lowW=(an||sv==='severe')?'':' low';
      (c.allergens||[]).forEach(function(a){
        var defs=getAllergenDef(a);
        // defs.map(esc) not esc(defs.join(…)) — the ' · ' separator is ours and must
        // stay literal; escaping the joined string would leave it intact but is the
        // wrong shape and breaks the moment a separator character needs escaping.
        // Same reasoning for the ' — ' in the heading.
        if(defs)h+='<div class="avoid'+lowW+'" style="border-color:'+sevCol+'"><div class="avoid-t" style="color:'+sevCol+'">Avoid all — '+esc(a)+'</div><div class="avoid-l">'+defs.map(esc).join(' · ')+'</div></div>';
        else h+='<div class="avoid avoid-miss'+lowW+'"><div class="avoid-t">No derivative list — '+esc(a)+'</div><div class="avoid-l">Not in the reference list. Confirm ingredients with the guest.</div></div>';
      });
    }
    if(c.notes&&!isSrv)h+='<div class="al-notes">'+esc(stripNotes(c.notes))+'</div>';

    // Action buttons
    if(!acked){
      h+='<div class="hold-btn '+(an?'red':'amber')+'" ontouchstart="startHold(\''+esc(id)+'\')" ontouchend="endHold(\''+esc(id)+'\')" onmousedown="startHold(\''+esc(id)+'\')" onmouseup="endHold(\''+esc(id)+'\')" onmouseleave="endHold(\''+esc(id)+'\')"><div class="hold-fill" id="fill-'+esc(id)+'"></div><span class="hold-lbl" id="holdLabel-'+esc(id)+'">Hold to Confirm Allergy Received</span></div>';
    }
    if(acked&&!proto&&an){
      h+='<div class="hold-btn red" onclick="confirmProtocol(\''+esc(id)+'\')" style="margin-top:8px"><span class="hold-lbl">Confirm Prep Area Cleared</span></div>';
    }
    if(acked&&(!an||proto)&&!verified&&!isSrv){
      h+='<div class="hold-btn green" onclick="verifyDish(\''+esc(id)+'\')" style="margin-top:8px"><span class="hold-lbl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>Verify Safe to Serve</span></div>';
    }
    if(verified&&!isSrv){
      h+='<div class="hold-btn" style="margin-top:8px;background:var(--s2);border:1px solid var(--b2);color:var(--t1)" onclick="markServed(\''+esc(id)+'\')"><span class="hold-lbl">Mark as Served</span></div>';
    }

    // POS disabled
    if(!isSrv){
      h+='<div class="pos-d"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Order items</span><span class="pos-tag">Coming soon</span></div>';
    }
    h+='</div>';
  }

  if(needs.length){
    h+='<div class="sec-l">Needs Action <span class="sec-ct red">'+needs.length+'</span><div class="sec-ln"></div></div>';
    needs.forEach(function(id){buildCard(id)});
  }
  if(working.length){
    h+='<div class="sec-l">Working <span class="sec-ct amber">'+working.length+'</span><div class="sec-ln"></div></div>';
    working.forEach(function(id){buildCard(id)});
  }
  if(served.length){
    h+='<div class="sec-l">Served Today <span class="sec-ct gray">'+served.length+'</span><div class="sec-ln"></div></div>';
    served.forEach(function(id){buildCard(id)});
  }

  area.innerHTML=h;
  renderGhosts(ghostIds);
  updateSummary();
  resetDim();
}

function toggleCard(id){var el=document.getElementById('ex-'+id);if(!el)return;el.style.display=el.style.display==='none'?'':'none'}

function renderGhosts(gIds){
  var gt=document.getElementById('ghostTabs');if(!gIds.length){gt.innerHTML='';return}
  var h='';gIds.forEach(function(id){var c=cards[id];h+='<div class="ghost-tab '+(isAnaph(c.severity)?'red':'amber')+'" onclick="restoreGhost(\''+esc(id)+'\')"><div>'+esc((c._assetLabel||'T?').split(' ')[0])+'</div></div>'});
  gt.innerHTML=h;
}

function updateSummary(){
  var ids=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at});
  var tables=new Set(),alCount=0,anCount=0,unack=0;
  ids.forEach(function(id){var c=cards[id];tables.add(c.asset_id);alCount+=(c.allergens||[]).length;if(isAnaph(c.severity))anCount++;if(!c.kitchen_ack_at)unack++});
  var p=[];
  p.push('<span class="w">'+tables.size+' Table'+(tables.size!==1?'s':'')+'</span>');
  p.push('<span class="w">'+alCount+' Allerg'+(alCount!==1?'ies':'y')+'</span>');
  if(anCount)p.push('<span class="rd">'+anCount+' Anaphylaxis</span>');
  if(unack)p.push('<span class="rd">'+unack+' Need Action</span>');
  else if(ids.length)p.push('<span style="color:var(--ok)">All Confirmed</span>');
  document.getElementById('summaryBar').innerHTML=p.join(' · ');
}

var holdTimers={};
function startHold(id){
  var start=Date.now();var fill=document.getElementById('fill-'+id);var label=document.getElementById('holdLabel-'+id);
  function tick(){var p=Math.min((Date.now()-start)/1500,1);if(fill)fill.style.width=(p*100)+'%';if(p>=1){doAck(id);return}holdTimers[id]=requestAnimationFrame(tick)}
  holdTimers[id]=requestAnimationFrame(tick);
}
function endHold(id){if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}var fill=document.getElementById('fill-'+id);if(fill)fill.style.width='0'}

// Optimistic-with-revert pattern: local state updates immediately so the UI
// responds to the 1.5s hold completing, then the DB write follows. On failure
// the local state is reverted to the prior valid state so the operator never
// sees an indeterminate mixed state. Chime + cache fire ONLY after the DB
// confirms — the chime now means "the database accepted the transition."
async function doAck(id){
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  var c=cards[id];if(!c)return;
  var prev={kitchen_ack_at:c.kitchen_ack_at,kitchen_ack_by:c.kitchen_ack_by,status:c.status};
  c.kitchen_ack_at=new Date().toISOString();c.kitchen_ack_by=deviceName;c.status='acknowledged';
  renderCards();
  var {error}=await sb.from('allergen_declarations').update({kitchen_ack_at:c.kitchen_ack_at,kitchen_ack_by:c.kitchen_ack_by,status:'acknowledged'}).eq('id',id);
  if(error){console.error('[kitchen] acknowledge failed:',error);Object.assign(c,prev);renderCards();showRowError(id,"Couldn't acknowledge — try again");return}
  delete c._error;
  // The re-ack the merge demanded has now happened, and the database row carries the
  // fresh timestamp, so foldRow must stop re-nulling it.
  delete c._reackRequired;
  chimeAck();
  // Anaphylaxis stays in the modal for stage 2 (prep area) on the SAME card - the
  // queue must not advance here. dismissLockout is a no-op unless `id` is the case
  // actually on screen, so acknowledging an inline card can never close another
  // case's lockout.
  if(isAnaph(c.severity)){showLockoutProtocol(id)}else{dismissLockout(id)}
  renderCards();cacheCards();
}

async function confirmProtocol(id){
  var c=cards[id];if(!c)return;
  var prev={protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by};
  c.protocol_confirmed_at=new Date().toISOString();c.protocol_confirmed_by=deviceName;
  renderCards();
  var {error}=await sb.from('allergen_declarations').update({protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by}).eq('id',id);
  if(error){console.error('[kitchen] protocol confirm failed:',error);Object.assign(c,prev);renderCards();showRowError(id,"Couldn't confirm prep area — try again");return}
  delete c._error;
  chimeAck();
  // End of stage 2 - this case is done. Advance to the next queued lockout, if any.
  dismissLockout(id);renderCards();cacheCards();
}

async function verifyDish(id){
  var c=cards[id];if(!c)return;
  var prev={verified_at:c.verified_at,verified_by:c.verified_by};
  c.verified_at=new Date().toISOString();c.verified_by=deviceName;
  renderCards();
  var {error}=await sb.from('allergen_declarations').update({verified_at:c.verified_at,verified_by:c.verified_by}).eq('id',id);
  if(error){console.error('[kitchen] verify failed:',error);Object.assign(c,prev);renderCards();showRowError(id,"Couldn't verify — try again");return}
  delete c._error;
  chimeAck();
  renderCards();cacheCards();
}

async function markServed(id){
  var c=cards[id];if(!c)return;
  var prev={served_at:c.served_at,status:c.status};
  c.served_at=new Date().toISOString();c.status='resolved';
  renderCards();
  var {error}=await sb.from('allergen_declarations').update({served_at:c.served_at,status:'resolved'}).eq('id',id);
  if(error){console.error('[kitchen] mark served failed:',error);Object.assign(c,prev);renderCards();showRowError(id,"Couldn't mark served — try again");return}
  delete c._error;
  chimeAck();
  renderCards();cacheCards();
}

function showLockout(id){
  var c=cards[id],lk=document.getElementById('lockout'),lc=document.getElementById('lockoutContent');
  var allergens=(c.allergens||[]).join(', '),gn=guestLabel(c);
  var avoidHtml='';
  // Same hit/miss branch and labelling as buildCard. Severity prominence does not
  // apply here — the lockout only fires on anaphylaxis, so every block is full weight.
  (c.allergens||[]).forEach(function(a){
    var d=getAllergenDef(a);
    if(d)avoidHtml+='<div style="border-left:3px solid var(--danger);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--danger);text-transform:uppercase;margin-bottom:4px">Avoid all — '+esc(a)+'</div><div style="font-size:18px;font-weight:500;color:var(--t1);line-height:1.5">'+d.map(esc).join(' · ')+'</div></div>';
    else avoidHtml+='<div style="border-left:3px solid var(--t2);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;text-align:left;max-width:500px;width:100%"><div style="font-size:14px;font-weight:700;color:var(--t2);text-transform:uppercase;margin-bottom:4px">No derivative list — '+esc(a)+'</div><div style="font-size:18px;font-weight:500;color:var(--t2);line-height:1.5">Not in the reference list. Confirm ingredients with the guest.</div></div>';
  });
  lc.innerHTML='<div class="lockout-title">'+esc(c._assetLabel||'TABLE')+'</div><div style="font-size:24px;font-weight:700;color:var(--t1);margin-bottom:8px">'+esc(gn)+'</div><div style="font-size:32px;font-weight:800;color:var(--danger);margin-bottom:16px">'+esc(allergens)+'</div><div style="display:flex;gap:8px;margin-bottom:12px"><div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">ANAPHYLAXIS</div>'+(c.cross_contact?'<div style="padding:6px 14px;border-radius:6px;font-size:16px;font-weight:700;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)">XC</div>':'')+'</div>'+avoidHtml+'<div class="lockout-sub">This allergy must be confirmed and prep area cleared</div><div class="hold-btn red" style="max-width:500px;width:100%;height:60px" ontouchstart="startHold(\''+esc(id)+'\')" ontouchend="endHold(\''+esc(id)+'\')" onmousedown="startHold(\''+esc(id)+'\')" onmouseup="endHold(\''+esc(id)+'\')" onmouseleave="endHold(\''+esc(id)+'\')"><div class="hold-fill" id="fill-'+esc(id)+'"></div><span class="hold-lbl" id="holdLabel-'+esc(id)+'">Hold to Confirm Allergy Received</span></div>';
  lk.classList.add('on');
}

// Stage 2 for a case already in the modal. Claims the single modal slot explicitly so
// a queued case cannot be shown over it.
function showLockoutProtocol(id){
  lockoutActive=id;lockoutStage='protocol';
  var lk=document.getElementById('lockout'),lc=document.getElementById('lockoutContent');
  lc.innerHTML='<div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.1);border:2px solid var(--ok);display:flex;align-items:center;justify-content:center;margin-bottom:16px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="stroke:var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="lockout-title" style="color:var(--ok)">ALLERGY RECEIVED</div><div class="lockout-sub">Confirm prep area, utensils, and surfaces are separated</div><div class="hold-btn red" style="max-width:500px;width:100%;height:60px" onclick="confirmProtocol(\''+esc(id)+'\')"><span class="hold-lbl">Confirm Prep Area Cleared</span></div>';
  lk.classList.add('on');
}

// Raw hide. Everything that ENDS a case goes through dismissLockout() so the queue
// advances by exactly one; this is only the mechanical close.
function closeLockout(){document.getElementById('lockout').classList.remove('on')}

// Minimize is a local UI preference (ghosting the card into the side rail).
// The minimized_at write is bookkeeping for admin reporting. If the write
// fails the ghost state stays — operator chose to hide it — but we surface
// the error so the divergence isn't silent.
async function minimizeCard(id){
  if(!cards[id]||!cards[id].kitchen_ack_at)return;
  ghosted[id]=true;renderCards();
  var {error}=await sb.from('allergen_declarations').update({minimized_at:new Date().toISOString()}).eq('id',id);
  if(error){console.error('[kitchen] minimize bookkeeping failed:',error);showRowError(id,"Hidden locally, but couldn't sync — try again");return}
  delete cards[id]._error;
  cacheCards();
}
function restoreGhost(id){delete ghosted[id];renderCards();cacheCards()}

var touchStartX=0,touchCardId=null;
document.addEventListener('touchstart',function(e){var card=e.target.closest('.row');if(!card)return;var id=card.querySelector('.ac');touchCardId=card;touchStartX=e.touches[0].clientX});
document.addEventListener('touchend',function(e){if(!touchCardId)return;var dx=e.changedTouches[0].clientX-touchStartX;touchCardId=null});

function checkEscalations(){
  Object.keys(cards).forEach(function(id){var c=cards[id];if(c.kitchen_ack_at||c.closed_at||c.served_at)return;
    var elapsed=Date.now()-new Date(c.created_at).getTime();var timeout=isAnaph(c.severity)?ACK_TIMEOUT_ANAPH:ACK_TIMEOUT;
    if(elapsed>timeout&&!c._escalated){c._escalated=true;if(isAnaph(c.severity))chimeAnaphylaxis();else chimeStandard()}
  });
}

setInterval(function(){
  Object.keys(cards).forEach(function(id){if(cards[id].closed_at||cards[id].served_at)return;
    var el=document.getElementById('timer-'+id);if(el)el.textContent=fmtTimer(cards[id].created_at)});
  checkEscalations();
  var hc=document.getElementById('headerClock');if(hc){var now=new Date();hc.textContent=now.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric',year:'numeric'})+' · '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
},1000);

function resetDim(){document.body.classList.remove('dimmed');clearTimeout(dimTimer);var n=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at}).length;if(!n)dimTimer=setTimeout(function(){document.body.classList.add('dimmed')},180000)}
document.addEventListener('touchstart',resetDim);document.addEventListener('mousedown',resetDim);

// v2 — 2026-08-12, bumped when HTML escaping shipped. A payload stored in a pre-fix
// cache re-renders at startup, and deleting the row from the database CANNOT reach it.
// Changing the key is the only eviction path that exists. The removeItem calls clear
// the old keys so a stale payload does not sit in storage indefinitely.
// v3 - 2026-08-26, bumped when underscore fields stopped being persisted. A v2 payload
// carries a latched _escalated and a stale _assetLabel; changing the key is the only
// eviction path that exists, and it is what actually removes _escalated persistence by
// subtraction. Deleting the write alone would leave latched payloads in storage on every
// board already in service. The removeItem calls clear v1 and v2 so they do not sit
// there indefinitely.
var CACHE_K='hc_k_cards_v3',GHOST_K='hc_k_ghosts_v3',LABEL_K='hc_k_labels_v3';
// Strips UI state on the way out - the cache holds database shape only. Derived table
// labels are cached separately (LABEL_K) rather than as a card field, so an offline
// reload still knows which table a card belongs to without smuggling _assetLabel back
// into the payload.
function stripUi(c){var o={};Object.keys(c).forEach(function(k){if(!isUiField(k))o[k]=c[k]});return o}
function cacheCards(){try{
  var pure={};Object.keys(cards).forEach(function(id){pure[id]=stripUi(cards[id])});
  localStorage.setItem(CACHE_K,JSON.stringify(pure));
  localStorage.setItem(GHOST_K,JSON.stringify(ghosted));
  localStorage.setItem(LABEL_K,JSON.stringify(assetLabels));
}catch(e){}}
function cacheLabels(){try{localStorage.setItem(LABEL_K,JSON.stringify(assetLabels))}catch(e){}}
function loadCache(){try{
  ['hc_k_cards','hc_k_ghosts','hc_k_cards_v2','hc_k_ghosts_v2'].forEach(function(k){localStorage.removeItem(k)});
  var l=localStorage.getItem(LABEL_K);if(l)assetLabels=JSON.parse(l)||{};
  var g=localStorage.getItem(GHOST_K);if(g)ghosted=JSON.parse(g)||{};
  // Restore through the ingest contract like every other path, so a cached row cannot
  // enter `cards` in a shape no other path could produce.
  var c=localStorage.getItem(CACHE_K);
  if(c){var parsed=JSON.parse(c)||{};Object.keys(parsed).forEach(function(k){ingestDeclaration(parsed[k],'cache')})}
}catch(e){}}
function setOnline(v){online=v;var hb=document.getElementById('heartbeat');var bn=document.getElementById('offlineBanner');if(v){hb.className='hb ok';bn.classList.remove('on')}else{hb.className='hb off';bn.classList.add('on')}}

// The load path. Also the resync path - see subscribe(). Every row goes through
// ingestDeclaration, so an un-acknowledged anaphylaxis row picked up here locks out,
// alarms, and records delivery exactly as one arriving over realtime does. Before this
// it was `cards[d.id]=d` with no severity branch at all, which is how a board that
// reconnected mid-service ingested anaphylaxis silently.
async function loadExisting(){
  if(!venueId)return;
  var today=new Date();today.setHours(0,0,0,0);
  var {data,error}=await sb.from('allergen_declarations').select('*, assets(label,zone)').eq('venue_id',venueId).gte('created_at',today.toISOString()).order('created_at',{ascending:false});
  if(error){console.error('[kitchen] load failed:',error);setOnline(false);return}
  if(!data)return;
  setOnline(true);
  // Ingested oldest-first so the lockout queue surfaces the longest-waiting case first.
  // The query stays newest-first because renderCards does its own sort.
  data.slice().reverse().forEach(function(d){ingestDeclaration(d,'load')});
  renderCards();cacheCards();
}

// Backfills the window a dropped channel missed. Throttled so a wake-then-resubscribe
// does not fire it twice.
var resyncAt=0;
function resync(){var t=Date.now();if(t-resyncAt<3000)return;resyncAt=t;loadExisting()}

// Resolves a table label without blocking ingest. Previously the realtime INSERT
// handler awaited this fetch BEFORE touching cards, so a failed or hanging assets
// query meant the declaration never ingested at all - a second silent alarm-loss path
// on the same surface. The card now lands first and the label patches in after.
function resolveAssetLabel(assetId){
  if(!assetId||assetLabels[assetId]||labelPending[assetId])return;
  labelPending[assetId]=true;
  sb.from('assets').select('label,zone').eq('id',assetId).single().then(function(res){
    delete labelPending[assetId];
    if(res.error||!res.data)return;
    rememberLabel(assetId,labelFrom(res.data));
    Object.keys(cards).forEach(function(k){if(cards[k].asset_id===assetId)cards[k]._assetLabel=labelFor(assetId)});
    // Repaint the modal if the case on screen is the one that just learned its label.
    if(lockoutActive&&lockoutStage==='receive'&&cards[lockoutActive]&&cards[lockoutActive].asset_id===assetId)showLockout(lockoutActive);
    renderCards();cacheLabels();
  },function(e){delete labelPending[assetId];console.error('[kitchen] asset label lookup failed:',e)});
}

function subscribe(){
  if(!venueId)return;
  var everSubscribed=false;
  sb.channel('kitchen-'+venueId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      // Ingest FIRST, label second. The alarm path must not sit behind a network call.
      ingestDeclaration(payload.new,'realtime-insert');
      renderCards();cacheCards();resetDim();
      resolveAssetLabel(payload.new.asset_id);
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'allergen_declarations',filter:'venue_id=eq.'+venueId},function(payload){
      var d=payload.new;
      // Unchanged: an UPDATE for a row this board has never seen is ignored. The
      // resync below is what closes that window, rather than half-ingesting a row
      // whose INSERT was missed.
      if(!cards[d.id])return;
      ingestDeclaration(d,'realtime-update');
      if(d.closed_at)delete ghosted[d.id];
      renderCards();cacheCards();
    })
    .subscribe(function(status){
      if(status==='SUBSCRIBED'){
        setOnline(true);
        // A RE-subscribe means the channel dropped and recovered. Anything inserted
        // during the gap was never delivered to this board; without this the board
        // looks healthy and is missing rows.
        if(everSubscribed)resync();
        everSubscribed=true;
      }
      else if(status==='CLOSED'||status==='CHANNEL_ERROR')setOnline(false);
    });
}

// Tablet wake / tab restore. A socket can die without ever emitting CLOSED, so
// resubscribe alone is not sufficient coverage for the named failure mode.
document.addEventListener('visibilitychange',function(){if(!document.hidden)resync()});

async function loadVenue(){
  if(!venueId)return;
  var {data}=await sb.from('venues').select('name').eq('id',venueId).single();
  if(data){document.getElementById('venueName').textContent=data.name+' · Kitchen';document.getElementById('venueLogo').textContent=data.name.charAt(0)}
}

loadCache();if(Object.keys(cards).length>0)renderCards();
loadVenue();loadExisting();subscribe();
</script>
