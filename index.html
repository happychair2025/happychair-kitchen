<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HC Kitchen · AllergyShield™</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
/* Simplified Chinese: the platform's SC face first, so no glyph falls back to a Japanese or
   Traditional form; tracking off, since letter-spacing breaks CJK text apart. */
:lang(zh-CN) body,body:lang(zh-CN),.lang-b:lang(zh-CN){font-family:-apple-system,'PingFang SC','Noto Sans SC','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif}
html:lang(zh-CN) *{letter-spacing:0!important}
:root{--bg:#0d1117;--s1:#141d2b;--s2:#1a2535;--b:#1e2d3d;--b2:#2d3f54;--b-soft:rgba(30,45,61,.3);--cyan:#22d3ee;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981;--t1:#e2e8f0;--t2:#94a3b8;--t3:#636e7b;--t4:#4a5568}
body.hc-mode{--bg:#000;--s1:#0a0a0a;--s2:#111;--b:#333;--b2:#555;--b-soft:rgba(51,51,51,.3);--danger:#f33;--warn:#fc0;--ok:#0f0;--cyan:#0ff;--t1:#fff;--t2:#ccc;--t3:#999;--t4:#777}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.hdr{min-height:52px;background:var(--s1);border-bottom:1px solid var(--b);display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;padding:6px 20px;flex-shrink:0;z-index:100}
.hdr-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#0891b2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--bg);margin-right:10px;flex-shrink:0}
.hdr-venue{font-size:16px;font-weight:700;color:var(--t1);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-clock{font-size:13px;color:var(--t2);font-weight:500;margin-right:14px;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
@media (max-width:900px){.hdr-right{flex-basis:100%}}
.hb{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hb.ok{background:var(--ok);animation:hbP 2s ease infinite}
.hb.off{background:var(--danger);animation:hbP .5s ease infinite}
@keyframes hbP{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.vol-ctrl{display:flex;align-items:center;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:4px 10px 4px 6px}
.vol-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cyan);flex-shrink:0}
.vol-icon .vw1,.vol-icon .vw2,.vol-icon .vw3{transition:opacity .15s}
.vol-off .vw1,.vol-off .vw2,.vol-off .vw3{opacity:0}
.vol-low .vw2,.vol-low .vw3{opacity:0}
.vol-med .vw3{opacity:0}
.vol-muted .vol-icon{color:var(--t2)}
.vol-range{width:70px;height:4px;-webkit-appearance:none;appearance:none;background:var(--b);border-radius:2px;outline:none;cursor:pointer;margin:0}
.vol-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:none}
.hdr-btn{width:40px;height:40px;border-radius:8px;background:var(--s2);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:.15s}
.hdr-btn:hover{background:var(--s2);border-color:var(--b2)}
.hdr-btn.on{border-color:var(--cyan);color:var(--cyan)}
/* In the page flow, between the header and the board: it pushes the board down rather than
   lying over the cards it is warning about. */
.offline-banner{display:none;position:relative;flex-shrink:0;background:#2a1418;border-bottom:2px solid var(--danger);padding:14px 20px;text-align:center;color:var(--danger);font-size:20px;font-weight:700}
.offline-banner.on{display:block}
.main{flex:1;overflow-y:auto;padding:12px 16px;position:relative}
.sec-l{font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 6px 4px;display:flex;align-items:center;gap:8px}
.sec-ct{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:700}
.sec-ct.red{background:rgba(239,68,68,.15);color:var(--danger)}
.sec-ct.amber{background:rgba(245,158,11,.12);color:var(--warn)}
.sec-ct.gray{background:rgba(148,163,184,.08);color:var(--t2)}
.sec-ln{flex:1;height:1px;background:var(--b)}
/* The one action on the row. Sized for a hand in a kitchen, and it never competes with the
   allergen text: it is the only filled element on the row. */
.hdr-logo-img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.hdr-logo.has-logo{background:#fff;padding:4px}
/* Reuses .hold-btn so the press-and-hold treatment is identical to the expanded panel — but
   .hold-btn is a full-width block button for that panel, and inheriting width:100% made this
   1114px wide and pushed it onto a line of its own — measured, not guessed. Scoped to .row so
   it outranks .hold-btn, which is declared later in this sheet and would otherwise win on
   source order at equal specificity. */
/* The independent-check review. Same overlay weight as the lockout because it is a
   full-attention screen, but deliberately its own element: the lockout is the anaphylaxis
   block and must not be reused for anything else. */
/* Kitchen had NO focus styling of any kind. That was tolerable while every control was a
   div; it stopped being tolerable when the hold buttons became real keyboard-operable
   <button>s — a safety control you can focus but cannot see focused. One rule, all of them. */
.hold-btn:focus,.r-act:focus,.hdr-btn:focus,.vfy-x:focus,.vd-st:focus,.row-retry:focus{outline:none}
.hold-btn:focus-visible,.r-act:focus-visible,.hdr-btn:focus-visible,.vfy-x:focus-visible,
.vd-st:focus-visible,.row-retry:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.vd-st{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 10px;
  border-radius:7px;border:1px solid var(--b2);background:var(--s2);color:var(--t2);cursor:pointer;
  min-height:32px;white-space:nowrap}
.vd-st.ok{border-color:rgba(16,185,129,.5);color:var(--ok)}
.pair-in{width:100%;margin-top:16px;padding:16px;font-size:34px;letter-spacing:.34em;text-align:center;
  border:1px solid var(--b2);border-radius:12px;background:var(--bg);color:var(--t1);font-family:inherit}
.vfy{position:fixed;inset:0;top:var(--hdr-h,52px);z-index:95;background:rgba(5,9,14,.93);display:none;
  align-items:center;justify-content:center;padding:12px 20px;overflow-y:auto}
.vfy.on{display:flex}
.vfy-card{background:var(--s1);border:1px solid var(--b2);border-radius:16px;padding:22px 24px;
  width:100%;max-width:560px;max-height:100%;overflow-y:auto}
.vfy-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.vfy-t{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--t1);flex:1}
.vfy-x{background:none;border:none;color:var(--t2);font-size:30px;line-height:1;cursor:pointer;
  min-width:44px;min-height:44px;font-family:inherit}
.vfy-tbl{font-size:30px;font-weight:800;color:#fff;line-height:1.1}
.vfy-guest{font-size:17px;font-weight:600;color:var(--t2);margin-top:2px}
.vfy-al{font-size:26px;font-weight:800;color:var(--t1);margin-top:8px;line-height:1.25}
.vfy-al.an{color:var(--danger)}
.vfy-marks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.vfy-sev,.vfy-xc{font-size:12px;font-weight:800;letter-spacing:.07em;padding:5px 10px;border-radius:6px;
  background:rgba(245,158,11,.16);color:var(--warn)}
.vfy-sev.an{background:rgba(239,68,68,.18);color:var(--danger)}
.vfy-xc{background:rgba(148,163,184,.14);color:var(--t1)}
.vfy-note{margin-top:8px;font-size:15px;font-weight:600;color:var(--warn)}
.vfy-sec{margin-top:16px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.vfy-body{margin-top:6px;font-size:16px;line-height:1.5;color:var(--t1)}
.vfy-honest{margin-top:12px;font-size:14px;line-height:1.5;color:var(--t2)}
.vfy-go{margin-top:16px}
.vfy-card .prog{margin-top:6px}
/* The record sheet absorbed the elapsed time and the stage rail from the inline panel that
   used to expand under the row. Same .prog markup, so the rail is one implementation. */
.vfy-el{margin-top:8px;font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums}
/* Navigation, not a safety write — so it must not wear the filled press-and-hold styling. */
.row .r-act--nav{background:var(--s2);border:1px solid var(--b2);color:var(--t1);
  display:flex;align-items:center;justify-content:center;border-radius:10px;
  font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.row .r-act{margin-left:auto;flex:0 0 auto;width:auto;min-width:150px;padding:0 20px;height:52px;margin-top:0}
.row .r-act--srv{background:var(--s2);border:1px solid var(--b2);color:var(--t1)}
/* Same table, more than one open submission. A statement of fact, not a merge. */
.r-el{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;margin-left:auto;padding-right:4px}
/* FROM EARLIER SERVICE — open work a closed service did not complete. Fully actionable and
   never collapsed (C4): it is neutral-labelled, not dimmed, because dimming reads as "done". */
.carried-note{font-size:13px;color:var(--t2);margin:-4px 0 10px 2px}
/* A write that did not land, stated ON the row. The whole strip opens the record, where the
   hold is — retrying a safety milestone is still a hold, never a tap. */
.row-retry{display:block;width:100%;margin:-4px 0 8px;padding:8px 12px;border-radius:0 0 8px 8px;cursor:pointer;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger);
  font:inherit;font-size:14px;font-weight:700;text-align:center;min-height:44px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:14px 16px;background:var(--s1);border-radius:10px 10px 0 0;cursor:pointer;position:relative;border:1px solid transparent;border-bottom:none}
.row.closed{border-radius:10px;border-bottom:1px solid transparent;margin-bottom:6px}
.row.pulse-r{animation:rp 1.2s ease infinite}
.row.pulse-a{animation:ap 2s ease infinite}
.row.working{border-color:rgba(245,158,11,.2)}
.row.safe{border-color:rgba(16,185,129,.2)}
.row.served{opacity:.35;border-color:transparent}
@keyframes rp{0%,100%{border-color:rgba(239,68,68,.8)}50%{border-color:rgba(239,68,68,.2)}}
@keyframes ap{0%,100%{border-color:rgba(245,158,11,.5)}50%{border-color:rgba(245,158,11,.1)}}
.row .ac{position:absolute;left:0;top:0;bottom:0;width:4px}
.r-tbl{font-size:22px;font-weight:700;color:#fff;min-width:40px;flex:0 0 auto}
/* Lowest-priority element on the row, and the only one allowed to give way. The order that
   must survive is service point → allergens → severity → action; the name truncates cleanly
   before any of them move. Full name is always in the expanded detail. */
.r-guest{font-size:17px;font-weight:600;color:var(--t1);min-width:0;max-width:150px;flex:0 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The allergens are the point of the row: they take the slack, and never wrap mid-list
   into a narrow column while a button hogs the width. */
.r-al{font-size:22px;font-weight:700;flex:1 1 200px;min-width:0}
/* Neither the severity nor the safety condition may be squeezed by a long name. */
.r-sev,.r-xc{flex:0 0 auto}
.r-sev{padding:4px 10px;border-radius:6px;font-size:14px;font-weight:700;text-transform:uppercase}
.r-sev.r{background:rgba(239,68,68,.2);color:var(--danger)}
.r-sev.a{background:rgba(245,158,11,.15);color:var(--warn)}
.r-xc{padding:3px 8px;border-radius:6px;font-size:13px;font-weight:700}
.r-upd{padding:3px 8px;border-radius:6px;font-size:13px;font-weight:700;background:var(--s2);border:1px solid var(--b2);color:var(--t1)}
.r-xc.r{background:rgba(239,68,68,.15);color:var(--danger)}
.r-xc.a{background:rgba(245,158,11,.08);color:var(--warn)}
.r-tm{font-size:18px;font-weight:600;color:#fff;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.stg svg{width:9px;height:9px}
.row-err{padding:10px 14px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:8px;color:var(--danger);font-size:14px;font-weight:600;margin:8px 0;text-align:center}
.prog{display:flex;align-items:flex-start;padding:10px 0}
.ps{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:0}
.pd{width:18px;height:18px;border-radius:50%;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;z-index:2}
.pd.da{border-color:var(--warn);background:var(--warn)}
.pd.dv{border-color:var(--ok);background:var(--ok)}
.pd.dg{border-color:var(--t3);background:var(--t3)}
.pd svg{width:10px;height:10px}
.plbl{font-size:12px;font-weight:600;margin-top:3px;color:var(--t4);text-align:center;line-height:1.2}
.plbl.a{color:var(--warn)}.plbl.v{color:var(--ok)}.plbl.g{color:var(--t3)}
.ptm{font-size:11px;color:var(--t2);margin-top:1px}
.pln{flex:.5 1 8px;height:2px;background:var(--b);margin:8px -2px 0;z-index:1}
.pln.a{background:var(--warn)}.pln.v{background:var(--ok)}.pln.g{background:var(--t3)}
.avoid{border-left:3px solid;padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.avoid-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.avoid-l{font-size:16px;font-weight:500;color:var(--t1);line-height:1.5}
.avoid-miss{border-color:var(--t2)}
.avoid-miss .avoid-t{color:var(--t2)}
.avoid-miss .avoid-l{color:var(--t2)}
.avoid.low{padding:6px 10px;margin:6px 0}
.avoid.low .avoid-t{font-size:11px}
.avoid.low .avoid-l{font-size:14px}
.al-notes-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--t3);margin:10px 0 2px;padding-top:10px;border-top:1px solid var(--b)}
.al-notes{font-size:16px;color:var(--t2);font-weight:500;margin:0 0 6px}
.hold-btn{position:relative;overflow:hidden;min-height:52px;padding:8px 14px;line-height:1.25;text-align:center;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;border:none;width:100%;user-select:none;-webkit-user-select:none;touch-action:none;margin-top:10px}
.hold-btn.red{background:var(--danger);color:#fff}
.hold-btn.amber{background:var(--warn);color:var(--bg)}
.hold-btn.green{background:var(--ok);color:#fff}
/* An action still to be taken. Green is completed/success, so a step that has NOT happened
   must not wear it. Same neutral surface as the row's Second Check → and Mark Served; the
   fill is light because the default dark fill is invisible on a dark button. */
.hold-btn.act{background:var(--s2);border:1px solid var(--b2);color:var(--t1)}
.hold-btn.act .hold-fill{background:rgba(226,232,240,.18)}
.hold-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.25);border-radius:10px}
.hold-lbl{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.ghost-tabs{position:fixed;right:0;top:52px;bottom:40px;width:36px;display:flex;flex-direction:column;gap:4px;padding:8px 0;z-index:50}
.ghost-tab{width:36px;min-height:80px;border-radius:8px 0 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;cursor:pointer;font-size:13px;font-weight:700;color:#fff;writing-mode:vertical-lr;text-orientation:mixed}
.ghost-tab.amber{background:rgba(245,158,11,.6)}
.ghost-tab.red{background:rgba(239,68,68,.7)}
.summary{min-height:40px;flex-wrap:wrap;row-gap:2px;padding:6px 12px;background:var(--s1);border-top:1px solid var(--b);display:flex;align-items:center;justify-content:center;gap:14px;font-size:14px;font-weight:600;color:var(--t2);flex-shrink:0}
.summary span{white-space:nowrap}.summary .w{color:#fff}.summary .rd{color:var(--danger);font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;opacity:.5}
.empty svg{margin-bottom:20px}
.empty-text{font-size:24px;font-weight:600;color:var(--t2)}
.audio-prompt{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
.audio-prompt-btn{padding:24px 48px;min-height:44px;background:var(--s1);border:2px solid var(--warn);border-radius:16px;font-size:22px;font-weight:700;color:var(--warn);cursor:pointer;font-family:inherit}
.lockout{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);padding:64px 40px 40px;overflow-y:auto}
@media (max-width:600px){.lockout{padding:64px 16px 40px}}
.lockout.on{display:flex;flex-direction:column}
.lockout .lockout-card{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
/* "1 of N": how many anaphylaxis alerts are waiting behind this one. Neutral — a count, not a
   severity — and updated in place so it never rebuilds the hold under a finger. */
.lk-queue{font-size:18px;font-weight:700;color:var(--t1);border:1px solid var(--b2);background:var(--s2);
  border-radius:8px;padding:6px 14px;margin-bottom:14px;text-align:center}
.row-note{margin:-4px 0 8px;padding:8px 12px;border-radius:0 0 8px 8px;background:var(--s2);border:1px solid var(--b2);
  color:var(--t1);font-size:14px;font-weight:600;text-align:center}
.lk-also{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:12px;text-align:center}
.r-also{font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.vfy-also{font-size:14px;font-weight:600;color:var(--t2);margin:2px 0 4px}
.lk-carried{font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t1);
  border:1px solid var(--b2);border-radius:8px;padding:6px 14px;margin-bottom:14px}
.lk-note,.vfy-note{max-width:500px;width:100%;margin-bottom:14px;padding:10px 14px;border-radius:8px;text-align:center;
  font-size:17px;font-weight:700;color:var(--t1);border:1px solid var(--b2);background:var(--s2)}
.vfy-note{max-width:none;font-size:14px;margin:8px 0}
.lockout-title{font-size:32px;font-weight:800;color:var(--danger);margin-bottom:12px;text-align:center}
.lockout-sub{font-size:20px;color:var(--t2);margin-bottom:32px;text-align:center}
body.dimmed .main{opacity:.3;transition:opacity 1s}
body.dimmed .summary{opacity:.3}

    /* Rehearsal marking. Deliberately not red, amber or cyan — this board reserves those
       for how dangerous an allergy is, and practice is not a severity. */
    .r-reh{font-size:11px;font-weight:800;letter-spacing:.09em;color:#c9adff;
      border:1px solid rgba(168,130,255,.55);border-radius:4px;padding:2px 7px;
      align-self:center;white-space:nowrap}
    .lockout-reh{font-size:20px;font-weight:800;letter-spacing:.1em;color:#c9adff;
      border:2px solid rgba(168,130,255,.6);border-radius:8px;padding:8px 18px;
      margin-bottom:18px;display:inline-block}
    /* Record Sheet: a status line ABOVE the title, not a second title. Compact, but still
       boxed, bold, uppercase and the full wording — smaller, never weaker. */
    .vfy-reh{font-size:13px;font-weight:800;letter-spacing:.1em;color:#c9adff;
      border:1.5px solid rgba(168,130,255,.6);border-radius:6px;padding:3px 9px;
      margin-bottom:6px;display:inline-block}
    .vfy-hl{flex:1;min-width:0}
    /* A completed milestone, stated once. Green marks the COMPLETED fact only; actions keep
       their existing roles. */
    .vfy-ok{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:9px 12px;border-radius:10px;
      border:1px solid rgba(16,185,129,.45);background:rgba(16,185,129,.08);font-size:17px;font-weight:700;color:var(--t1)}
    .vfy-ok svg{color:var(--ok);flex-shrink:0}.vfy-ok-t{margin-left:auto;font-size:13px;font-weight:500;color:var(--t2)}
    .vfy-back--only{margin-top:16px}
    .vfy-do{margin-top:16px;font-size:17px;font-weight:600;line-height:1.4;color:var(--t1)}
    .vfy-prov{margin-top:10px;font-size:12.5px;line-height:1.4;color:var(--t3);text-align:center}
    .lockout .vfy-prov{max-width:500px;width:100%;margin-top:14px;font-size:14px}
    .lk-notes{max-width:500px;width:100%;text-align:left;margin:4px 0 8px}

};
var KITCHEN_LOCALES=['en','es','zh-CN'];
// What the EN | ES | 中文 control shows — each language named in itself, never a flag.
var LANG_BTN={en:'EN',es:'ES','zh-CN':'中文'};
// The language the allergy DATA is stored in (allergen names, reference lists). Interface strings
// are translated; this data is not, and the board says so whenever the two differ.
var DATA_LOCALE='en';
var LOCALE_TAG={en:'en-US',es:'es-US','zh-CN':'zh-CN'};
var locale='en';
// Development surfaces (offline fixtures, localhost, ?i18ncheck=1) show a missing string as
// ⟦locale:key⟧ so it cannot ship unnoticed. Production falls back to the English string —
// the meaning of a safety instruction is never replaced by a guess — and logs it.
var I18N_DEV=/[?&](fixture|i18ncheck)=1/.test(location.search)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var i18nLogged={};
function tRaw(key,n){
  var k=key,cat=I18N[locale]||I18N.en;
  if(typeof n==='number'&&I18N.en[key+'.one']!==undefined)k=key+(n===1?'.one':'.other');
  var s=cat[k];
  if(s===undefined){
    if(!i18nLogged[locale+':'+k]){i18nLogged[locale+':'+k]=1;console.error('[kitchen] missing '+locale+' string: '+k)}
    if(I18N_DEV||I18N.en[k]===undefined)return '⟦'+locale+':'+k+'⟧';
    s=I18N.en[k];
  }
  return s;
}
// HTML-safe: the template is escaped, then each {placeholder} is filled with its escaped value,
// or with trusted markup passed as {html:'…'} (a timer span, a bold label).
function th(key,p){
  var s=esc(tRaw(key,p&&p.n));
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,k){var v=p[k];if(v===undefined)return m;
    return (v!==null&&typeof v==='object'&&'html' in v)?v.html:esc(String(v))});
  return s;
}
// Plain text, for textContent / title / aria where the browser does the escaping.
function tt(key,p){
  var s=tRaw(key,p&&p.n);
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,k){var v=p[k];return v===undefined?m:String(v)});
  return s;
}
// Catalog parity: every key in every locale, with identical placeholders. Run at boot; in
// development a failure is put on screen, not only in the console.
// The record sheet and pairing overlays start below the header so EN | ES stays reachable.
function syncHeaderHeight(){var h=document.querySelector('.hdr');if(h)document.documentElement.style.setProperty('--hdr-h',h.offsetHeight+'px')}
if(window.ResizeObserver){new ResizeObserver(syncHeaderHeight).observe(document.querySelector('.hdr'))}
window.addEventListener('resize',syncHeaderHeight);

function i18nParity(){
  var bad=[],en=I18N.en;
  KITCHEN_LOCALES.forEach(function(l){
    var cat=I18N[l]||{};
    Object.keys(en).forEach(function(k){
      if(cat[k]===undefined){bad.push(l+':'+k+' missing');return}
      var a=(en[k].match(/\{\w+\}/g)||[]).sort().join(),b=(cat[k].match(/\{\w+\}/g)||[]).sort().join();
      if(a!==b)bad.push(l+':'+k+' placeholders '+b+' ≠ '+a);
    });
    Object.keys(cat).forEach(function(k){if(en[k]===undefined)bad.push(l+':'+k+' not in en')});
  });
  return bad;
}

function sevLabel(sev){
  var k=(sev||'').toLowerCase();
  if(I18N.en['sev.'+k]!==undefined)return th('sev.'+k);
  return k?esc(String(sev).toUpperCase()):th('sev.unknown');   // an unknown stored value stays data
}

// ── DISPLAY LANGUAGE ──────────────────────────────────────────────────────────────────────────
// Kitchen language belongs to THIS display (venue_devices.display_locale), never to whoever is
// on shift. Changing it only redraws: no state, no record, no step and no write is touched.
var hdrVenue=null;
var LOCALE_K='hc_k_locale';     // {d: device_id, l: locale, synced: bool} — first paint + unsent choice
var localeBootDone=false;
function localeCacheGet(){try{var r=JSON.parse(localStorage.getItem(LOCALE_K)||'null');
  return r&&vdToken&&r.d===vdToken.device_id&&KITCHEN_LOCALES.indexOf(r.l)>=0?r:null}catch(e){return null}}
function localeCacheSet(l,synced){try{if(vdToken)localStorage.setItem(LOCALE_K,JSON.stringify({d:vdToken.device_id,l:l,synced:!!synced}))}catch(e){}}
function holdInProgress(){return !!recordHolding||Object.keys(holdTimers).length>0}
function writeInFlight(){return !!(recordFlow&&recordFlow.phase==='saving')||Object.keys(cards).some(function(id){return cards[id]._writing})}
var langMsgTimer=null;
function langMsg(key){
  document.querySelectorAll('.lang-msg').forEach(function(el){el.textContent=key?tt(key):''});
  clearTimeout(langMsgTimer);
  if(key)langMsgTimer=setTimeout(function(){document.querySelectorAll('.lang-msg').forEach(function(el){el.textContent=''})},2500)}
// The same EN | ES control, for surfaces that cover the header (the anaphylaxis lockout). A cook
// facing a blocking modal in the wrong language must be able to change it there.
function langSwitchHtml(){
  return '<div class="lang-sw" role="group" aria-label="'+th('lang.label')+'">'
    +KITCHEN_LOCALES.map(function(l){var on=l===locale;
      return '<button type="button" class="lang-b'+(on?' on':'')+'" data-l="'+l+'" aria-pressed="'+on+'" '
        +'lang="'+l+'" onpointerdown="event.preventDefault()" onclick="switchLocale(\''+l+'\')">'+LANG_BTN[l]+'</button>'}).join('')
    +'<span class="lang-msg" role="status" aria-live="polite"></span></div>';
}
function applyStatic(){
  document.documentElement.lang=locale;
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=tt(el.getAttribute('data-i18n'))});
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){el.title=tt(el.getAttribute('data-i18n-title'))});
  document.querySelectorAll('[data-i18n-aria]').forEach(function(el){el.setAttribute('aria-label',tt(el.getAttribute('data-i18n-aria')))});
  document.querySelectorAll('.lang-b').forEach(function(b){var on=b.getAttribute('data-l')===locale;
    b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
  if(hdrVenue)document.getElementById('venueName').textContent=tt('hdr.kitchen',{venue:hdrVenue});
  vdRenderStatus();
}
// Redraw everything that is on screen, in place: the same records, the same open sheet on the
// same record at the same step, the same lockout stage.
function applyLocale(l){
  locale=l;

    // Every one of these stops the event: the row itself is now a control that opens the sheet,
    // so without this, holding a row button would open the sheet on top of the gesture.
    var act='';
    if(!isSrv){
      if(!acked){
        // The fill was missing here entirely, so the row hold showed no progress at all —
        // the whole of finding 1. A real <button> so it is focusable and keyboard-operable.
        act='<button type="button" class="r-act hold-btn '+(an?'red':'amber')+'" aria-label="'+th('hold.ack')+'" onclick="event.stopPropagation()" '
          +HOLD_ATTRS(id)+' onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"'
          +'><div class="hold-fill"></div><span class="hold-lbl">'+th('row.confirm_received')+'</span></button>';
      } else if(!proto&&an){
        act='<button type="button" class="r-act hold-btn red" aria-label="'+th('hold.prep')+'" onclick="event.stopPropagation()" '
          +HOLD_ATTRS(id,'prep')+' onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"'
          +'><div class="hold-fill"></div><span class="hold-lbl">'+th('row.confirm_prep')+'</span></button>';
      } else if(!verified){
        // "Second Check" names the STEP — a second look before the dish leaves — without
        // claiming a different person performed it. Kitchen identity comes from a ?device=
        // string on an anon page and is not proven, so any wording implying an independent
        // verifier would be a claim the data cannot support.
        // NAVIGATION ONLY — this writes nothing. It used to call verifyDish() straight from
        // the row, so a single tap recorded a verification milestone with no review and no
        // deliberate gesture. Opening the check must never be the check.
        act='<button type="button" class="r-act r-act--nav" aria-label="'+th('row.second_check_aria')+'" onclick="event.stopPropagation();openRecord(\''+esc(id)+'\')"><span class="hold-lbl">'+th('row.second_check')+'</span></button>';
      } else {
        act='<button type="button" class="r-act hold-btn r-act--srv" aria-label="'+th('hold.serve')+'" onclick="event.stopPropagation()" '
          +HOLD_ATTRS(id,'serve')+' onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"'
          +'><div class="hold-fill"></div><span class="hold-lbl">'+th('row.mark_served')+'</span></button>';
      }
    }

    // ONE WAY IN. The row used to toggle an inline panel that carried a second copy of every
    // control; it now opens the record sheet, which is the only detail surface there is.
    h+='<div class="'+rowCls+'" role="button" tabindex="0" aria-label="'+th('row.open')+'"'
      +' onclick="openRecord(\''+esc(id)+'\')"'
      +' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRecord(\''+esc(id)+'\')}">';
    h+='<div class="ac" style="background:'+accCol+'"></div>';
    if(isRehearsal(c))h+='<div class="r-reh">'+th('row.rehearsal')+'</div>';
    h+='<div class="r-tbl"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc((c._assetLabel||tt('misc.table')).split(' ')[0])+'</div>';
    h+='<div class="r-guest"'+(isSrv?' style="color:var(--t3)"':'')+'>'+esc(guestLabel(c))+'</div>';
    h+='<div class="r-al" style="color:'+(isSrv?'var(--t3)':sevCol)+'">'+esc(allergens)+'</div>';
    h+='<div class="r-sev '+(an?'r':'a')+'"'+(isSrv?' style="background:rgba(148,163,184,.06);color:var(--t3)"':'')+'>'+sevLabel(c.severity)+'</div>';
    // "XC" was internal shorthand on a surface read under time pressure by people who never saw
    // the schema. The stored boolean and its meaning are unchanged — only the word is.
    if(c.cross_contact&&!isSrv)h+='<div class="r-xc '+(an?'r':'a')+'">'+th('chip.cross_contact')+'</div>';
    // Derived from supersedes_id, not from the ephemeral _updated flag: a corrected
    // declaration must still read as a correction after a reload or a reconciliation read.
    if(isValidCorrection(c)&&!isSrv)h+='<div class="r-upd">'+th('row.updated')+'</div>';
    // Same table AND same guest session, another open record: stated as a count, never as a
    // relationship (which one corrects or extends the other is not known).
    var also=isSrv?0:sameVisitOthers(c);
    if(also)h+='<div class="r-also">'+th('card.also_here',{n:also})+'</div>';
    h+=act;
    h+='</div>';
    // A write that did not land is stated on the row itself, not only inside the record. The
    // strip opens the record, where the hold is: retrying a milestone is still a hold.
    // A neutral notice (e.g. "Checking with the server") is stated on the row too.
    if(!c._error&&c._notice)h+='<div class="row-note" role="status">'+th(c._notice)+'</div>';
    var unk=c._error==='err.unconfirmed'||c._error==='err.timeout';   // outcome unknown, not refused
    if(c._error)h+='<button type="button" class="row-retry" role="alert" onclick="openRecord(\''+esc(id)+'\')">'+th(unk?'row.unconfirmed':'row.not_saved')+'</button>';

    // NO EXPANDED PANEL. Everything that lived here — guest, cross-contact sentence, elapsed
    // time, the four-stage rail, the Avoid all blocks, guest notes — is in the record sheet,
    // which is reached by tapping the row. It had to go rather than be tidied: buildCard
    // emitted the panel with a hardcoded style="display:none" while toggleCard flipped that
    // style directly, and cardSig read the open state back out of the live DOM. So expanding a
    // card changed its signature without changing its markup, the next 5-second poll rebuilt
    // the wrapper from markup that says display:none, and the card silently collapsed itself.
    // Measured: expand, wait one poll, collapsed — which is exactly "it opens and then
    // retracts". The panel was also a second copy of every control, including a second Second
    // Check, and two hold buttons for one declaration share one holdTimers[id] slot.
    return h;
  }

  // ── ASSEMBLE A KEYED SEQUENCE, THEN RECONCILE ─────────────────────────────────────────
  // The board used to be rebuilt with one area.innerHTML on every poll, which destroyed and
  // recreated EVERY card node five seconds apart — measured: the Second Check button was
  // replaced on 4 of 4 polls with identical data. That is what makes a control stutter under
  // the pointer, and it churns interactive DOM underneath an operator for no reason.
  //
  // Now each card carries a signature of everything its markup depends on. Unchanged cards
  // keep their exact nodes; only what actually changed is rebuilt.
  var seq=[];
  function sec(key,label,cls,n,extra){
    label=th(label);
    seq.push({k:'sec:'+key,sig:label+'|'+n+'|'+(extra||''),cls:'sec-l',
      html:label+' <span class="sec-ct '+cls+'">'+n+'</span><div class="sec-ln"></div>'+(extra||'')});
  }
  // Derived from the RECORD ONLY. It used to include the group size and the panel's open state
  // read back from the live DOM — a signature that could change without the record changing,
  // which made a card rebuild itself for a reason the data knew nothing about.
  function cardSig(id){
    var c=cards[id];
    return [c.severity,(c.allergens||[]).join(','),c.guest_name,c.cross_contact,isValidCorrection(c)?1:0,
            c.service_kind,c._assetLabel,c.kitchen_ack_at,c.protocol_confirmed_at,c.verified_at,
            c.served_at,c._error||'',c._notice||'',c._ackPending?1:0,sameVisitOthers(c),locale].join('|');
  }
  function pushCards(list){list.forEach(function(id){
    seq.push({k:'card:'+id,sig:cardSig(id),cls:'card-wrap',build:id})})}

  if(needs.length){ sec('needs','board.needs','red',needs.length); pushCards(needs) }
  // FROM EARLIER SERVICE — below Needs You, above In Progress. Never collapsed.
  if(earlier.length){
    sec('carried','board.carried','gray',earlier.length);
    seq.push({k:'carried-note',sig:locale,cls:'carried-note',html:th('board.carried_note')});
    pushCards(earlier);
  }
  if(working.length){ sec('working','board.working','amber',working.length); pushCards(working) }
  if(served.length){ sec('served','board.done','gray',served.length); pushCards(served) }

  var have={};
  Array.prototype.slice.call(area.children).forEach(function(n){
    if(n.dataset&&n.dataset.k)have[n.dataset.k]=n; else n.remove();
  });
  var want=[];
  seq.forEach(function(e){
    var n=have[e.k];
    if(n){
      // REUSED UNTOUCHED when nothing it renders has changed. This is the whole fix.
      if(n.dataset.sig!==e.sig){
        n.innerHTML=e.build?buildCard(e.build):e.html;
        n.dataset.sig=e.sig;
      }
      delete have[e.k];
    }else{
      n=document.createElement('div');
      n.className=e.cls||''; n.dataset.k=e.k; n.dataset.sig=e.sig;
      n.innerHTML=e.build?buildCard(e.build):e.html;
    }
    want.push(n);
  });
  Object.keys(have).forEach(function(k){have[k].remove()});
  want.forEach(function(n,i){ if(area.children[i]!==n)area.insertBefore(n,area.children[i]||null) });

  renderRecord();
  renderGhosts(ghostIds);
  updateSummary();
  resetDim();
  syncLockouts();
}

function renderGhosts(gIds){
  var gt=document.getElementById('ghostTabs');if(!gIds.length){gt.innerHTML='';return}
  var h='';gIds.forEach(function(id){var c=cards[id];h+='<div class="ghost-tab '+(isAnaph(c.severity)?'red':'amber')+'" onclick="restoreGhost(\''+esc(id)+'\')"><div>'+esc((c._assetLabel||'T?').split(' ')[0])+'</div></div>'});
  gt.innerHTML=h;
}

function updateSummary(){
  var ids=Object.keys(cards).filter(function(id){return !cards[id].closed_at&&!cards[id].served_at&&!isSupersededRow(cards[id])});
  var tables=new Set(),alCount=0,anCount=0,unack=0;
  ids.forEach(function(id){var c=cards[id];tables.add(c.asset_id);alCount+=(c.allergens||[]).length;if(isAnaph(c.severity))anCount++;if(!isAcked(c))unack++});
  var p=[];
  p.push('<span class="w">'+th('summary.tables',{n:tables.size})+'</span>');
  p.push('<span class="w">'+th('summary.allergies',{n:alCount})+'</span>');
  if(anCount)p.push('<span class="rd">'+th('summary.anaphylaxis',{n:anCount})+'</span>');
  if(unack)p.push('<span class="rd">'+th('summary.need_action',{n:unack})+'</span>');
  else if(ids.length)p.push('<span style="color:var(--ok)">'+th('summary.all_confirmed')+'</span>');
  document.getElementById('summaryBar').innerHTML=p.join(' · ');
}

var holdTimers={};
// Hold duration. Was 1500ms, which read as unresponsive on the floor. 1100ms still cannot be
// produced by a stray tap or a sleeve brush, so the gesture stays deliberate — this shortens
// a hold, it does not turn a safety action into an ordinary tap.
var HOLD_MS=1100;

// One place that wires a hold gesture, so the three hold buttons cannot drift apart in which
// events they listen for. touchcancel/mouseleave/blur all end the hold: a gesture that leaves
// the button must not keep counting toward a safety acknowledgement.
function HOLD_ATTRS(id,action){
  var q=esc(id), a=esc(action||'ack');
  return 'ontouchstart="startHold(\''+q+'\',this,\''+a+'\')" ontouchend="endHold(\''+q+'\',this)" '
       + 'ontouchcancel="endHold(\''+q+'\',this)" onmousedown="startHold(\''+q+'\',this,\''+a+'\')" '
       + 'onmouseup="endHold(\''+q+'\',this)" onmouseleave="endHold(\''+q+'\',this)" '
       + 'onblur="endHold(\''+q+'\',this)" onkeydown="holdKeyDown(event,\''+q+'\',this,\''+a+'\')" '
       + 'onkeyup="holdKeyUp(event,\''+q+'\',this)"';
}

// Every milestone that writes a safety field completes through the SAME gesture. Previously
// only the acknowledgement was a hold while Confirm Prep Area, Second Check and Mark Served
// were ordinary clicks — all four wearing the .hold-btn style, so three controls that fired
// on a single tap looked exactly like the one that did not. A safety write must not be
// reachable by the same gesture as scrolling past it.
var HOLD_ACTIONS={ack:doAck, prep:confirmProtocol, verify:verifyDish, serve:markServed};

// The button is passed in rather than looked up by id. Two buttons now exist for the same
// declaration at once — the collapsed row and the expanded panel — so getElementById('fill-'+id)
// matched whichever came first in the document and could animate the wrong one, or nothing.
function holdParts(el){
  if(!el)return {};
  var btn=el.closest?el.closest('.hold-btn'):el;
  return {btn:btn, fill:btn?btn.querySelector('.hold-fill'):null};
}
function startHold(id,el,action){
  var pr=holdParts(el);
  // Tell the review not to rebuild while this gesture runs: a rebuild would replace the very
  // button being held and silently cancel a deliberate safety action mid-press.
  if(pr.btn&&pr.btn.classList.contains('vfy-go'))recordHolding=true;
  if(pr.btn)pr.btn.classList.add('holding');           // instant, before the first frame
  if(pr.fill){pr.fill.style.transition='none';pr.fill.style.width='4%'}
  var start=Date.now();
  function tick(){
    var p=Math.min((Date.now()-start)/HOLD_MS,1);
    if(pr.fill)pr.fill.style.width=(4+p*96)+'%';
    if(p>=1){if(pr.btn)pr.btn.classList.remove('holding');recordHolding=false;
      // Where the hold happened decides where success is confirmed: the lockout and the
      // record sheet each confirm IN PLACE; a board row keeps its existing behaviour.
      var origin=!pr.btn||!pr.btn.closest?'row':pr.btn.closest('#lockout')?'lockout':pr.btn.closest('#verify')?'sheet':'row';
      var fn=HOLD_ACTIONS[action||'ack']||doAck;fn(id,origin);return}
    holdTimers[id]=requestAnimationFrame(tick);
  }
  holdTimers[id]=requestAnimationFrame(tick);
}
function endHold(id,el){
  recordHolding=false;
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  var pr=holdParts(el);
  if(pr.btn)pr.btn.classList.remove('holding');
  // Released early: back to nothing. A partly-filled bar left on screen would suggest the
  // acknowledgement is partly done, and it is not — it either happened or it did not.
  if(pr.fill){pr.fill.style.transition='width .12s ease-out';pr.fill.style.width='0'}
}
// Space/Enter hold the same way a finger does, so the gesture is reachable from a keyboard
// instead of being mouse/touch-only. Repeat keydown events are ignored so the hold measures
// real elapsed time rather than restarting on every auto-repeat.
function holdKeyDown(e,id,el,action){
  if(e.key!==' '&&e.key!=='Enter')return;
  e.preventDefault();
  if(e.repeat)return;
  startHold(id,el,action);
}
function holdKeyUp(e,id,el){
  if(e.key!==' '&&e.key!=='Enter')return;
  e.preventDefault();endHold(id,el);
}

// ── BOUNDED WRITES ───────────────────────────────────────────────────────────────────────
// Every AllergyShield write is bounded at WRITE_TIMEOUT_MS. Unbounded, a half-open connection
// left the card latched in _writing for the rest of the page's life with nothing on screen to
// say so — the hold stayed reachable but did nothing.
//
// A timeout is treated exactly as a refusal: full revert to the prior valid state (§12.1), a
// visible "Not saved" on the card, the hold available again. It is NOT a claim that the database
// refused — the abort cancels this client's wait, not the server's transaction. That is why the
// revert is safe: lifecycle timestamps are set-once-forward in foldDeclaration, so if the write
// did commit, the next board read (≤ RECONCILE_MS) restores the milestone from database truth and
// clears the message. The board can be briefly behind the database; it can never be ahead of it.
//
// Promise.race, not only the abort signal: the bound must hold even if a client build ignores
// the signal. Builder methods are feature-detected for the same reason boundRead detects
// .retry() — the client is a floating jsdelivr @2 build.
var WRITE_TIMEOUT_MS=10000;
function boundWrite(q){
  var ac=new AbortController(),timer=null;
  if(q&&typeof q.abortSignal==='function')q=q.abortSignal(ac.signal);
  var timeout=new Promise(function(r){timer=setTimeout(function(){
    r({data:null,error:{message:'no response within '+WRITE_TIMEOUT_MS+'ms',code:'HC_TIMEOUT'},timedOut:true});
    try{ac.abort()}catch(e){}
  },WRITE_TIMEOUT_MS)});
  var settled=Promise.resolve(q).then(function(r){return r||{}},function(e){return {data:null,error:e||{message:'rejected'}}});
  return Promise.race([settled,timeout]).then(function(r){clearTimeout(timer);return r});
}
// A milestone write on one declaration. .select('id') so a write that matched NO row is an
// error, not a silent success: PostgREST answers 204 whether 0 or N rows changed, and a row
// can leave this display's write scope between the read and the hold (its service closed).
// Without this the card would advance on screen while the database stayed unchanged.
//
// guard makes a MILESTONE write conditional, so it can only ever fill an empty milestone:
//   {col:'verified_at'} → .is(col, null)
// Without it, a retry after a timed-out write that had in fact committed rewrote the recorded
// time — altering evidence. A guarded write that matches no row sets r.noRow; the caller then
// re-reads the board to learn whether the milestone is already recorded (see settleNoRow).
function writeDeclaration(id,patch,guard){
  var q=sbv.from('allergen_declarations').update(patch).eq('id',id);
  if(guard&&q&&typeof q.is==='function')q=q.is(guard.col,null);
  if(q&&typeof q.select==='function')q=q.select('id');
  return boundWrite(q).then(function(r){
    if(!r.error&&Array.isArray(r.data)&&r.data.length===0)
      r={data:r.data,error:{message:'no row updated',code:'HC_NO_ROW'},noRow:true};
    return r;
  });
}
// A guarded milestone write matched no row: either the milestone is ALREADY recorded (another
// display, or this display's own earlier write that committed after its timeout) or the record
// has left this display's write scope. Which one is decided by reading the board, never guessed.
// Already recorded → the record is redrawn in its recorded state with a neutral notice that this
// hold changed nothing; this display never claims it recorded the step (no chime, no "done"
// confirmation flow). Not recorded → the ordinary NOT-recorded error.
async function boardRead(){
  for(var i=0;i<120&&reconcileInFlight;i++)await new Promise(function(r){setTimeout(r,100)});
  return reconcile();
}
function lockoutStageFor(c){return !c.kitchen_ack_at?'ack':!c.protocol_confirmed_at?'prep':'done'}
// If the follow-up read itself fails, the outcome is UNKNOWN and the screen says exactly that —
// never "NOT recorded", which would be a claim the board cannot make.
function showUnconfirmed(id,field){
  showRowError(id,'err.unconfirmed',{persist:1,field:field});
  if(lockoutId===id&&cards[id])renderLockout(id,lockoutStageFor(cards[id]),'err.unconfirmed');
}
// GENERATION GUARD. A milestone write resolves against the record as it was when the hold
// completed. If, while it was in flight, the record's content changed (recordContentChanged
// moved _gen on) or the record left the board (superseded, pruned, replaced), the result is
// stale: no chime, no lockout advance, no completed stage drawn from it. The optimistic change is
// undone, the board is re-read, and the record is shown as the DATABASE has it, with a notice.
// A superseded record (by either signal) is history: nothing is written to it. The hold that
// reached here ends with an honest notice, and the board moves to the successor.
function refuseSuperseded(id){
  invalidateRecord(id);
  if(recordFlow&&recordFlow.id===id)recordFlow=null;
  if(lockoutId===id)closeLockout();
  // The notice goes where the cook now is: the successor (its lockout or record), since the
  // superseded record itself is no longer shown anywhere.
  var succ=validSuccessorOf(id);if(succ&&!cards[succ])succ=null;
  if(succ){showNotice(succ,'note.superseded');if(lockoutId===succ&&!holdInProgress())renderLockout(succ,lockoutStage,lockoutErr)}
  renderCards();
}
function writeIsStale(id,c,gen){return cards[id]!==c||(c._gen||0)!==gen||isSupersededRow(c)}
// _settling (UI-ephemeral, never cached): a lockout write's outcome is still being decided by this
// board read, so the lockout policy treats the write as not yet settled. Cleared when the settle
// ends, and the lockouts are re-synced then — a preemption that waited on it happens now.
function settleEnd(c){if(c&&c._settling){delete c._settling;if(cards[c.id]===c)lockoutDwell(c.id);syncLockouts()}}
async function settleStale(id,field){var c0=cards[id];try{return await settleStaleRead(id,field)}finally{settleEnd(c0)}}
async function settleNoRow(id,field,errKey){var c0=cards[id];try{return await settleNoRowRead(id,field,errKey)}finally{settleEnd(c0)}}
async function settleStaleRead(id,field){
  var okRead=await boardRead();
  var c=cards[id];renderCards();
  if(!c)return;                                   // left the board: syncLockouts moves on
  if(!okRead){showUnconfirmed(id,field);return}
  showNotice(id,'note.changed_while_saving');
  if(lockoutId===id)renderLockout(id,lockoutStageFor(c));
}
async function settleNoRowRead(id,field,errKey){
  var okRead=await boardRead();
  var c=cards[id];if(!c)return;
  if(!okRead){showUnconfirmed(id,field);return}
  if(c[field]){
    showNotice(id,'note.already_recorded');
    if(lockoutId===id)renderLockout(id,lockoutStageFor(c));
  }else{
    var k=writeFailed(id,errKey,{error:{code:'HC_NO_ROW'}},field);
    if(lockoutId===id)renderLockout(id,lockoutStageFor(c),k);
  }
}
function showNotice(id,key){var c=cards[id];if(!c)return;c._notice=key;delete c._error;delete c._errField;renderCards();renderRecord();
  setTimeout(function(){if(cards[id]&&cards[id]._notice===key){delete cards[id]._notice;renderCards();renderRecord();
    if(lockoutId===id&&!holdInProgress())renderLockout(id,lockoutStage,lockoutErr)}},8000)}
// Which message a failed write shows. A timeout says the outcome is unknown and persists until
// resolved; a refusal says the step was not recorded.
function writeFailed(id,key,r,field){
  if(r&&r.timedOut){showRowError(id,'err.timeout',{persist:1,field:field});return 'err.timeout'}
  showRowError(id,key);return key;
}

// Optimistic-with-revert pattern: local state updates immediately so the UI
// responds to the 1.5s hold completing, then the DB write follows. On failure
// the local state is reverted to the prior valid state so the operator never
// sees an indeterminate mixed state. Chime + cache fire ONLY after the DB
// confirms — the chime now means "the database accepted the transition."
// IN-FLIGHT GUARD (_writing) — on all five write paths below.
// Without it a stalled write plus a repeating operator accumulates hung requests without
// bound. Contract: UI-ephemeral. Never written to the database. Never cached.
// It is cleared immediately after the bounded await, BEFORE the error branch — and because the
// await is now bounded, it is always cleared: a hung write ends as a timeout, not a latch.
async function doAck(id,origin){
  if(holdTimers[id]){cancelAnimationFrame(holdTimers[id]);delete holdTimers[id]}
  var c=cards[id];if(!c)return;
  // Restored from this tablet's cache and not yet confirmed by a board read: its state is not
  // known, so nothing is written to it.
  if(c._fromCache){showNotice(id,'note.checking');return}
  if(isSupersededRow(c)){refuseSuperseded(id);return}
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var gen=c._gen||0;
  // Optimistic UI only. kitchen_ack_at is NOT written here — a PATCH that hangs would
  // otherwise suppress escalation indefinitely on a card the database still shows
  // unacknowledged, and nothing would ever correct it.
  var ackAt=new Date().toISOString(),ackBy=deviceName;
  c._ackPending=ackAt;
  if(origin==='sheet'&&recordOpenId===id)recordFlow={id:id,a:'ack',phase:'saving'};
  renderCards();
  var r=await writeDeclaration(id,{kitchen_ack_at:ackAt,kitchen_ack_by:ackBy,status:'acknowledged'},{col:'kitchen_ack_at'});
  delete c._writing;lockoutDwell(id);
  if(writeIsStale(id,c,gen)){if(recordFlow&&recordFlow.id===id)recordFlow=null;delete c._ackPending;c._settling=1;renderCards();await settleStale(id,'kitchen_ack_at');return}
  if(r.noRow){if(recordFlow&&recordFlow.id===id)recordFlow=null;delete c._ackPending;c._settling=1;renderCards();await settleNoRow(id,'kitchen_ack_at','err.ack');return}
  // Rejection clears the attempt and nothing needs reverting — no safety field was ever
  // mutated. Escalation (and the repeating alarm) continue with no manual intervention.
  if(r.error){console.error('[kitchen] acknowledge failed:',r.error);if(recordFlow&&recordFlow.id===id)recordFlow=null;delete c._ackPending;
    var k=writeFailed(id,'err.ack',r,'kitchen_ack_at');
    if(lockoutId===id)renderLockout(id,'ack',k);return}
  // Accepted. Only now is this confirmed truth.
  c.kitchen_ack_at=ackAt;c.kitchen_ack_by=ackBy;c.status='acknowledged';
  delete c._ackPending;
  delete c._error;delete c._errField;delete c._notice;
  chimeAck();
  // Confirm where the operator is. The sheet confirms in place and exposes the next step; the
  // lockout keeps the SAME card and replaces only its action with the next requirement. A
  // DIFFERENT record's lockout is never touched — it used to be overwritten by this one.
  if(origin==='sheet'){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else if(lockoutId===id){if(isAnaph(c.severity))showLockoutProtocol(id);else closeLockout()}
  else if(isAnaph(c.severity)&&!lockoutId){showLockoutProtocol(id)}
  renderCards();cacheCards();
}

async function confirmProtocol(id,origin){
  var c=cards[id];if(!c)return;
  // Restored from this tablet's cache and not yet confirmed by a board read: its state is not
  // known, so nothing is written to it.
  if(c._fromCache){showNotice(id,'note.checking');return}
  if(isSupersededRow(c)){refuseSuperseded(id);return}
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var gen=c._gen||0;
  var prev={protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by};
  if(origin==='sheet'&&recordOpenId===id)recordFlow={id:id,a:'prep',phase:'saving'};
  c.protocol_confirmed_at=new Date().toISOString();c.protocol_confirmed_by=deviceName;
  renderCards();
  var r=await writeDeclaration(id,{protocol_confirmed_at:c.protocol_confirmed_at,protocol_confirmed_by:c.protocol_confirmed_by},{col:'protocol_confirmed_at'});
  delete c._writing;lockoutDwell(id);
  if(writeIsStale(id,c,gen)){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);c._settling=1;renderCards();await settleStale(id,'protocol_confirmed_at');return}
  if(r.noRow){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);c._settling=1;renderCards();await settleNoRow(id,'protocol_confirmed_at','err.prep');return}
  if(r.error){console.error('[kitchen] protocol confirm failed:',r.error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);
    var k=writeFailed(id,'err.prep',r,'protocol_confirmed_at');
    if(lockoutId===id)renderLockout(id,'prep',k);return}
  delete c._error;delete c._errField;delete c._notice;
  chimeAck();
  // Confirmed in place; the operator leaves when they choose. It used to closeLockout() here —
  // unconditionally, so it could also dismiss a DIFFERENT record's unacknowledged lockout.
  if(origin==='sheet'){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else if(lockoutId===id){renderLockout(id,'done')}
  renderCards();cacheCards();
}

async function verifyDish(id,origin){
  var c=cards[id];if(!c)return;
  // Restored from this tablet's cache and not yet confirmed by a board read: its state is not
  // known, so nothing is written to it.
  if(c._fromCache){showNotice(id,'note.checking');return}
  if(isSupersededRow(c)){refuseSuperseded(id);return}
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var gen=c._gen||0;
  var prev={verified_at:c.verified_at,verified_by:c.verified_by};
  if(recordOpenId===id)recordFlow={id:id,a:'verify',phase:'saving'};
  c.verified_at=new Date().toISOString();c.verified_by=deviceName;
  renderCards();
  var r=await writeDeclaration(id,{verified_at:c.verified_at,verified_by:c.verified_by},{col:'verified_at'});
  delete c._writing;
  if(writeIsStale(id,c,gen)){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();await settleStale(id,'verified_at');return}
  if(r.noRow){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();await settleNoRow(id,'verified_at','err.verify');return}
  if(r.error){console.error('[kitchen] verify failed:',r.error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);
    writeFailed(id,'err.verify',r,'verified_at');return}
  delete c._error;delete c._errField;delete c._notice;
  chimeAck();
  // Confirm IN PLACE. The sheet used to close here, so a deliberate safety hold ended with
  // the screen vanishing — indistinguishable from a crash. It stays open on a success state
  // until the operator chooses Mark Served or Back. Nothing further is advanced for them.
  if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done';
  renderCards();cacheCards();
}

async function markServed(id,origin){
  var c=cards[id];if(!c)return;
  // Restored from this tablet's cache and not yet confirmed by a board read: its state is not
  // known, so nothing is written to it.
  if(c._fromCache){showNotice(id,'note.checking');return}
  if(isSupersededRow(c)){refuseSuperseded(id);return}
  if(!paired()){showRowError(id,'err.not_paired');return}
  if(c._writing)return;
  c._writing=true;
  var gen=c._gen||0;
  var prev={served_at:c.served_at,status:c.status};
  var inSheet=origin==='sheet'&&recordOpenId===id;
  if(inSheet)recordFlow={id:id,a:'serve',phase:'saving'};
  c.served_at=new Date().toISOString();c.status='resolved';
  renderCards();
  var r=await writeDeclaration(id,{served_at:c.served_at,status:'resolved'},{col:'served_at'});
  delete c._writing;
  if(writeIsStale(id,c,gen)){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();await settleStale(id,'served_at');return}
  if(r.noRow){if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);renderCards();await settleNoRow(id,'served_at','err.serve');return}
  if(r.error){console.error('[kitchen] mark served failed:',r.error);if(recordFlow&&recordFlow.id===id)recordFlow=null;Object.assign(c,prev);
    writeFailed(id,'err.serve',r,'served_at');return}
  delete c._error;delete c._errField;delete c._notice;
  chimeAck();
  // From the sheet: confirm in place (Served Recorded) instead of vanishing. From a board row
  // there is no sheet to keep, so the row's existing behaviour stands.
  if(inSheet){if(recordFlow&&recordFlow.id===id&&recordOpenId===id)recordFlow.phase='done'}
  else closeRecord();
  renderCards();cacheCards();
}

/**
 * The second check, as a review screen. Opening it writes NOTHING.
 *
 * It exists because the collapsed row used to call verifyDish() directly: one tap recorded a
 * verification milestone with no review of what was being verified and no deliberate gesture.
 * Now the tap opens this, and the only way to record anything is the press-and-hold at the
 * bottom — the same gesture, duration and cancel behaviour as the acknowledgement.
 *
 * WHAT THIS SCREEN MAY AND MAY NOT SAY. Kitchen is anonymous and unpaired: `verified_by`
 * comes from a ?device= query string, and on every row in the database it equals
 * `protocol_confirmed_by`. So this screen asks a person to do something — "another team
 * member should check" — and never reports that Happy Chair established one did. The
 * substrate agrees: allergyshield_shift_record returns kitchen_identity_verified = false
 * unconditionally, and the rehearsal step is named "Kitchen verification step recorded
 * (identity unverified)".
 */
/* ── VENUE-DEVICE IDENTITY (Block 1) ──────────────────────────────────────────
 *
 * The board is pairing to this venue as authenticated VENUE-OWNED HARDWARE. The credential
 * proves WHICH DISPLAY is acting; it never proves which person did. There is no staff member
 * anywhere in this flow, and the token carries none.
 *
 * ADDITIVE ON PURPOSE. Declarations are still read exactly as before, over the anon key,
 * because venue_device has not yet been granted access to them — that is the next block.
 * Wiring the reads to this credential now would authenticate the board and then leave it
 * unable to see anything. So this establishes and proves the identity; it changes no data path.
 */
var VD_K='hc_k_venue_device';
var vdToken=null, vdJwt=null, vdJwtExp=0, vdIdentity=null, vdTimer=null;
// Venue name as read through the DEVICE credential (loadVenue, venueId from the exchange).
var vdVenueName=null;

function vdLoad(){try{var r=JSON.parse(localStorage.getItem(VD_K)||'null');
  if(r&&r.device_token&&r.device_id)vdToken=r;}catch(e){}}
function vdSave(r){vdToken=r;try{localStorage.setItem(VD_K,JSON.stringify(r))}catch(e){}}
function vdForget(){vdToken=null;vdJwt=null;vdIdentity=null;vdVenueName=null;try{localStorage.removeItem(VD_K)}catch(e){}}

// device token -> short-lived venue JWT. Re-run before expiry; a failure is surfaced, never
// silently retried into a loop.
async function vdExchange(){
  if(!vdToken)return null;
  try{
    var res=await fetch(SUPABASE_URL+'/functions/v1/venue-device-token',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+vdToken.device_token,'Content-Type':'application/json'},
      body:JSON.stringify({action:'exchange',device_id:vdToken.device_id})});
    var j=await res.json();
    if(!res.ok){
      // A revoked or rotated display must not keep presenting a dead credential.
      if(res.status===401)vdForget();
      console.error('[kitchen] venue token exchange failed:',j&&j.error);return null;
    }
    vdJwt=j.access_token;vdJwtExp=new Date(j.expires_at).getTime();
    vdIdentity={venue_id:j.venue_id,display_name:j.display_name,device_role:j.device_role};
    venueId=j.venue_id;            // from the CREDENTIAL, never from the query string
    vdClient();
    vdRenderStatus();
    // Refresh at 80% of the window so a slow network still lands before expiry.
    if(vdTimer)clearTimeout(vdTimer);
    vdTimer=setTimeout(vdExchange, Math.max(60000,(vdJwtExp-Date.now())*0.8));
    return vdJwt;
  }catch(e){console.error('[kitchen] venue token exchange error:',e);return null}
}

// Proof the credential resolves, asked of the server with NO arguments — there is no
// parameter here for a caller to nominate a venue with.
async function vdWhoAmI(){
  if(!vdJwt)return null;
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/rpc/venue_device_context',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+vdJwt,'Content-Type':'application/json'},
      body:'{}'});
    var rows=await res.json();
    return (Array.isArray(rows)&&rows[0])||null;
  }catch(e){return null}
}

// The authenticated client. Every board read and every AllergyShield write goes through
// THIS, not the anon client — venue scope comes from the credential, and the server decides
// what the credential may see. Rebuilt on each refresh so the header always carries a live JWT.
var sbv=null;
function vdClient(){
  if(!vdJwt)return null;
  sbv=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    global:{headers:{Authorization:'Bearer '+vdJwt}},
    auth:{persistSession:false,autoRefreshToken:false}});
  try{sbv.realtime.setAuth(vdJwt)}catch(e){}
  return sbv;
}
function paired(){return !!(vdToken&&vdJwt&&sbv)}

function vdRenderStatus(){
  var el=document.getElementById('vdStatus');if(!el)return;
  if(vdIdentity){el.textContent=tt('status.paired',{display:vdIdentity.display_name});el.className='vd-st ok'}
  else{el.textContent=tt('status.not_paired');el.className='vd-st'}
}

function openPair(){
  var lk=document.getElementById('pair'),lc=document.getElementById('pairContent');
  // A language change re-runs this; keep whatever has been typed.
  var prev=document.getElementById('pairCode'),typed=prev?prev.value:'';
  // The two bold names are Admin's own (English) labels, so they stay as data.
  lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('pair.title')+'</div>'
    +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closePair()">&times;</button></div>'
    +'<div class="vfy-body">'+th('pair.body',{path:{html:'<b>Set Up &rarr; Kitchen Displays</b>'},action:{html:'<b>Add Kitchen Display</b>'}})+'</div>'
    +'<input id="pairCode" class="pair-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="'+esc(typed)+'">'
    +'<div id="pairErr" class="vfy-honest"></div>'
    +'<button type="button" class="hold-btn green vfy-go" onclick="submitPair()"><span class="hold-lbl">'+th('pair.button')+'</span></button>';
  lk.classList.add('on');
  setTimeout(function(){var i=document.getElementById('pairCode');if(i)i.focus()},50);
}
function closePair(){document.getElementById('pair').classList.remove('on')}

async function submitPair(){
  var input=document.getElementById('pairCode'),err=document.getElementById('pairErr');
  var code=(input.value||'').trim();
  if(!/^[0-9]{6}$/.test(code)){err.textContent=tt('pair.need_code');return}
  err.textContent=tt('pair.pairing');
  try{
    var res=await fetch(SUPABASE_URL+'/functions/v1/venue-device-token',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({action:'claim',code:code})});
    var j=await res.json();
    if(!res.ok){console.error('[kitchen] pairing refused:',j&&j.error);err.textContent=tt('pair.failed');return}
    vdSave({device_token:j.device_token,device_id:j.device_id});
    await vdExchange();
    var who=await vdWhoAmI();
    err.textContent='';
    closePair();
    // States what was established, and is careful about what was not: this identifies the
    // DISPLAY, not whoever is standing at it.
    vdRenderStatus();
    // Newly paired: the board has authority now, so start it.
    loadDeviceLocale();
    loadVenue();reconcile();subscribe();startReconcileLoop();
    // Shown on the PAIRING overlay, which this flow owns. It used to be written into the
    // record sheet's own surface and that sheet's 'on' class set by hand, so a pairing
    // confirmation and an open record fought over one container with no state saying which
    // was up.
    var lc=document.getElementById('pairContent');
    if(lc){lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('pair.done_title')+'</div>'
      +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closePair()">&times;</button></div>'
      +'<div class="vfy-tbl">'+esc((who&&who.venue_name)||tt('pair.this_venue'))+'</div>'
      +'<div class="vfy-guest">'+esc((who&&who.display_name)||'Kitchen Display')+'</div>'
      +'<div class="vfy-honest">'+th('pair.done_body')+'</div>';
      document.getElementById('pair').classList.add('on')}
  }catch(e){err.textContent=tt('pair.unreachable')}
}

// ── THE RECORD SHEET ─────────────────────────────────────────────────────────────────────
// ONE detail surface for a declaration, and the only one. There used to be two: an inline
// panel that expanded under the row, and this overlay. Both carried a Second Check control,
// both carried the guest and the cross-contact request, and they disagreed about whether the
// elapsed time and the stage rail belonged to either of them. A kitchen does not need a
// collapsed card, an expanded card AND a review; it needs the board and one record.
//
// WHICH record is open is application state, not a DOM fact. The sheet used to exist only as
// innerHTML on a detached overlay, so anything that re-entered the board could leave it
// inconsistent with nothing able to put it back. It is re-asserted from this id after every
// render instead.
var recordOpenId=null;
// Signature of what was last drawn, so a 5-second poll does not rebuild an unchanged sheet
// underneath the operator.
var recordSig=null;
// True while a hold is running on the sheet's button. A rebuild mid-hold would destroy the
// gesture and the progress fill, so the sheet is never rebuilt while one is in progress.
var recordHolding=false;
// Second Check ONLY: {id, phase:'saving'|'done'}. 'saving' freezes the review while the write
// is in flight, so the sheet never shows the next action before the database accepts this
// one. 'done' is the success state — application state, so a poll or token refresh
// re-asserts it rather than erasing it. Cleared only by the operator (close / open another).
var recordFlow=null;

// Navigation only. Opening a record can never be the same act as recording something about
// it: the row's Second Check used to call verifyDish() directly, so one tap wrote a safety
// milestone with no review and no deliberate gesture.
function openRecord(id){
  if(!cards[id])return;
  recordOpenId=id;recordFlow=null;
  recordSig=null;
  renderRecord();
}

function closeRecord(){
  recordOpenId=null;recordSig=null;recordHolding=false;recordFlow=null;
  var lk=document.getElementById('verify');if(lk)lk.classList.remove('on');
}

// The single next required action for this record, as one press-and-hold. Same four functions
// in the same order as the row's control — one workflow, two places it can be reached from,
// and only ever one of them on screen because the sheet is a full-screen overlay.
function recordAction(c){
  var an=isAnaph(c.severity),acked=isAcked(c),proto=!!c.protocol_confirmed_at;
  if(c.served_at)return null;
  // Labels come from the catalog at render time; the step itself (a) is the state machine and
  // is identical in every language.
  if(!acked)return {a:'ack',  label:tt('hold.ack'), cls:an?'red':'amber', aria:tt('hold.ack')};
  if(!proto&&an)return {a:'prep', label:tt('hold.prep'), cls:'red', aria:tt('hold.prep')};
  if(!c.verified_at)return {a:'verify', label:tt('hold.verify'), cls:'act', aria:tt('hold.verify'), check:true};
  return {a:'serve', label:tt('hold.serve'), cls:'', aria:tt('hold.serve')};
}

// The four-stage rail with recorded times. Shared by the review and the Second Check success
// state so the two can never disagree about which stages are complete.
function railHtml(c){
  var acked=isAcked(c),verified=!!c.verified_at,isSrv=!!c.served_at,h='';
  // A completed milestone reads as completed — the existing success class (dv / v) — whatever
  // stage the record has reached. It used to be amber while in progress and grey once served,
  // so the moment every step was done the rail looked disabled.
  function st(done,label,ts){return '<div class="ps"><div class="pd'+(done?' dv':'')+'">'+(done?CK:'')
    +'</div><div class="plbl'+(done?' v':'')+'">'+label+'</div>'+(done?'<div class="ptm">'+fmtTime(ts)+'</div>':'')+'</div>'}
  function ln(done){return '<div class="pln'+(done?' v':'')+'"></div>'}
  h+='<div class="prog">'+st(true,th('rail.received'),c.created_at)+ln(acked)+st(acked,th('rail.confirmed'),c.kitchen_ack_at)
    +ln(verified)+st(verified,th('rail.second_check'),c.verified_at)+ln(isSrv)+st(isSrv,th('rail.served'),c.served_at)+'</div>';
  return h;
}

// The top of the record sheet, shared by the ordinary record, Second Check Recorded and Served
// Recorded so the three are visibly one component advancing — same blocks, same order, same
// spacing — rather than three screens that happen to look alike.
function recordHeadHtml(c,title,done,okA){
  var id=c.id,an=isAnaph(c.severity),isSrv=!!c.served_at,h='';
  h+='<div class="vfy-hd"><div class="vfy-hl">'
    +(isRehearsal(c)?'<div class="vfy-reh">'+th('reh.full')+'</div>':'')
    +'<div class="vfy-t'+(done?' vfy-t--done':'')+'">'+(done?CK_DONE:'')+th(title)+'</div></div>'
    +'<button type="button" class="vfy-x" aria-label="'+th(done?'nav.back':'nav.close')+'" onclick="closeRecord()">&times;</button></div>';
  if(okA)h+='<div class="vfy-ok" role="status">'+CK_DONE+'<span>'+th(okA==='ack'?'ok.ack':'ok.prep')
    +'</span><span class="vfy-ok-t">'+th('ok.recorded',{time:fmtTime(okA==='ack'?c.kitchen_ack_at:c.protocol_confirmed_at)})+'</span></div>';
  // _error holds a catalog KEY, so the message follows a language change.
  if(c._error)h+='<div class="row-err">'+th(c._error)+'</div>';
  else if(c._notice)h+='<div class="vfy-note" role="status">'+th(c._notice)+'</div>';
  // The row abbreviates and may truncate; the record never does.
  h+='<div class="vfy-tbl">'+esc(c._assetLabel||tt('misc.table'))+'</div>';
  if(c.guest_name&&String(c.guest_name).trim())
    h+='<div class="vfy-guest">'+esc(String(c.guest_name).trim())+'</div>';
  var also=isSrv?0:sameVisitOthers(c);
  if(also)h+='<div class="vfy-also">'+th('card.also_here',{n:also})+'</div>';
  h+='<div class="vfy-al'+(an?' an':'')+'">'+esc((c.allergens||[]).join(', '))+'</div>';
  h+='<div class="vfy-marks"><span class="vfy-sev'+(an?' an':'')+'">'+sevLabel(c.severity)+'</span>'
    +(c.cross_contact?'<span class="vfy-xc">'+th('chip.cross_contact')+'</span>':'')+'</div>';
  // Cross-contact is stated ONCE, as the chip. The sentence repeating it is gone.
  var owed=owedStep(c);
  if(owed&&!isSrv)h+='<div class="vfy-el">'+th('step.waiting',{step:owed.label,
    time:{html:'<span id="timer-'+esc(id)+'">'+fmtTimer(owed.since)+'</span>'}})+'</div>';
  return h;
}

// What the operator must do at each step — one sentence, imperative, no rationale.
function stepDo(a){return th('do.'+a)}

// Provenance, stated once and small: the display records, never a person. Same line on every
// state and on the lockout.
function provHtml(){
  return '<div class="vfy-prov">'+th('prov.line',{display:(vdIdentity&&vdIdentity.display_name)||tt('prov.this_display'),
    venue:vdVenueName||tt('prov.this_venue')})+'</div>';
}

// The safety reference a cook prepares from: Avoid all / Check ingredients, then guest notes.
// Shown at every stage until the record is served.
function referenceHtml(c){
  var an=isAnaph(c.severity),sv=(c.severity||'').toLowerCase(),isSrv=!!c.served_at,h='';
  var sevCol=an?'var(--danger)':sv==='severe'?'var(--warn)':sv==='discomfort'?'var(--cyan)':'var(--t2)';
  // Avoid all — one block per declared allergen, hit or miss. Severity gates prominence
  // (.low), never existence: an allergen with no derivative list is the one most likely to be
  // mishandled, so it must never be the one we omit. This is the information a cook prepares
  // from, which is why the sheet has to be reachable from any stage of the record and not only
  // at the second check.
  if(!isSrv){
    var lowW=(an||sv==='severe')?'':' low';
    (c.allergens||[]).forEach(function(a){
      var defs=getAllergenDef(a);
      // defs.map(esc) not esc(defs.join(…)) — the ' · ' separator is ours and must stay
      // literal. Same reasoning for the ' — ' in the heading.
      if(defs)h+='<div class="avoid'+lowW+'" style="border-color:'+sevCol+'"><div class="avoid-t" style="color:'+sevCol+'">'+th('ref.avoid_all',{allergen:a})+'</div><div class="avoid-l">'+defs.map(esc).join(' · ')+'</div></div>';
      else h+='<div class="avoid avoid-miss'+lowW+'"><div class="avoid-t">'+th('ref.check_ingredients',{allergen:a})+'</div><div class="avoid-l">'+th('ref.no_list')+'</div></div>';
    });
    // Say so when the reference data is not in the display's language, rather than let an
    // English list sit under a translated heading as though it had been translated.
    if((c.allergens||[]).length&&locale!==DATA_LOCALE)h+='<div class="ref-untr">'+th('ref.untranslated')+'</div>';
  }

  // ⚠ MUST STAY WRAPPED IN esc(). `notes` is guest-authored free text arriving through an
  // UNAUTHENTICATED insert — anyone holding the publishable key can write it, for any venue.
  //
  // Rendered VERBATIM, attributed, and BELOW the Avoid all blocks: the derivative lists are
  // the curated instruction and lead, guest notes are context for them. Promoting guest free
  // text above curated safety data would rank the less-verified source higher. Unlabelled it
  // sat in operator-instruction position and the guest's words read as the system's own.
  if(c.notes&&!isSrv)h+='<div class="al-notes-h">'+th('notes.heading')+'</div><div class="al-notes">'+esc(c.notes)+'</div>';

  return h;
}

// The bottom of every actionable state: one instruction, the hold, the provenance line.
function actionTailHtml(c,act,back){
  if(!act)return '<div class="vfy-act">'+provHtml()+'</div>';
  return '<div class="vfy-act"><div class="vfy-do">'+stepDo(act.a)+'</div>'
    +'<button type="button" class="hold-btn '+act.cls+' vfy-go" aria-label="'+esc(act.aria)+'" '
    +(act.cls?'':'style="background:var(--s2);border:1px solid var(--b2);color:var(--t1)" ')
    +HOLD_ATTRS(c.id,act.a)
    +'><div class="hold-fill"></div><span class="hold-lbl">'+esc(act.label)+'</span></button>'
    +provHtml()
    +(back?'<button type="button" class="vfy-back" onclick="closeRecord()">'+th('nav.back')+'</button>':'')+'</div>';
}

// Draws (or re-asserts) the sheet from state. Called by openRecord AND at the end of every
// renderCards(), so a board refresh can never leave the operator somewhere they did not ask
// to be.
function renderRecord(){
  if(!recordOpenId)return;
  var lk=document.getElementById('verify'),lc=document.getElementById('verifyContent');
  if(!lk||!lc)return;
  lk.classList.add('on');            // always re-assert: cheap and idempotent
  if(recordHolding)return;           // never rebuild under a running gesture

  var c=cards[recordOpenId];
  if(c&&isSupersededRow(c))c=null;   // replaced by a newer record: shown as no longer on the board
  if(!c){
    // The declaration left the board while the sheet was open — served elsewhere, closed, or
    // the service ended. Say so explicitly instead of silently dropping the operator back to
    // the board with no idea why.
    if(recordSig==='gone|'+locale)return;
    recordSig='gone|'+locale;
    lc.innerHTML='<div class="vfy-hd"><div class="vfy-t">'+th('title.gone')+'</div>'
      +'<button type="button" class="vfy-x" aria-label="'+th('nav.close')+'" onclick="closeRecord()">&times;</button></div>'
      +'<div class="vfy-do">'+th('do.gone')+'</div>'
      +'<button type="button" class="vfy-back vfy-back--only" onclick="closeRecord()">'+th('nav.back')+'</button>';
    return;
  }

  if(recordFlow&&recordFlow.id!==recordOpenId)recordFlow=null;
  if(recordFlow&&recordFlow.phase==='saving')return;   // never show the next step before the write lands
  if(recordFlow&&recordFlow.phase==='done'&&recordFlow.a==='verify'&&c.verified_at&&!c.served_at){renderSecondCheckDone(c,lc);return}
  // A served record — just served here, or reopened later — is the completed state. It used to
  // fall through to "Served at … Nothing further to record.", which repeated the rail.
  if(c.served_at){renderServedDone(c,lc);return}
  // Received / Prep confirmed from the sheet: the ordinary record, now showing the NEXT
  // requirement, with the completed milestone stated at the top. No extra click.
  var okA=(recordFlow&&recordFlow.phase==='done'&&(recordFlow.a==='ack'&&c.kitchen_ack_at||recordFlow.a==='prep'&&c.protocol_confirmed_at))?recordFlow.a:'';
  var id=c.id,an=isAnaph(c.severity),sv=(c.severity||'').toLowerCase();
  var acked=isAcked(c),proto=!!c.protocol_confirmed_at,verified=!!c.verified_at,isSrv=!!c.served_at;
  var act=recordAction(c);
  // Everything the sheet renders, and nothing it does not. The elapsed time is deliberately
  // absent: it is updated in place by the one-second tick, so putting created_at here would
  // be harmless but putting the formatted value here would rebuild the sheet every second.
  var sig=[id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c.notes,
           c._assetLabel,c.kitchen_ack_at,c.protocol_confirmed_at,c.verified_at,c.served_at,
           c._error||'',c._notice||'',c._ackPending?1:0,vdVenueName||'',c.service_kind,okA,sameVisitOthers(c),locale].join('|');
  if(sig===recordSig)return;         // unchanged — leave the sheet exactly as it is
  recordSig=sig;

  var sevCol=an?'var(--danger)':sv==='severe'?'var(--warn)':sv==='discomfort'?'var(--cyan)':'var(--t2)';
  var owedNow=owedStep(c);
  var h=recordHeadHtml(c,owedNow?owedNow.key:'title.record',false,okA);

  // The four stages with their recorded times. This replaces a separate "Already recorded"
  // pair that listed two of the same timestamps in a second format — the rail says when the
  // kitchen received it and when the prep area was confirmed, labelled, in one place.
  h+=railHtml(c);

  h+=referenceHtml(c);
  // ONE instruction for the step, the hold, and one short provenance line. The heading, the
  // explanatory paragraph and the two-sentence disclosure were operational reading.
  h+=actionTailHtml(c,act);
  lc.innerHTML=h;
}


// Second Check success. Same header, identity lines and rail as the review, so it is
// unmistakably the SAME record; the rail now shows Second Check complete. Mark Served is
// offered as a hold (same gesture as every safety write) and is never performed for the
// operator. Back writes nothing.
var CK_DONE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
function renderSecondCheckDone(c,lc){
  var id=c.id;
  var sig=['done',id,c.severity,(c.allergens||[]).join(','),c.cross_contact,c.guest_name,c.notes,c._assetLabel,
